<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Long Way Here</title>
<meta name="description" content="A four-minute film rendered live in your browser: from the first light of the universe, through a black hole, to the pale blue dot, and you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #05060b;
    --text: #ece9f4;
    --dim: #8f8daa;
    --faint: rgba(236, 233, 244, 0.16);
    --dot: #9cc6ff;
    --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); overflow: hidden; }
  body {
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ov { pointer-events: none; }

  /* ---------- title card ---------- */
  #intro {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: 0 16px;
    text-align: center;
    transition: opacity 2.6s ease;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .wrap { max-width: 34rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  .eyebrow, .note, .ctl, #cap, .credit, .tick {
    font-family: var(--mono);
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: 0.22em;
  }
  .eyebrow { font-size: 11px; color: var(--dim); margin: 0; }
  h1 {
    margin: 0;
    font-weight: 200;
    font-size: clamp(2.9rem, 10vw, 6rem);
    line-height: 0.92;
    letter-spacing: -0.025em;
    font-variation-settings: "opsz" 72;
    text-wrap: balance;
  }
  h1 em { font-style: italic; font-weight: 300; color: var(--dot); }
  .sub {
    margin: 0;
    max-width: 27rem;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.05rem, 2.6vw, 1.22rem);
    line-height: 1.55;
    color: var(--dim);
    text-wrap: balance;
  }
  #begin {
    margin-top: 0.5rem;
    display: inline-flex; align-items: center; gap: 0.9rem;
    padding: 0.85rem 1.6rem 0.85rem 1.2rem;
    border-radius: 999px;
    border: 1px solid var(--faint);
    background: rgba(5, 6, 11, 0.35);
    color: var(--text);
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.4s ease, background 0.4s ease;
  }
  #begin:hover { border-color: rgba(156, 198, 255, 0.55); background: rgba(156, 198, 255, 0.06); }
  #begin:focus-visible, .ctl:focus-visible { outline: 1px solid var(--dot); outline-offset: 4px; }
  .pip {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--dot);
    box-shadow: 0 0 12px 3px rgba(156, 198, 255, 0.55);
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 0.45; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
  .note { font-size: 10px; color: var(--dim); margin: 0; min-height: 1em; opacity: 0.8; }

  /* ---------- narration ---------- */
  #stage {
    position: fixed; left: 0; right: 0;
    bottom: calc(13vh + env(safe-area-inset-bottom, 0px));
    padding: 0 16px;
    display: flex; flex-direction: column; align-items: center; gap: 1.1rem;
    pointer-events: none;
    text-align: center;
  }
  #narr {
    margin: 0;
    max-width: 38rem;
    font-weight: 300;
    font-size: clamp(1.3rem, 3.3vw, 2.05rem);
    line-height: 1.34;
    letter-spacing: -0.005em;
    text-wrap: balance;
    text-shadow: 0 0 28px rgba(0, 0, 0, 0.85), 0 0 3px rgba(0, 0, 0, 0.6);
    min-height: 1.4em;
  }
  #narr .w {
    display: inline-block;
    opacity: 0;
    filter: blur(9px);
    transform: translateY(0.3em);
    transition: opacity 1.7s ease, filter 1.7s ease, transform 1.9s cubic-bezier(0.2, 0.7, 0.2, 1);
    transition-delay: var(--d, 0s);
  }
  #narr.on .w { opacity: 1; filter: blur(0); transform: none; }
  #narr.off .w { transition-duration: 0.9s; transition-delay: 0s; }
  #cap {
    margin: 0; min-height: 1em;
    font-size: 10.5px; color: var(--dim);
    font-variant-numeric: tabular-nums;
    transition: opacity 1.2s ease;
    text-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
  }
  #cap.hide { opacity: 0; }

  /* ---------- controls ---------- */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 16px calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 14px;
    transition: opacity 1.2s ease;
  }
  .bar.idle { opacity: 0.22; }
  .ctl {
    background: none; border: 0; padding: 10px 4px;
    color: var(--dim); font-size: 10.5px; cursor: pointer;
    white-space: nowrap;
    transition: color 0.3s ease;
  }
  .ctl:hover { color: var(--text); }
  .track { position: relative; flex: 1; height: 1px; background: var(--faint); margin-top: 14px; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--text); opacity: 0.6; }
  .tick { position: absolute; bottom: 7px; transform: translateX(-2px); font-size: 9px; letter-spacing: 0.16em; color: var(--dim); white-space: nowrap; }
  .tick::after { content: ""; position: absolute; left: 1px; top: calc(100% + 3px); width: 1px; height: 5px; background: var(--faint); }
  @media (max-width: 640px) { .tick { font-size: 0; } }

  #nameIn {
    position: fixed; z-index: 5;
    transform: translate(-50%, 16px);
    width: 11rem;
    padding: 6px 2px;
    background: transparent;
    border: 0; border-bottom: 1px solid var(--faint);
    color: var(--text);
    font-family: var(--mono); font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase;
    text-align: center;
    outline: none;
    caret-color: var(--dot);
  }
  #nameIn::placeholder { color: var(--dim); opacity: 0.7; }
  #nameIn:focus { border-bottom-color: rgba(156, 198, 255, 0.6); }

  #end {
    position: fixed; left: 0; right: 0; top: calc(9vh + env(safe-area-inset-top, 0px));
    padding: 0 16px;
    display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
    text-align: center;
    animation: rise 2.4s ease both;
  }
  .credit { margin: 0; font-size: 9.5px; color: var(--dim); opacity: 0.75; max-width: 30rem; line-height: 1.8; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    #narr .w { filter: none !important; transform: none !important; }
    .pip { animation: none; }
  }
</style>
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>

<main id="intro">
  <div class="wrap">
    <p class="eyebrow">13.8 billion years &middot; about four minutes</p>
    <h1>The Long Way <em>Here</em></h1>
    <p class="sub" id="sub">A short film rendered live in your browser, from the first light to you. Sound on. Lights down, if you can.</p>
    <button id="begin" type="button"><span class="pip" aria-hidden="true"></span><span>Begin</span></button>
    <p class="note" id="note"></p>
  </div>
</main>

<section id="stage" aria-live="polite">
  <p id="narr"></p>
  <p id="cap"></p>
</section>

<input id="nameIn" type="text" maxlength="24" placeholder="their name" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Name for this star" hidden>

<div id="end" hidden>
  <button id="again" class="ctl" type="button">Begin again</button>
  <p class="credit">Rendered live from a few hundred lines of math. No images. No recordings. Just light, arithmetic, and you.</p>
</div>

<nav id="bar" class="bar" hidden>
  <button id="mute" class="ctl" type="button" aria-pressed="false">Sound on</button>
  <div class="track" id="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <button id="skip" class="ctl" type="button">Skip &rsaquo;</button>
</nav>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec3  uWa;        // weights: prelude, nebula, black hole
uniform vec2  uWb;        // weights: earth, title sky
uniform float uP0, uPulse, uExp;
uniform float uNeb, uIgn, uNova;
uniform float uBH;
uniform float uEarthDist, uEarthT, uBeam, uSkyAmt;
uniform vec2  uOff, uMouse;
uniform float uFix, uFlash;
uniform sampler2D uNoise;

float hash13(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
vec3  hash33(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
mat2  rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

// 3D value noise from a 2D texture (one fetch per call)
float noise(vec3 x){
  vec3 p = floor(x); vec3 f = fract(x);
  f = f * f * (3. - 2. * f);
  vec2 uv = (p.xy + vec2(37., 17.) * p.z) + f.xy;
  vec2 rg = texture2D(uNoise, (uv + .5) / 256.).yx;
  return mix(rg.x, rg.y, f.z);
}
float fbm(vec3 p){
  float a = .5, s = 0.;
  for (int i = 0; i < 5; i++){ s += a * noise(p); p = p * 2.02 + vec3(1.7, 9.2, 3.1); a *= .5; }
  return s;
}

// ---------------------------------------------------------------- sky
vec3 starLayer(vec3 d, float sc, float seed, float dens, float pa){
  if (dens <= 0.) return vec3(0.);
  vec3 p = d * sc; vec3 id = floor(p);
  float h = hash13(id + seed);
  if (h < 1. - dens) return vec3(0.);
  float m = (h - (1. - dens)) / dens;
  vec3 o = hash33(id + seed + .37) * .8 + .1;
  vec3 q = fract(p) - o;
  q = (q - d * dot(q, d)) / sc;      // tangential offset only, in radians
  float r2 = dot(q, q);
  float s2 = pa * pa * .55;
  float m4 = m * m * m * m;
  float b = exp(-r2 / s2) + m4 * .05 * s2 / (r2 + s2 * .2);
  float tw = .75 + .25 * sin(uTime * (1. + m * 3.) + h * 80.);
  vec3 c = mix(vec3(1., .74, .52), vec3(.74, .85, 1.), hash13(id + seed + 9.));
  return c * b * (.022 + m4 * m4 * 3.) * tw;
}
vec3 sky(vec3 d, float pa){
  vec3 col = starLayer(d, 45., 1., .32, pa) + starLayer(d, 90., 7., .24, pa) + starLayer(d, 170., 13., .18, pa);
  vec3 bn = normalize(vec3(.35, 1., .25));
  float lat = dot(d, bn);
  float band = exp(-lat * lat * 14.);
  float dust = fbm(d * 3.3 + 3.);
  float gl = fbm(d * 7. + dust * 1.6);
  vec3 g = mix(vec3(.22, .17, .32), vec3(.95, .78, .6), gl) * band * (.25 + gl);
  col += g * .17;
  col += starLayer(d, 300., 19., .3 * band, pa) * .4;
  col *= 1. - .7 * smoothstep(.5, .72, dust) * band;
  return col;
}

// ---------------------------------------------------------------- 0 · before
vec3 scenePrelude(vec2 uv){
  float r = length(uv);
  float p = uP0;
  float g = (p * p * .00022 + uPulse * .0005) / (r * r + .00003 + .0003 * (1. - p));
  vec3 col = vec3(.85, .9, 1.) * g;
  col += vec3(.35, .45, 1.) * (p * .05 + uPulse * .07) * exp(-r * 5.);
  if (uExp > 0.){
    float R = uExp;
    vec3 q = vec3(uv / max(R, .02) * 2., uTime * .4);
    float n = fbm(q + fbm(q * 2.) * 1.5);
    float inside = smoothstep(R, R * .15, r);
    vec3 hot = mix(vec3(1., .9, .7), vec3(1., .4, .12), smoothstep(0., R, r));
    col += hot * inside * (.4 + n * 1.6) * 2. / (1. + uExp * 4.);
  }
  return col;
}

// ---------------------------------------------------------------- 1 · first light
vec3 sceneNebula(vec2 uv){
  float t = uNeb;
  float pa = 1. / (uRes.y * 1.4);
  vec3 rd = normalize(vec3(uv + uMouse * .02, -1.4));
  rd.xz *= rot(t * .006); rd.yz *= rot(.3);
  vec3 col = sky(rd, pa) * (.2 + .8 * uIgn);
  vec3 acc = vec3(0.);
  for (int i = 0; i < 5; i++){
    float fi = float(i);
    float zz = fi / 5. + t * .014;
    float z = fract(zz), cyc = floor(zz);
    float sc = mix(2.6, .45, z);
    float fade = smoothstep(0., .35, z) * smoothstep(1., .7, z);
    vec2 p = uv * sc + vec2(fi * 3.7 + cyc * 5.1, fi * 1.9 - cyc * 2.3) + uMouse * z * .25;
    vec3 q = vec3(p, fi * .7 + t * .015);
    float w = fbm(q * 1.1);
    float d = fbm(q * 1.5 + vec3(w * 2.2, w * 1.4, 0.));
    float dens = smoothstep(.42, .9, d);
    vec3 cLit = mix(vec3(.05, .38, .5), vec3(.8, .18, .42), smoothstep(.35, .65, w));
    cLit = mix(cLit, vec3(1., .72, .38), smoothstep(.7, .92, d));
    vec3 c = mix(vec3(.3, .08, .035) * .55, cLit, uIgn);
    acc = acc * (1. - dens * fade * .25) + c * dens * fade * (.2 + .4 * uIgn);
  }
  col += acc;
  col += vec3(1., .5, .2) * exp(-t * .35) * 1.4 * exp(-dot(uv, uv) * 5.);

  for (int i = 0; i < 5; i++){
    float fi = float(i);
    vec3 h = hash33(vec3(fi * 7.13, 2.1, 5.7));
    vec2 sp = (h.xy - .5) * vec2(1.3, .72) + uMouse * .02 * (1. + fi * .3);
    float ig = 19. + fi * 1.25;
    float on = smoothstep(ig, ig + .5, t);
    if (on <= 0.) continue;
    float fl = 1. + 3. * exp(-max(t - ig, 0.) * 1.4);
    vec2 d = uv - sp;
    float r2 = dot(d, d);
    vec3 sc = mix(vec3(.7, .85, 1.), vec3(1., .85, .6), h.z);
    if (i == 1 && uNova > 0.){
      fl += 14. * exp(-uNova * 1.1);
      on *= 1. - .85 * smoothstep(.5, 3., uNova);
      float R = uNova * .085;
      float ang = atan(d.y, d.x);
      float ring = exp(-pow((sqrt(r2) - R) * 22., 2.)) * exp(-uNova * .22);
      ring *= .5 + fbm(vec3(cos(ang) * 3., sin(ang) * 3., uNova * .2));
      float shell = smoothstep(R, R * .3, sqrt(r2)) * exp(-uNova * .3) * .25;
      col += (vec3(.95, .45, .75) * ring * 1.4 + vec3(.4, .6, 1.) * shell) * step(0., R);
    }
    float core = .00035 / (r2 + .00004);
    float spikes = (exp(-abs(d.x) * 420.) * exp(-abs(d.y) * 22.) + exp(-abs(d.y) * 420.) * exp(-abs(d.x) * 22.)) * .5;
    col += sc * (core + spikes + .05 * exp(-r2 * 12.)) * on * fl;
  }
  return col;
}

// ---------------------------------------------------------------- 2 · collapse
vec3 bbCol(float x){
  x = clamp(x, 0., 3.);
  vec3 c = vec3(1., .26, .05) * smoothstep(0., .5, x);
  c = mix(c, vec3(1., .7, .36), smoothstep(.4, 1., x));
  c = mix(c, vec3(1., .95, .88), smoothstep(.9, 1.6, x));
  c = mix(c, vec3(.72, .82, 1.), smoothstep(1.5, 2.6, x));
  return c;
}
vec3 diskAt(vec3 p, vec3 dir, out float a){
  a = 0.;
  float r = length(p.xz);
  if (r < 2.4 || r > 15.) return vec3(0.);
  float ang = atan(p.z, p.x);
  float a2 = ang + uBH * 1.8 / pow(r, 1.5);
  float n = fbm(vec3(cos(a2) * 2., sin(a2) * 2., r * 1.3)) * .65
          + fbm(vec3(cos(a2) * 6., sin(a2) * 6., r * 5.)) * .35;
  float edge = smoothstep(2.4, 3.3, r) * smoothstep(15., 8., r);
  float temp = pow(2.6 / r, .75);
  vec3 v = normalize(vec3(-p.z, 0., p.x)) * sqrt(.5 / r);
  float beta = length(v);
  float gam = 1. / sqrt(1. - beta * beta);
  float D = 1. / (gam * (1. - dot(v, -dir)));
  float g = sqrt(max(1. - 1. / r, .01));
  float sh = D * g;
  a = edge * clamp(n * 1.35 - .1, 0., 1.);
  float I = pow(sh, 3.5) * temp * temp * 2.4;
  return bbCol(temp * sh * 1.35) * I * a * (.5 + n);
}
vec3 sceneBH(vec2 uv){
  float t = uBH;
  float fl = 1.5 * uFix;
  float pa = 1. / (uRes.y * fl);
  uv *= rot(-.1);
  float camR = mix(30., 19., smoothstep(0., 40., t));
  float az = t * .03 + uMouse.x * .35 + .6;
  float el = .12 + uMouse.y * .07 + .02 * sin(t * .07);
  vec3 ro = camR * vec3(cos(el) * cos(az), sin(el), cos(el) * sin(az));
  vec3 fw = normalize(-ro), rt = normalize(cross(fw, vec3(0., 1., 0.))), up = cross(rt, fw);
  vec3 dir = normalize(fw * fl + uv.x * rt + uv.y * up);
  vec3 pos = ro;
  vec3 hv = cross(pos, dir); float h2 = dot(hv, hv);
  vec3 col = vec3(0.); float tr = 1.; bool captured = false;
  for (int i = 0; i < 200; i++){
    float r2 = dot(pos, pos); float r = sqrt(r2);
    if (r < 1.){ captured = true; break; }
    if (r > 45.) break;
    float dt = clamp(r * .07, .03, 2.);
    vec3 acc = -1.5 * h2 * pos / (r2 * r2 * r);
    vec3 np = pos + dir * dt;
    dir += acc * dt;
    if (pos.y * np.y < 0.){
      float f = pos.y / (pos.y - np.y);
      float a; vec3 c = diskAt(mix(pos, np, f), normalize(dir), a);
      col += c * tr; tr *= 1. - a * .9;
      if (tr < .02) break;
    }
    pos = np;
  }
  if (!captured) col += sky(normalize(dir), pa) * tr;
  return col;
}

// ---------------------------------------------------------------- 3 · home
vec3 earthSurface(vec3 n, vec3 sunD, vec3 rd){
  vec3 p = n;
  p.xy *= rot(.41);
  p.xz *= rot(uEarthT * .018 + 1.3);
  float lat = p.y;
  float cont = fbm(p * 1.9 + vec3(4., 1., 7.)) + .12 * fbm(p * 7.);
  float land = smoothstep(.54, .56, cont);
  float ice = smoothstep(.76, .8, abs(lat) + .06 * fbm(p * 9.));
  float arid = smoothstep(.45, .7, fbm(p * 4. + 2.)) * (1. - smoothstep(.15, .55, abs(abs(lat) - .3)));
  vec3 green = mix(vec3(.05, .11, .035), vec3(.1, .16, .06), fbm(p * 12.));
  vec3 landC = mix(green, vec3(.42, .32, .18), arid);
  landC = mix(landC, vec3(.18, .16, .13), smoothstep(.7, .8, cont));
  vec3 oc = mix(vec3(.003, .018, .06), vec3(.01, .08, .14), smoothstep(.48, .54, cont));
  vec3 alb = mix(oc, landC, land);
  alb = mix(alb, vec3(.85, .88, .92), ice);

  vec3 cp = n; cp.xy *= rot(.41); cp.xz *= rot(uEarthT * .022 + 1.3);
  float cw = fbm(cp * 3. + vec3(0., 0., uEarthT * .01));
  float cl = smoothstep(.5, .78, fbm(cp * 4.5 + cw * 1.8));

  float ndl = dot(n, sunD);
  float day = smoothstep(-.08, .2, ndl);
  vec3 col = alb * max(ndl + .06, 0.) / 1.06 * 2.4;
  vec3 hv = normalize(sunD - rd);
  col += (1. - land) * (1. - cl) * (1. - ice) * pow(max(dot(n, hv), 0.), 220.) * vec3(1., .85, .65) * .7 * day;

  float cn = noise(p * 95.) * .55 + noise(p * 240.) * .45;
  float coast = smoothstep(.08, 0., abs(cont - .55));
  float city = land * (1. - ice) * (1. - arid * .8) * smoothstep(.62, .82, cn) * (.25 + .75 * coast) * smoothstep(.48, .66, fbm(p * 6.));
  col += vec3(1., .62, .26) * city * (1. - smoothstep(-.18, .02, ndl)) * 1.3 * (1. - cl * .85);

  col = mix(col, vec3(1., .98, .96) * max(ndl, 0.) * 2.5, cl * .92);
  col *= mix(vec3(1.), vec3(1., .55, .35), smoothstep(.35, 0., ndl) * smoothstep(-.12, .04, ndl));
  return col;
}
vec3 sceneEarth(vec2 uv){
  float fl = 1.9 * uFix;
  float pa = 1. / (uRes.y * fl);
  float az = .35 + uEarthT * .003 + uMouse.x * .06;
  float el = .16 + uMouse.y * .04;
  vec3 ro = uEarthDist * vec3(cos(el) * sin(az), sin(el), cos(el) * cos(az));
  vec3 fw = normalize(-ro), rt = normalize(cross(fw, vec3(0., 1., 0.))), up = cross(rt, fw);
  vec2 q = uv - uOff;
  vec3 rd = normalize(fw * fl + q.x * rt + q.y * up);
  vec3 sunD = normalize(vec3(-1., .22, 1.));
  vec3 col = sky(rd, pa) * uSkyAmt;

  float tc = -dot(ro, rd);
  vec3 pc = ro + rd * tc;
  float bb = length(pc);
  float angR = asin(min(1. / uEarthDist, 1.));
  float rpx = angR / pa;

      g.gain.linearRampToValueAtTime(0.11 * vel * amp, when + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dec);
      o.connect(g); g.connect(A.bellBus); o.start(when); o.stop(when + dec + 0.05);
    });
  }
  function thump(when, s) {
    const ctx = A.ctx;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(70, when); o.frequency.exponentialRampToValueAtTime(32, when + 0.35);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(0.55 * s, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.1);
    o.connect(g); g.connect(A.fxBus); o.start(when); o.stop(when + 1.2);
  }
  function boom(when, s) {
    const ctx = A.ctx;
    const n = ctx.createBufferSource(); n.buffer = A.noise;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(3200, when); lp.frequency.exponentialRampToValueAtTime(60, when + 3.5);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(0.8 * s, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 4);
    n.connect(lp); lp.connect(g); g.connect(A.fxBus); n.start(when); n.stop(when + 4);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(90, when); o.frequency.exponentialRampToValueAtTime(28, when + 2.5);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0, when); og.gain.linearRampToValueAtTime(0.7 * s, when + 0.02);
    og.gain.exponentialRampToValueAtTime(0.0001, when + 3.5);
    o.connect(og); og.connect(A.fxBus); o.start(when); o.stop(when + 3.6);
  }
  function swell(when) {
    [38, 45, 52, 54, 57, 61, 64, 69, 78].forEach((m) => padNote(m, when, 16, 3200, 0.04));
    [74, 78, 81, 85, 86, 90].forEach((m, i) => bell(m, when + 1.2 + i * 0.42, 0.7));
  }
  const EVENTS = [
    ...BEATS.map((t, i) => ({ t, fn: (w) => thump(w, 0.5 + i * 0.09) })),
    { t: 13, fn: (w) => { boom(w, 1); [74, 78, 81, 86, 90].forEach((m, i) => bell(m, w + 0.05 + i * 0.07, 0.6)); } },
    ...[0, 1, 2, 3, 4].map((i) => ({ t: 32 + i * 1.25, fn: (w) => bell([81, 86, 83, 90, 88][i], w, 0.9) })),
    { t: 45.5, fn: (w) => boom(w, 0.45) },
    { t: 53.7, fn: (w) => { thump(w, 1.3); boom(w, 0.3); } },
    { t: 177.6, fn: swell },
  ];
  function section(T) {
    if (T < 13) return null;
    if (T < 53) return { prog: PROG_A, len: 9, cut: T < 31 ? 520 : 1100, gain: 0.03 };
    if (T < 96) return { prog: PROG_B, len: 11, cut: 430, gain: 0.035, oct: -12 };
    if (T < 144) return { prog: PROG_A, len: 9, cut: 1500, gain: 0.034 };
    if (T < 196) return { prog: PROG_A, len: 10, cut: 2000, gain: 0.036 };
    return { prog: PROG_A, len: 12, cut: 850, gain: 0.026 };
  }
  function levels(T) {
    const drone = T < 13 ? 0.5 * smooth(1, 12.5, T) : T < 53 ? 0.18 : T < 96 ? 0.6 : T < 144 ? 0.2 : T < 196 ? 0.14 : 0.1;
    const rumble = T < 13 ? 0.25 * smooth(4, 13, T) : T >= 53 && T < 96 ? 0.5 : 0;
    const shim = T < 13 ? 0.05 * smooth(4, 12.8, T) : T >= 196 ? 0.012 : 0;
    return [drone * 0.35, rumble, shim];
  }
  function audioTick(T) {
    if (!A.ctx || A.ctx.state !== 'running') return;
    const now = A.ctx.currentTime;
    if (T < A.lastT || T - A.lastT > 1.5) resyncAudio(T);
    if (now - A.lastSet > 0.1) {
      A.lastSet = now;
      const [d, r, s] = levels(T);
      A.droneG.gain.setTargetAtTime(d, now, 1.2);
      A.rumbleG.gain.setTargetAtTime(r, now, 1.2);
      A.shimG.gain.setTargetAtTime(s, now, 1.2);
    }
    for (const e of EVENTS) if (e.t > A.lastT && e.t <= T) e.fn(now + 0.02);
    const sec = section(T);
    if (T > 176 && T < 191) A.nextChord = Math.max(A.nextChord, 191);
    if (sec && T >= A.nextChord) {
      const chord = sec.prog[A.chordIdx = ((A.chordIdx || 0) + 1) % 4];
      A.cur = chord;
      chord.forEach((m) => padNote(m + (sec.oct || 0), now + 0.05, sec.len * 1.45, sec.cut, sec.gain));
      A.nextChord = T + sec.len;
    }
    if (T >= A.nextBell) {
      let next = 3;
      if (T >= 38 && T < 50) { bell(PENTA[(Math.random() * 8) | 0], now + 0.02, 0.5 + Math.random() * 0.3); next = 2.2 + Math.random() * 2.3; }
      else if (T >= 99 && T < 144 && A.cur) {
        const up = A.cur.slice(1).map((m) => m + 12);
        const pat = [0, 1, 2, 3, 2, 1];
        bell(up[pat[A.arpI++ % pat.length]], now + 0.02, 0.45 + Math.random() * 0.25); next = 1.05;
      } else if (T >= 146 && T < 176) { bell([81, 83, 86, 88, 90, 93][(Math.random() * 6) | 0], now + 0.02, 0.5); next = 1.8 + Math.random() * 1.4; }
      else if (T >= 191 && T < INTERACTIVE_AT) { bell([86, 88, 90, 93][(Math.random() * 4) | 0], now + 0.02, 0.4); next = 3 + Math.random() * 3; }
      A.nextBell = T + next;
    }
    A.lastT = T;
  }
  function setMuted(m) {
    A.muted = m;
    const btn = $('#mute');
    btn.textContent = m ? 'Sound off' : 'Sound on';
    btn.setAttribute('aria-pressed', String(m));
    if (A.ctx) A.master.gain.setTargetAtTime(m ? 0 : 0.85, A.ctx.currentTime, 0.1);
  }

  // ---------------------------------------------------------------- constellation
  const STORE = 'the-long-way-here.stars';
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(STORE) || '[]'); if (!Array.isArray(saved)) saved = []; } catch (e) { saved = []; }
  saved = saved.filter((s) => s && typeof s.x === 'number' && typeof s.y === 'number').slice(-40);
  let stars = [];
  let restored = false, sessionStars = 0, lastTap = 0, finalAt = 0;
  const nameIn = $('#nameIn');
  let editing = null;
  if (saved.length) $('#note').textContent = saved.length === 1 ? 'Your star is still here.' : 'Your ' + saved.length + ' stars are still here.';

  function persist() {
    try { localStorage.setItem(STORE, JSON.stringify(stars.slice(-40).map(({ x, y, name }) => ({ x, y, name })))); } catch (e) { /* storage unavailable */ }
  }
  function commitName() {
    if (!editing) return;
    editing.name = nameIn.value.trim().slice(0, 24);
    editing = null;
    nameIn.hidden = true; nameIn.value = '';
    persist();
  }
  nameIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); commitName(); nameIn.blur(); }
    e.stopPropagation();
  });
  nameIn.addEventListener('blur', commitName);
  nameIn.addEventListener('click', (e) => e.stopPropagation());

  function addStar(cx, cy) {
    commitName();
    const s = { x: cx / W, y: cy / H, name: '', born: T };
    stars.push(s);
    sessionStars++; lastTap = T;
    const idx = clamp(Math.floor((1 - s.y) * PENTA.length), 0, PENTA.length - 1);
    if (A.ctx) { bell(PENTA[idx], A.ctx.currentTime + 0.01, 0.9); bell(PENTA[idx] - 12, A.ctx.currentTime + 0.01, 0.35); }
    editing = s;
    nameIn.style.left = clamp(cx, 100, W - 100) + 'px';
    nameIn.style.top = clamp(cy, 20, H - 90) + 'px';
    nameIn.hidden = false;
    nameIn.focus({ preventScroll: true });
    persist();
    if (sessionStars >= 5) endPhase = Math.max(endPhase, 3);
    else if (sessionStars >= 3) endPhase = Math.max(endPhase, 2);
    else endPhase = Math.max(endPhase, 1);
  }
  addEventListener('click', (e) => {
    if (!started || T < INTERACTIVE_AT) return;
    if (e.target.closest('button, input, nav, #end')) return;
    addStar(e.clientX, e.clientY);
  });

  function drawOverlay(T, now, P) {
    octx.clearRect(0, 0, ov.width, ov.height);
    const d = DPR, w = ov.width, h = ov.height;
    const list = started ? stars : saved.map((s) => ({ ...s, born: -100 }));
    const base = started ? 1 : 0.5;
    if (started && T > 198) {
      const a = smooth(198, 203, T) * (1 - smooth(INTERACTIVE_AT + 30, INTERACTIVE_AT + 40, T) * 0.6);
      const x = w / 2 + P.off[0] * h, y = h / 2 - P.off[1] * h;
      octx.strokeStyle = 'rgba(156,198,255,' + 0.5 * a + ')';
      octx.lineWidth = 1 * d;
      octx.beginPath(); octx.arc(x, y, 11 * d, 0, Math.PI * 2); octx.stroke();
      octx.beginPath(); octx.moveTo(x + 11 * d, y); octx.lineTo(x + 34 * d, y); octx.stroke();
      octx.fillStyle = 'rgba(236,233,244,' + 0.75 * a + ')';
      octx.font = 300 * 1 + ' ' + 10 * d + 'px "IBM Plex Mono", ui-monospace, monospace';
      octx.textAlign = 'left'; octx.textBaseline = 'middle';
      if ('letterSpacing' in octx) octx.letterSpacing = 2 * d + 'px';
      octx.fillText('YOU ARE HERE', x + 40 * d, y);
    }
    if (!list.length) return;
    octx.lineWidth = 1 * d;
    for (let i = 1; i < list.length; i++) {
      const s = list[i], p = list[i - 1];
      const a = clamp((T - s.born - 0.4) * 0.8, 0, 1) * 0.2 * base;
      if (a <= 0) continue;
      octx.strokeStyle = 'rgba(190,210,255,' + a + ')';
      octx.beginPath(); octx.moveTo(p.x * w, p.y * h); octx.lineTo(s.x * w, s.y * h); octx.stroke();
    }
    octx.textAlign = 'center'; octx.textBaseline = 'top';
    octx.font = 300 + ' ' + 10.5 * d + 'px "IBM Plex Mono", ui-monospace, monospace';
    if ('letterSpacing' in octx) octx.letterSpacing = 2.2 * d + 'px';
    list.forEach((s, i) => {
      const age = T - s.born;
      if (age < 0) return;
      const a = clamp(age * 1.4, 0, 1) * base;
      const flare = Math.exp(-age * 2.2);
      const tw = reduced ? 1 : 0.82 + 0.18 * Math.sin(now * 0.0017 * (1 + (i % 3) * 0.4) + i * 1.7);
      const x = s.x * w, y = s.y * h;
      const R = (20 + 60 * flare) * d;
      const g = octx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, 'rgba(210,225,255,' + 0.55 * a * tw + ')');
      g.addColorStop(0.25, 'rgba(160,190,255,' + 0.16 * a * tw + ')');
      g.addColorStop(1, 'rgba(160,190,255,0)');
      octx.fillStyle = g; octx.beginPath(); octx.arc(x, y, R, 0, Math.PI * 2); octx.fill();
      const L = (9 + 40 * flare) * d * tw;
      octx.strokeStyle = 'rgba(235,240,255,' + 0.45 * a + ')';
      octx.beginPath(); octx.moveTo(x - L, y); octx.lineTo(x + L, y); octx.moveTo(x, y - L); octx.lineTo(x, y + L); octx.stroke();
      octx.fillStyle = 'rgba(255,255,255,' + a + ')';
      octx.beginPath(); octx.arc(x, y, (1.6 + 2.5 * flare) * d, 0, Math.PI * 2); octx.fill();
      if (s.name && s !== editing) {
        octx.fillStyle = 'rgba(236,233,244,' + 0.72 * a + ')';
        octx.fillText(s.name.toUpperCase(), x, y + 16 * d);
      }
    });
  }

  // ---------------------------------------------------------------- controls
  const intro = $('#intro'), endEl = $('#end');
  function begin(fromStart) {
    audioInit();
    if (fromStart) {
      T = 0; stars = []; restored = false; sessionStars = 0; endPhase = 0; finalAt = 0;
      endEl.hidden = true; commitName();
      resyncAudio(0);
    }
    started = true; running = true;
    intro.classList.add('gone');
    setTimeout(() => { intro.hidden = true; }, 2600);
    bar.hidden = false; wake();
    try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* optional */ }
  }
  $('#begin').addEventListener('click', () => begin(true));
  $('#again').addEventListener('click', (e) => { e.stopPropagation(); begin(true); });
  $('#mute').addEventListener('click', () => setMuted(!A.muted));
  function skip() {
    if (!started) return;
    const next = CHAPTERS.find((c) => c.t > T + 0.5);
    T = next ? next.t - 0.2 : Math.max(T, INTERACTIVE_AT);
    resyncAudio(T);
    wake();
  }
  $('#skip').addEventListener('click', skip);
  addEventListener('keydown', (e) => {
    if (e.target === nameIn) return;
    if (e.key === 'ArrowRight') skip();
    else if (e.key === 'm' || e.key === 'M') setMuted(!A.muted);
  });
  document.addEventListener('visibilitychange', () => {
    if (!started) return;
    running = !document.hidden;
    if (A.ctx) (document.hidden ? A.ctx.suspend() : A.ctx.resume()).catch(() => {});
  });

  // ---------------------------------------------------------------- loop
  let last = performance.now(), perfAcc = 0, perfN = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (running) T += dt;
    const k = 1 - Math.exp(-dt * (reduced ? 0.8 : 2));
    mouse.x += (mouse.tx - mouse.x) * k;
    mouse.y += (mouse.ty - mouse.y) * k;

    // adaptive resolution (before drawing: resizing clears the canvas)
    perfAcc += dt; perfN++;
    if (perfN >= 40) {
      const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
      if (avg > 0.026 && quality > 0.34) { quality = Math.max(0.34, quality * 0.85); resize(); }
      else if (avg < 0.0145 && quality < 1) { quality = Math.min(1, quality * 1.08); resize(); }
    }

    const P = params(T);
    gl.uniform2f(U.uRes, glc.width, glc.height);
    gl.uniform1f(U.uTime, now / 1000);
    gl.uniform3f(U.uWa, P.wa[0], P.wa[1], P.wa[2]);
    gl.uniform2f(U.uWb, P.wb[0], P.wb[1]);
    gl.uniform1f(U.uP0, P.p0);
    gl.uniform1f(U.uPulse, P.pulse);
    gl.uniform1f(U.uExp, P.exp);
    gl.uniform1f(U.uFlash, P.flash);
    gl.uniform1f(U.uNeb, P.neb);
    gl.uniform1f(U.uIgn, P.ign);
    gl.uniform1f(U.uNova, P.nova);
    gl.uniform1f(U.uBH, P.bh);
    gl.uniform1f(U.uEarthDist, P.dist);
    gl.uniform1f(U.uEarthT, P.earthT);
    gl.uniform1f(U.uBeam, P.beam);
    gl.uniform1f(U.uSkyAmt, P.sky);
    gl.uniform2f(U.uOff, P.off[0], P.off[1]);
    gl.uniform2f(U.uMouse, mouse.x * (reduced ? 0.3 : 1), mouse.y * (reduced ? 0.3 : 1));
    gl.uniform1f(U.uFix, P.fix);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // narration + captions
    const L = desiredLine(T);
    showLine(L);
    if (L && L.cap === 'DIST') cap.textContent = distCaption(P.dist);
    fill.style.width = clamp(T / TIMELINE_END, 0, 1) * 100 + '%';

    // ending
    if (started && T >= 204 && !restored) {
      restored = true;
      stars = saved.map((s, i) => ({ x: s.x, y: s.y, name: s.name || '', born: T + 0.6 + i * 0.5 }));
    }
    if (started && T >= INTERACTIVE_AT) {
      if (endPhase < 3 && (T > INTERACTIVE_AT + 70 || (sessionStars > 0 && T - lastTap > 30))) endPhase = 3;
      if (endPhase === 3 && !finalAt) finalAt = T;
      if (finalAt && T - finalAt > 3.5 && endEl.hidden) endEl.hidden = false;
    }
    drawOverlay(T, now, P);
    audioTick(T);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // for testing: jump anywhere in the film
  window.longWayHere = { seek(t) { if (!started) begin(false); T = t; resyncAudio(t); }, get time() { return T; } };
})();
</script>
</body>
</html>
