name: ios-app

# Builds the SYNTHWING 64 iOS app (apps/synthwing-ios), boots it in the iOS
# Simulator and fails if the app crashes or the game logs any error.
on:
  push:
    paths:
      - 'apps/synthwing-ios/**'
      - 'public/game/synthwing/**'
      - 'scripts/build-synthwing.mjs'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/synthwing-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/synthwing-ios/package-lock.json
      - run: npm ci
      - name: Build web bundle and sync Capacitor
        run: npm run sync
      - run: xcodebuild -version
      - name: Build (Debug, iOS Simulator)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Launch in the Simulator, play the attract demo, watch the console
        run: |
          set -uo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in rt for d in ds]
          pro = [d for d in devs if 'Pro Max' in d['name']] or [d for d in devs if d['name'].startswith('iPhone')]
          print(pro[-1]['udid'])")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$DEVICE" "$APP"
          # SYNTHWING_DEMO=1 makes the game start its self-playing demo (real gameplay, WebGL, audio).
          # First launches on CI simulators are slow, so allow up to 5 minutes.
          SIMCTL_CHILD_SYNTHWING_DEMO=1 xcrun simctl launch --console-pty "$DEVICE" "$BUNDLE" > app-console.log 2>&1 &
          demo=0
          for i in $(seq 1 150); do if grep -q "\[synthwing\] demo:" app-console.log 2>/dev/null; then demo=1; break; fi; sleep 2; done
          if [ "$demo" = 1 ]; then sleep 30; fi   # let the demo fly: enemies, lasers, explosions, music
          xcrun simctl io "$DEVICE" screenshot sim-demo.png || true
          running=0; xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE" && running=1
          echo "---- app console ----"; cat app-console.log
          if [ "$demo" != 1 ] || [ "$running" != 1 ]; then
            echo "---- system log for App (last 10 min) ----"
            xcrun simctl spawn "$DEVICE" log show --last 10m --style compact --predicate 'process == "App"' | tail -n 150 || true
            echo "---- crash reports ----"; ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -n 15 || true
            [ "$running" = 1 ] || echo "::error::app is not running (crashed?)"
            [ "$demo" = 1 ] || echo "::error::the attract demo never started"
            exit 1
          fi
          if grep -E "\[error\]|synthwing:|Uncaught|TypeError|ReferenceError" app-console.log; then echo "::error::the game logged errors"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-run
          path: |
            apps/synthwing-ios/sim-demo.png
            apps/synthwing-ios/app-console.log
          if-no-files-found: ignore

  device-release:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/synthwing-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/synthwing-ios/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Build (Release, device, unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
