name: singularity

on:
  push:
    branches: [main]
    paths: ['singularity/**', '.github/workflows/singularity.yml']
  pull_request:
    paths: ['singularity/**', '.github/workflows/singularity.yml']

defaults:
  run:
    working-directory: singularity

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: singularity/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Headless showcase smoke run
        run: npm run headless -- showcase 60 4

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: singularity/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: singularity/test-results
          retention-days: 7

  e2e-webkit:
    # Safari's engine (WebKit) running the iPhone checks. Informational: headless WebKit on
    # Linux renders WebGL in software, which is slower and less representative than a device.
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: singularity/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=iphone-webkit
        env:
          CI: 'true'
          E2E_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-webkit-results
          path: singularity/test-results
          retention-days: 7
