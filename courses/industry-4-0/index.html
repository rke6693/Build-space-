/* ---- PackML ---- */
LABS.packml = function(el){
  const NUM = {Clearing:1, Stopped:2, Starting:3, Idle:4, Suspended:5, Execute:6, Stopping:7, Aborting:8, Aborted:9, Holding:10, Held:11, Unholding:12, Suspending:13, Unsuspending:14, Resetting:15, Completing:16, Complete:17};
  const CMDN = {Reset:1, Start:2, Stop:3, Hold:4, Unhold:5, Suspend:6, Unsuspend:7, Abort:8, Clear:9};
  const ROWS = [['Production path', ['Resetting','Idle','Starting','Execute','Completing','Complete']], ['Hold loop: internal condition', ['Holding','Held','Unholding']], ['Suspend loop: external condition', ['Suspending','Suspended','Unsuspending']], ['Stop and abort', ['Stopping','Stopped','Aborting','Aborted','Clearing']]];
  const SC = {Resetting:'Idle', Starting:'Execute', Completing:'Complete', Holding:'Held', Unholding:'Execute', Suspending:'Suspended', Unsuspending:'Execute', Stopping:'Stopped', Aborting:'Aborted', Clearing:'Stopped'};
  const WAIT = {Stopped:{Reset:'Resetting'}, Idle:{Start:'Starting'}, Execute:{Hold:'Holding', Suspend:'Suspending'}, Held:{Unhold:'Unholding'}, Suspended:{Unsuspend:'Unsuspending'}, Complete:{Reset:'Resetting'}, Aborted:{Clear:'Clearing'}};
  const NOSTOP = ['Stopped','Stopping','Aborting','Aborted','Clearing'];
  const TARGET = 400, SPEED = 240;
  let st = 'Stopped', cmd = 0, batch = 0, total = 0, bad = 0, actT = 0, blocked = false, autoSusp = false, t0 = Date.now();
  const log = [];
  const next = (s, c) => c === 'Abort' ? ((s === 'Aborting' || s === 'Aborted') ? null : 'Aborting') : c === 'Stop' ? (NOSTOP.indexOf(s) >= 0 ? null : 'Stopping') : ((WAIT[s] || {})[c] || null);
  const clock = () => { const s = Math.floor((Date.now() - t0) / 1000); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); };
  el.innerHTML =
    '<div class="pm-legend"><span><i></i>Wait state</span><span><i class="a"></i>Acting state (finishes by itself)</span><span><i class="e"></i>Execute (makes product)</span></div>' +
    '<div class="pm-rows">' + ROWS.map(r => '<div class="pm-row"><span class="flabel">' + r[0] + '</span><div class="pm-states">' + r[1].map((s, i) => (i ? '<span class="pm-arrow" aria-hidden="true">&rsaquo;</span>' : '') + '<span class="pm-st' + (SC[s] ? ' acting' : '') + (s === 'Execute' ? ' exec' : '') + '" data-s="' + s + '">' + s + '</span>').join('') + '</div></div>').join('') + '</div>' +
    '<div class="pm-cols"><div style="display:grid;gap:12px;align-content:start">' +
      '<div><span class="flabel">Operator commands</span><div class="pm-cmds" id="pm-cmds">' + Object.keys(CMDN).map(c => '<button type="button" class="btn small" data-cmd="' + c + '">' + c + '</button>').join('') + '</div></div>' +
      '<div><span class="flabel">Plant events</span><div class="pm-cmds"><button type="button" class="btn small" data-ev="film">Film reel runs low</button><button type="button" class="btn small" data-ev="down" id="pm-down">Case packer infeed full</button><button type="button" class="btn small" data-ev="estop">Press E-stop</button></div></div>' +
      '<div class="msg" id="pm-msg" aria-live="polite"></div>' +
      '<div><span class="flabel">Batch progress</span><div class="bar" style="grid-template-columns:minmax(0,1fr) 92px"><span class="t"><i id="pm-bar" style="width:0%"></i></span><output id="pm-bo">0 / ' + TARGET + '</output></div></div>' +
    '</div><div style="display:grid;gap:12px;align-content:start;min-width:0">' +
      '<div><span class="flabel">PackTags (live)</span><div class="pm-tags" id="pm-tags"></div></div>' +
      '<div><span class="flabel">State log</span><ul class="pm-log" id="pm-log"></ul></div>' +
    '</div></div>';
  function msg(t, cls){ const m = $('#pm-msg', el); m.className = 'msg' + (cls ? ' ' + cls : ''); m.textContent = t; }
  function hint(){
    if (st === 'Stopped') return 'The machine is Stopped. Press Reset to bring it to Idle.';
    if (st === 'Idle') return 'Idle: ready to run. Press Start.';
    if (st === 'Execute') return blocked ? 'Downstream is blocked.' : 'Executing. Try a plant event: run the film low, or fill the case packer infeed.';
    if (st === 'Held') return 'Held: an internal condition needs the operator. After splicing the film, press Unhold.';
    if (st === 'Suspended') return autoSusp ? 'Suspended: the machine is healthy but blocked downstream. Clear the case packer infeed and it resumes on its own.' : 'Suspended by command. Press Unsuspend to resume.';
    if (st === 'Complete') return 'Batch complete. Press Reset to prepare the next batch.';
    if (st === 'Aborted') return 'Aborted after an emergency. Fix the cause, then press Clear.';
    return st + '... (acting state, finishes by itself)';
  }
  function render(){
    $$('.pm-st', el).forEach(x => {
      const s = x.dataset.s, cur = s === st;
      x.classList.toggle('cur', cur);
      x.classList.toggle('held', cur && (s === 'Held' || s === 'Suspended'));
      x.classList.toggle('bad', cur && (s === 'Aborted' || s === 'Aborting'));
      if (cur) x.setAttribute('aria-current', 'true'); else x.removeAttribute('aria-current');
    });
    $$('[data-cmd]', el).forEach(b => b.disabled = !next(st, b.dataset.cmd));
    $('#pm-down', el).textContent = blocked ? 'Clear case packer infeed' : 'Case packer infeed full';
    tags();
    $('#pm-log', el).innerHTML = log.slice(0, 30).map(x => '<li>' + esc(x) + '</li>').join('') || '<li>No transitions yet.</li>';
    msg(hint());
  }
  function tags(){
    $('#pm-tags', el).innerHTML =
      'PackTags.Command.CntrlCmd = <b>' + cmd + '</b><br>' +
      'PackTags.Status.StateCurrent = <b>' + NUM[st] + '</b> (' + st + ')<br>' +
      'PackTags.Status.UnitModeCurrent = <b>1</b> (Prod.)<br>' +
      'PackTags.Status.CurMachSpeed = <b>' + (st === 'Execute' ? SPEED.toFixed(1) : '0.0') + '</b> packs/min<br>' +
      'PackTags.Admin.ProdProcessedCount = <b>' + total + '</b><br>' +
      'PackTags.Admin.ProdDefectiveCount = <b>' + bad + '</b>';
    $('#pm-bar', el).style.width = (batch / TARGET * 100) + '%';
    $('#pm-bo', el).textContent = batch + ' / ' + TARGET;
  }
  function enter(n, why){ log.unshift(clock() + '  ' + st + ' > ' + n + '  (' + why + ')'); st = n; actT = SC[n] ? 1200 : 0; if (n === 'Starting' && batch >= TARGET) batch = 0; if (n === 'Resetting') batch = 0; render(); }
  function go(c, why){ const n = next(st, c); if (!n) return false; cmd = CMDN[c]; enter(n, why || c + ' command'); return true; }
  const iv = setInterval(() => {
    if (SC[st]) { actT -= 100; if (actT <= 0) enter(SC[st], 'state complete'); return; }
    if (st === 'Execute') {
      if (blocked) { autoSusp = true; go('Suspend', 'machine: downstream blocked'); return; }
      batch += 2; total += 2; if (Math.random() < 0.03) bad++;
      if (batch >= TARGET) { batch = TARGET; enter('Completing', 'batch target reached'); return; }
      tags();
    } else if (st === 'Suspended' && autoSusp && !blocked) { autoSusp = false; go('Unsuspend', 'machine: downstream clear'); }
  }, 100);
  onLeave(() => clearInterval(iv));
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-cmd]');
    if (b) { if (b.dataset.cmd === 'Suspend' || b.dataset.cmd === 'Unsuspend') autoSusp = false; go(b.dataset.cmd, 'operator: ' + b.dataset.cmd); return; }
    const v = e.target.closest('[data-ev]'); if (!v) return;
    if (v.dataset.ev === 'film') {
      if (st === 'Execute') go('Hold', 'machine: film reel needs splicing');
      else msg('The film alarm only stops the machine while it is executing. Start the machine first.', 'warn');
    } else if (v.dataset.ev === 'down') { blocked = !blocked; render(); }
    else if (v.dataset.ev === 'estop') { if (!go('Abort', 'E-stop pressed')) msg('Already aborting or aborted.', 'warn'); }
  });
  render();
};

/* ---- OEE calculator ---- */
LABS.oee = function(el){
  const F = [['oe-shift','Shift length (min)',480],['oe-brk','Planned breaks (min)',30],['oe-down','Stops, all causes (min)',47],['oe-rate','Ideal rate (units/min)',300],['oe-total','Total count',105000],['oe-good','Good count',103200]];
  el.innerHTML = '<div class="grid-fields">' + F.map(f => '<div class="field"><label for="' + f[0] + '">' + f[1] + '</label><input type="number" min="0" step="any" id="' + f[0] + '" value="' + f[2] + '" inputmode="decimal"></div>').join('') + '</div>' +
    '<div class="readout" id="oe-ro"></div><div id="oe-msg"></div>' +
    '<div><span class="flabel">Where the planned time went</span><div class="wf" id="oe-wf" role="img"></div></div>' +
    '<div class="legend"><span><i style="background:var(--ok)"></i>Fully productive</span><span><i style="background:var(--bad)"></i>Quality loss</span><span><i style="background:var(--amber)"></i>Performance loss</span><span><i style="background:var(--ink-3)"></i>Availability loss</span></div>' +
    '<div class="row"><button type="button" class="btn small" id="oe-reset">Reset to the worked example</button></div>';
  function up(){
    const v = id => Math.max(0, parseFloat($('#' + id, el).value) || 0);
    const shift = v('oe-shift'), brk = v('oe-brk'), down = v('oe-down'), rate = v('oe-rate'), total = v('oe-total'), good = v('oe-good');
    const planned = shift - brk, run = planned - down;
    const m = $('#oe-msg', el), ro = $('#oe-ro', el), wf = $('#oe-wf', el);
    let err = '';
    if (planned <= 0) err = 'Planned breaks must be shorter than the shift.';
    else if (run <= 0) err = 'Stops must be shorter than the planned production time (' + fmt(planned) + ' min).';
    else if (rate <= 0) err = 'Enter an ideal rate above zero.';
    else if (good > total) err = 'Good count cannot exceed total count.';
    if (err) { m.innerHTML = '<div class="msg bad">' + esc(err) + '</div>'; ro.innerHTML = ''; wf.innerHTML = ''; return; }
    const A = run / planned, P = total / (run * rate), Q = total ? good / total : 0, O = A * P * Q;
    ro.innerHTML = [['Availability', A], ['Performance', P], ['Quality', Q]].map(x => '<div class="ro"><div class="k">' + x[0] + '</div><div class="v">' + pct(x[1]) + '</div></div>').join('') + '<div class="ro hl"><div class="k">OEE</div><div class="v">' + pct(O) + '</div></div>';
    m.innerHTML = P > 1.0001 ? '<div class="msg warn">Performance is above 100%. The ideal rate is probably set too low: use the machine\'s rated speed for this product.</div>' : '';
    const fp = good / rate, ql = (total - good) / rate, pl = Math.max(0, run - total / rate), al = down;
    const seg = [['fp', fp, 'productive'], ['ql', ql, 'quality'], ['pl', pl, 'performance'], ['al', al, 'availability']];
    wf.innerHTML = seg.map(s => '<div class="' + s[0] + '" style="width:' + (s[1] / planned * 100) + '%" title="' + s[2] + ': ' + fmt(s[1], 0) + ' min">' + (s[1] / planned > 0.07 ? fmt(s[1], 0) + ' min' : '') + '</div>').join('');
    wf.setAttribute('aria-label', 'Of ' + fmt(planned) + ' planned minutes: ' + seg.map(s => fmt(s[1], 0) + ' min ' + s[2]).join(', '));
  }
  el.addEventListener('input', up);
  $('#oe-reset', el).addEventListener('click', () => { F.forEach(f => { $('#' + f[0], el).value = f[2]; }); up(); });
  up();
};

/* ---- line simulator ---- */
LABS.linesim = function(el){
  const MACH = [{n:'Depalletizer', mtbf:40, mttr:2}, {n:'Filler', mtbf:90, mttr:4, c:true}, {n:'Labeler', mtbf:20, mttr:1.5}, {n:'Case packer', mtbf:25, mttr:2}, {n:'Palletizer', mtbf:60, mttr:3}];
  const PRE = {flat:[300,300,300,300,300], v:[330,300,330,360,390]};
  const T = 28800;
  let speeds = PRE.v.slice(), B = 400, seed = 42, preset = 'v', raf = 0, sim = null;
  const runs = [];
  el.innerHTML =
    '<div class="row"><span class="flabel">Preset</span><div class="seg" role="group" aria-label="Line speed preset"><button type="button" data-p="flat" aria-pressed="false">Flat line</button><button type="button" data-p="v" aria-pressed="true">V-curve</button></div></div>' +
    '<div class="ls-ctrl">' + MACH.map((m, i) => '<div class="rng"><label class="flabel" for="ls-s' + i + '">' + m.n + (m.c ? ' (constraint)' : '') + '</label><input type="range" id="ls-s' + i + '" min="' + (m.c ? 240 : 270) + '" max="' + (m.c ? 330 : 420) + '" step="10" value="' + speeds[i] + '"><output id="ls-o' + i + '"></output></div>').join('') +
    '<div class="rng"><label class="flabel" for="ls-b">Buffer between machines</label><input type="range" id="ls-b" min="100" max="1200" step="50" value="' + B + '"><output id="ls-bo"></output></div></div>' +
    '<div class="ls-line" id="ls-line" aria-live="off"></div>' +
    '<div class="legend"><span><i style="background:var(--ok)"></i>Running</span><span><i style="background:var(--amber)"></i>Starved (waiting for product)</span><span><i style="background:var(--accent)"></i>Blocked (no space downstream)</span><span><i style="background:var(--bad)"></i>Down (breakdown)</span></div>' +
    '<div class="row"><button type="button" class="btn primary" id="ls-run">Run an 8-hour shift</button><button type="button" class="btn" id="ls-skip" disabled>Skip to end</button><button type="button" class="btn small" id="ls-seed">New random shift</button><span class="score" id="ls-clock">Shift #' + seed + ' &middot; 00:00 / 08:00</span></div>' +
    '<div id="ls-res" class="ls-res"></div>' +
    '<div><span class="flabel">Your runs</span><ul class="runs" id="ls-runs"><li><span>No runs yet. Try the flat line first, then the V-curve.</span></li></ul></div>' +
    '<p class="muted small">Breakdowns follow the same random schedule for the same shift number, so changes in output come from your design. Rated speeds are in units per minute; line efficiency is output divided by the filler\'s rated output (DIN 8743 style).</p>';
  function schedule(){
    return MACH.map((m, i) => {
      const r = mulberry32(seed + i * 7919), ev = []; let t = 0;
      for (;;) { t += -Math.log(1 - r()) * m.mtbf * 60; if (t >= T) break; const d = Math.max(15, -Math.log(1 - r()) * m.mttr * 60); ev.push([t, t + d]); t += d; }
      return ev;
    });
  }
  function newSim(){
    return {t:0, ev:schedule(), ptr:[0,0,0,0,0], buf:[B/2, B/2, B/2, B/2], st:MACH.map(() => ({run:0, starved:0, blocked:0, down:0})), cur:['run','run','run','run','run'], out:0, sp:speeds.slice(), B:B};
  }
  function step(s, n){
    const N = 5;
    for (let k = 0; k < n && s.t < T; k++, s.t++) {
      for (let i = N - 1; i >= 0; i--) {
        const e = s.ev[i];
        while (s.ptr[i] < e.length && e[s.ptr[i]][1] <= s.t) s.ptr[i]++;
        if (s.ptr[i] < e.length && e[s.ptr[i]][0] <= s.t) { s.st[i].down++; s.cur[i] = 'down'; continue; }
        const cap = s.sp[i] / 60, inA = i === 0 ? Infinity : s.buf[i - 1], sp = i === N - 1 ? Infinity : s.B - s.buf[i];
        const q = Math.min(cap, inA, sp);
        if (i > 0) s.buf[i - 1] -= q;
        if (i < N - 1) s.buf[i] += q; else s.out += q;
        const f = q / cap; s.st[i].run += f;
        if (f < 0.999999) { const w = inA < sp ? 'starved' : 'blocked'; s.st[i][w] += 1 - f; s.cur[i] = f < 0.5 ? w : 'run'; } else s.cur[i] = 'run';
      }
    }
  }
  const STN = {run:'Running', starved:'Starved', blocked:'Blocked', down:'Down'};
  function drawLine(s){
    const cur = s ? s.cur : ['run','run','run','run','run'];
    const buf = s ? s.buf : [B/2, B/2, B/2, B/2];
    const cap = s ? s.B : B;
    let h = '';
    MACH.forEach((m, i) => {
      h += '<div class="ls-m' + (m.c ? ' constraint' : '') + '"><span class="nm">' + m.n + '</span><span class="sp">' + speeds[i] + ' /min</span><span class="ls-light st-' + (s ? cur[i] : 'idle') + '"><i></i>' + (s ? STN[cur[i]] : 'Ready') + '</span></div>';
      if (i < 4) h += '<div class="ls-b" title="Buffer ' + Math.round(buf[i]) + ' of ' + cap + '"><div class="tank"><i style="--f:' + (buf[i] / cap * 100).toFixed(1) + '%"></i></div><span>' + Math.round(buf[i]) + '</span></div>';
    });
    $('#ls-line', el).innerHTML = h;
  }
  function clockTxt(t){ const m = Math.floor(t / 60); return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); }
  function finish(){
    cancelAnimationFrame(raf); raf = 0;
    const s = sim; drawLine(s);
    $('#ls-run', el).disabled = false; $('#ls-skip', el).disabled = true;
    $('#ls-clock', el).textContent = 'Shift #' + seed + ' · 08:00 / 08:00 · output ' + fmt(s.out) + ' units';
    const eff = s.out / (s.sp[1] * 480);
    const label = preset === 'flat' ? 'Flat line' : preset === 'v' ? 'V-curve' : 'Custom';
    runs.unshift({label:label, B:s.B, seed:seed, eff:eff, sp:s.sp.join('/')});
    const fil = s.st[1];
    $('#ls-res', el).innerHTML =
      '<div class="readout"><div class="ro hl"><div class="k">Line efficiency</div><div class="v">' + pct(eff) + '</div></div><div class="ro"><div class="k">Output</div><div class="v">' + fmt(s.out) + '</div></div><div class="ro"><div class="k">Filler lost to neighbours</div><div class="v">' + Math.round((fil.starved + fil.blocked) / 60) + ' min</div></div><div class="ro"><div class="k">Filler lost to own stops</div><div class="v">' + Math.round(fil.down / 60) + ' min</div></div></div>' +
      '<div class="bars" style="margin-top:12px">' + MACH.map((m, i) => { const x = s.st[i]; return '<div class="bar"><span>' + m.n + '</span><span class="stack" role="img" aria-label="' + m.n + ': running ' + pct(x.run / T, 0) + ', starved ' + pct(x.starved / T, 0) + ', blocked ' + pct(x.blocked / T, 0) + ', down ' + pct(x.down / T, 0) + '">' + ['run','starved','blocked','down'].map(k => '<i class="s-' + k + '" style="width:' + (x[k] / T * 100) + '%"></i>').join('') + '</span><output>' + pct(x.run / T, 0) + '</output></div>'; }).join('') + '</div>';
    $('#ls-runs', el).innerHTML = runs.slice(0, 8).map(r => '<li><span>' + r.label + ' &middot; ' + r.sp + ' &middot; buffer ' + r.B + ' &middot; shift #' + r.seed + '</span><b>' + pct(r.eff) + '</b></li>').join('');
  }
  function run(){
    cancelAnimationFrame(raf);
    sim = newSim();
    $('#ls-res', el).innerHTML = '';
    if (reduceMotion()) { step(sim, T); finish(); return; }
    $('#ls-run', el).disabled = true; $('#ls-skip', el).disabled = false;
    const frame = () => {
      step(sim, 60);
      drawLine(sim);
      $('#ls-clock', el).textContent = 'Shift #' + seed + ' · ' + clockTxt(sim.t) + ' / 08:00 · output ' + fmt(sim.out);
      if (sim.t >= T) finish(); else raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }
  function sync(){
    MACH.forEach((m, i) => { $('#ls-o' + i, el).textContent = speeds[i]; });
    $('#ls-bo', el).textContent = B;
    $$('[data-p]', el).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === preset)));
    if (!raf) drawLine(null);
  }
  el.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'ls-b') B = +e.target.value;
    else if (id && id.indexOf('ls-s') === 0) { speeds[+id.slice(4)] = +e.target.value; preset = PRE.flat.every((x, i) => x === speeds[i]) ? 'flat' : PRE.v.every((x, i) => x === speeds[i]) ? 'v' : 'custom'; }
    sync();
  });
  el.addEventListener('click', e => {
    const p = e.target.closest('[data-p]');
    if (p) { preset = p.dataset.p; speeds = PRE[preset].slice(); speeds.forEach((v, i) => { $('#ls-s' + i, el).value = v; }); sync(); return; }
    if (e.target.closest('#ls-run')) run();
    else if (e.target.closest('#ls-skip')) { if (sim) { step(sim, T); finish(); } }
    else if (e.target.closest('#ls-seed')) { seed = 1 + Math.floor(Math.random() * 999); $('#ls-clock', el).textContent = 'Shift #' + seed + ' · 00:00 / 08:00'; }
  });
  onLeave(() => cancelAnimationFrame(raf));
  sync();
};

/* ---- SPC ---- */
LABS.spc = function(el){
  const MU = 165.0, SD = 0.6, N = 40;
  const base = mulberry32(2207);
  let data = Array.from({length:N}, () => MU + SD * gauss(base));
  const rnd = Math.random;
  el.innerHTML = '<p class="muted small" style="margin:0">Heat-seal jaw temperature on a pouch line, one sample per minute. Setpoint 165.0 &deg;C; limits calculated from baseline data (&sigma; = 0.6 &deg;C).</p>' +
    '<div style="overflow-x:auto"><svg class="chart" id="spc-svg" viewBox="0 0 640 270" role="img"></svg></div>' +
    '<div class="row"><button type="button" class="btn small" data-a="normal">Add 10 normal points</button><button type="button" class="btn small" data-a="shift">Heater drifts up (+1.5&sigma;)</button><button type="button" class="btn small" data-a="trend">Slow upward trend</button><button type="button" class="btn small" data-a="spike">Single spike</button><button type="button" class="btn small" data-a="reset">Reset</button></div>' +
    '<div id="spc-out" aria-live="polite"></div>';
  function rules(d){
    const z = d.map(x => (x - MU) / SD), flag = d.map(() => []);
    for (let i = 0; i < z.length; i++) {
      if (Math.abs(z[i]) > 3) flag[i].push(1);
      if (i >= 2) for (const s of [1, -1]) { const w = z.slice(i - 2, i + 1).filter(v => v * s > 2).length; if (w >= 2 && z[i] * s > 2) flag[i].push(2); }
      if (i >= 4) for (const s of [1, -1]) { const w = z.slice(i - 4, i + 1).filter(v => v * s > 1).length; if (w >= 4 && z[i] * s > 1) flag[i].push(3); }
      if (i >= 7) for (const s of [1, -1]) { if (z.slice(i - 7, i + 1).every(v => v * s > 0)) flag[i].push(4); }
    }
    return flag.map(f => Array.from(new Set(f)));
  }
  function draw(){
    const x0 = 48, x1 = 584, y0 = 14, y1 = 240;
    const Y = v => y1 - (v - (MU - 4 * SD)) / (8 * SD) * (y1 - y0);
    const X = i => x0 + i * (x1 - x0) / (N - 1);
    const f = rules(data);
    let g = '<rect class="spc-band" x="' + x0 + '" y="' + y0 + '" width="' + (x1 - x0) + '" height="' + (Y(MU + 3 * SD) - y0).toFixed(1) + '"/><rect class="spc-band" x="' + x0 + '" y="' + Y(MU - 3 * SD).toFixed(1) + '" width="' + (x1 - x0) + '" height="' + (y1 - Y(MU - 3 * SD)).toFixed(1) + '"/>';
    const lines = [[3,'UCL','spc-lim',' lim'],[2,'+2σ','spc-z',''],[1,'+1σ','spc-z',''],[0,'CL','spc-cl',''],[-1,'−1σ','spc-z',''],[-2,'−2σ','spc-z',''],[-3,'LCL','spc-lim',' lim']];
    lines.forEach(L => {
      const y = Y(MU + L[0] * SD).toFixed(1);
      g += '<line class="' + L[2] + '" x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '"/><text class="zl' + L[3] + '" x="' + (x1 + 6) + '" y="' + (+y + 4) + '">' + L[1] + '</text><text class="axt" x="' + (x0 - 6) + '" y="' + (+y + 4) + '" text-anchor="end">' + (MU + L[0] * SD).toFixed(1) + '</text>';
    });
    g += '<line class="ax" x1="' + x0 + '" x2="' + x1 + '" y1="' + y1 + '" y2="' + y1 + '"/>';
    for (let i = 0; i < N; i += 5) g += '<text class="axt" x="' + X(i).toFixed(1) + '" y="' + (y1 + 18) + '" text-anchor="middle">' + (i + 1) + '</text>';
    g += '<text class="axt" x="' + x1 + '" y="' + (y1 + 18) + '" text-anchor="end">sample</text>';
    g += '<polyline class="spc-line" points="' + data.map((v, i) => X(i).toFixed(1) + ',' + Y(clamp(v, MU - 4 * SD, MU + 4 * SD)).toFixed(1)).join(' ') + '"/>';
    data.forEach((v, i) => { const off = v > MU + 4 * SD || v < MU - 4 * SD; g += '<circle class="spc-pt' + (f[i].length ? ' viol' : '') + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(clamp(v, MU - 4 * SD, MU + 4 * SD)).toFixed(1) + '" r="' + (f[i].length ? 4.6 : 3.4) + '"><title>Sample ' + (i + 1) + ': ' + v.toFixed(2) + ' °C' + (off ? ' (off scale)' : '') + (f[i].length ? ' — rule ' + f[i].join(', ') : '') + '</title></circle>'; });
    const svg = $('#spc-svg', el); svg.innerHTML = g;
    const cnt = [0, 0, 0, 0]; f.forEach(r => r.forEach(k => cnt[k - 1]++));
    const names = ['Rule 1: a point beyond 3σ', 'Rule 2: 2 of 3 beyond 2σ, same side', 'Rule 3: 4 of 5 beyond 1σ, same side', 'Rule 4: 8 in a row on one side'];
    const hit = cnt.some(c => c);
    svg.setAttribute('aria-label', 'Control chart of ' + N + ' seal temperature samples. ' + (hit ? 'Rule violations: ' + names.filter((_, i) => cnt[i]).join('; ') : 'No rule violations.'));
    $('#spc-out', el).innerHTML = hit
      ? '<div class="msg bad"><b>Special cause signalled.</b> ' + names.map((n, i) => cnt[i] ? n + ' (' + cnt[i] + ' point' + (cnt[i] > 1 ? 's' : '') + ')' : '').filter(Boolean).join('; ') + '. Investigate before seals start to fail: check the heater, thermocouple and film lot.</div>'
      : '<div class="msg ok"><b>In control.</b> Only common-cause variation is visible. Do not adjust the process; tampering with a stable process adds variation.</div>';
  }
  function add(arr){ data = data.concat(arr).slice(-N); draw(); }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'normal') add(Array.from({length:10}, () => MU + SD * gauss(rnd)));
    if (a === 'shift') add(Array.from({length:10}, () => MU + 1.5 * SD + 0.8 * SD * gauss(rnd)));
    if (a === 'trend') add(Array.from({length:8}, (_, k) => MU + 0.45 * SD * (k + 1) + 0.3 * SD * gauss(rnd)));
    if (a === 'spike') add([MU + 3.6 * SD]);
    if (a === 'reset') { const r = mulberry32(2207); data = Array.from({length:N}, () => MU + SD * gauss(r)); draw(); }
  });
  draw();
};

/* ---- reject timing ---- */
LABS.reject = function(el){
  const D = 1.2, CAL = 40, DELAY = D / (CAL / 60), PITCH = 0.15, LEN = 0.10, HALF = 0.75;
  el.innerHTML = '<div class="rng"><label class="flabel" for="rj-v">Conveyor speed (m/min). Timer tuned at ' + CAL + ' m/min = ' + DELAY.toFixed(2) + ' s delay</label><input type="range" id="rj-v" min="20" max="80" step="5" value="60"><output id="rj-vo" for="rj-v"></output></div>' +
    '<div class="readout" id="rj-ro"></div>' +
    '<div class="rj-strip"><h4>Fixed time delay</h4><svg class="chart" id="rj-a" viewBox="0 0 640 100" role="img"></svg></div>' +
    '<div class="rj-strip"><h4>Encoder tracking (position-based)</h4><svg class="chart" id="rj-b" viewBox="0 0 640 100" role="img"></svg></div>' +
    '<div id="rj-msg" aria-live="polite"></div>' +
    '<p class="muted small">Each picture is the moment the pusher fires. The defective pack is marked with an X. Packs are 100 mm long at a 150 mm pitch.</p>';
  const sx = p => 320 + p / HALF * 300;
  function strip(err){
    const kStar = Math.round(err / PITCH), off = err - kStar * PITCH, hit = Math.abs(off) <= LEN / 2;
    let g = '<rect class="pusher-zone" x="' + (sx(-0.03)).toFixed(1) + '" y="0" width="' + (sx(0.03) - sx(-0.03)).toFixed(1) + '" height="78"/>';
    g += '<rect class="cv" x="0" y="68" width="640" height="9" rx="2"/>';
    for (let k = -8; k <= 8; k++) {
      const p = err - k * PITCH; if (p < -HALF - 0.1 || p > HALF + 0.1) continue;
      const x = sx(p - LEN / 2), w = sx(p + LEN / 2) - x;
      const isBad = k === 0, isHit = hit && k === kStar;
      g += '<rect class="pkg' + (isBad ? ' bad' : '') + (isHit ? ' hit' : '') + '" x="' + x.toFixed(1) + '" y="34" width="' + w.toFixed(1) + '" height="34" rx="2"/>';
      if (isBad) { const cx = sx(p); g += '<path class="rj-x" d="M' + (cx - 8) + ' 43l16 16M' + (cx + 8) + ' 43l-16 16"/>'; }
    }
    g += '<rect class="pusher" x="314" y="2" width="12" height="22" rx="1"/><rect class="pusher" x="304" y="22" width="32" height="6" rx="1"/>';
    g += '<text class="rj-lab" x="6" y="94">← from camera</text><text class="rj-lab" x="634" y="94" text-anchor="end">downstream →</text><text class="rj-lab" x="344" y="16">pusher</text>';
    return {g:g, kStar:kStar, hit:hit};
  }
  function verdict(r){
    if (r.hit && r.kStar === 0) return {ok:true, t:'Rejects the defective pack.'};
    if (r.hit) return {ok:false, t:'Rejects a good pack ' + Math.abs(r.kStar) + ' position' + (Math.abs(r.kStar) > 1 ? 's' : '') + (r.kStar > 0 ? ' behind' : ' ahead of') + ' the defect. The defective pack escapes.'};
    return {ok:false, t:'Fires into the gap between packs. The defective pack escapes.'};
  }
  function up(){
    const v = +$('#rj-v', el).value, mps = v / 60, arrive = D / mps, err = mps * DELAY - D;
    $('#rj-vo', el).textContent = v;
    $('#rj-ro', el).innerHTML = '<div class="ro"><div class="k">Pack reaches pusher after</div><div class="v">' + arrive.toFixed(2) + ' s</div></div><div class="ro"><div class="k">Timer fires after</div><div class="v">' + DELAY.toFixed(2) + ' s</div></div><div class="ro' + (Math.abs(err) > 0.05 ? ' hl' : '') + '"><div class="k">Position error</div><div class="v">' + (err >= 0 ? '+' : '') + Math.round(err * 1000) + ' mm</div></div>';
    const a = strip(err), b = strip(0);
    $('#rj-a', el).innerHTML = a.g; $('#rj-b', el).innerHTML = b.g;
    const va = verdict(a), vb = verdict(b);
    $('#rj-a', el).setAttribute('aria-label', 'Fixed time delay at ' + v + ' m/min: ' + va.t);
    $('#rj-b', el).setAttribute('aria-label', 'Encoder tracking at ' + v + ' m/min: ' + vb.t);
    $('#rj-msg', el).innerHTML = '<div class="msg ' + (va.ok ? 'ok' : 'bad') + '"><b>Fixed delay:</b> ' + va.t + '</div><div class="msg ok" style="margin-top:6px"><b>Encoder tracking:</b> ' + vb.t + ' Position tracking is correct at any speed.</div>';
  }
  el.addEventListener('input', up); up();
};

/* ---- P-F curve ---- */
LABS.pf = function(el){
  const F = 18, ONSET = 4;
  const cond = t => t <= ONSET ? 100 : 100 - 75 * Math.pow((t - ONSET) / (F - ONSET), 2.4);
  const tAt = c => ONSET + Math.pow((100 - c) / 75, 1 / 2.4) * (F - ONSET);
  const TECH = [['Ultrasound', 98.5, 'var(--accent-strong)'], ['Vibration analysis', 96, 'var(--accent)'], ['Oil analysis', 90, 'var(--kraft)'], ['Thermography', 80, 'var(--amber)'], ['Audible noise', 55, 'var(--warn)'], ['Hot to the touch', 38, 'var(--bad)']].map(t => ({n:t[0], c:t[1], col:t[2], t:tAt(t[1])}));
  let sel = 1;
  el.innerHTML = '<span class="flabel">Detection technique</span><ul class="tech-list" id="pf-tech">' + TECH.map((t, i) => '<li><button type="button" data-t="' + i + '" aria-pressed="false"><i style="background:' + t.col + '"></i>' + t.n + '<small>P-F ' + (F - t.t).toFixed(1) + ' wk</small></button></li>').join('') + '</ul>' +
    '<div class="rng"><label class="flabel" for="pf-i">Inspection interval (0 = continuous online sensor)</label><input type="range" id="pf-i" min="0" max="12" step="1" value="8"><output id="pf-io" for="pf-i"></output></div>' +
    '<div style="overflow-x:auto"><svg class="chart" id="pf-svg" viewBox="0 0 640 290" role="img"></svg></div><div id="pf-msg" aria-live="polite"></div>' +
    '<p class="muted small">Illustrative bearing failure. Real P-F intervals depend on the failure mode, the equipment and the sensor.</p>';
  function draw(){
    const I = +$('#pf-i', el).value;
    $('#pf-io', el).textContent = I === 0 ? 'online' : I + ' wk';
    $$('#pf-tech button', el).forEach((b, i) => b.setAttribute('aria-pressed', String(i === sel)));
    const x0 = 46, x1 = 624, y0 = 14, y1 = 250;
    const X = t => x0 + t / 20 * (x1 - x0), Y = c => y1 - c / 110 * (y1 - y0);
    const T = TECH[sel];
    let det = null;
    if (I === 0) det = T.t; else { const k = Math.ceil(T.t / I - 1e-9); const td = k * I; if (td < F) det = td; }
    let g = '';
    [0, 25, 50, 75, 100].forEach(c => { g += '<line class="gridl" x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(c).toFixed(1) + '" y2="' + Y(c).toFixed(1) + '"/><text class="axt" x="' + (x0 - 6) + '" y="' + (Y(c) + 4).toFixed(1) + '" text-anchor="end">' + c + '</text>'; });
    for (let t = 0; t <= 20; t += 2) g += '<text class="axt" x="' + X(t).toFixed(1) + '" y="' + (y1 + 16) + '" text-anchor="middle">' + t + '</text>';
    g += '<text class="axt" x="' + x1 + '" y="' + (y1 + 32) + '" text-anchor="end">weeks</text><text class="axt" x="' + x0 + '" y="' + (y1 + 32) + '">condition (%)</text>';
    if (det !== null) g += '<rect class="pf-win" x="' + X(det).toFixed(1) + '" y="' + y0 + '" width="' + (X(F) - X(det)).toFixed(1) + '" height="' + (y1 - y0) + '"/>';
    let pts = []; for (let t = 0; t <= F; t += 0.25) pts.push(X(t).toFixed(1) + ',' + Y(cond(t)).toFixed(1));
    g += '<polyline class="pf-curve" points="' + pts.join(' ') + '"/>';
    g += '<line class="ax" x1="' + x0 + '" x2="' + x1 + '" y1="' + y1 + '" y2="' + y1 + '"/>';
    if (I > 0) for (let t = I; t <= 20; t += I) g += '<line class="pf-insp" x1="' + X(t).toFixed(1) + '" x2="' + X(t).toFixed(1) + '" y1="' + y1 + '" y2="' + (y1 - 12) + '"/>';
    TECH.forEach((t, i) => { g += '<circle class="pf-dot' + (i === sel ? ' sel' : '') + '" cx="' + X(t.t).toFixed(1) + '" cy="' + Y(t.c).toFixed(1) + '" r="' + (i === sel ? 7 : 5) + '" style="fill:' + t.col + '"><title>' + t.n + ': detectable from week ' + t.t.toFixed(1) + '</title></circle>'; });
    g += '<text class="axt" x="' + (X(T.t) + 10).toFixed(1) + '" y="' + (Y(T.c) - 8).toFixed(1) + '" style="fill:var(--ink);font-weight:600">P</text>';
    g += '<circle cx="' + X(F).toFixed(1) + '" cy="' + Y(25).toFixed(1) + '" r="6" style="fill:var(--ink)"/><text class="axt" x="' + (X(F) - 10).toFixed(1) + '" y="' + (Y(25) + 4).toFixed(1) + '" text-anchor="end" style="fill:var(--ink);font-weight:600">F: functional failure</text>';
    if (det !== null) g += '<circle class="pf-det" cx="' + X(det).toFixed(1) + '" cy="' + Y(cond(det)).toFixed(1) + '" r="5"/>';
    const svg = $('#pf-svg', el); svg.innerHTML = g;
    const pfI = F - T.t;
    const rule = I === 0 ? 'A continuous sensor detects the defect as soon as it becomes measurable.' : 'Guideline: for ' + T.n.toLowerCase() + ' (P-F interval ' + pfI.toFixed(1) + ' weeks), inspect at least every ' + (pfI / 2).toFixed(1) + ' weeks.';
    const txt = det === null
      ? '<div class="msg bad"><b>Missed.</b> No ' + T.n.toLowerCase() + ' check falls between P (week ' + T.t.toFixed(1) + ') and F (week ' + F + '). The bearing fails unplanned. ' + rule + '</div>'
      : '<div class="msg ' + (F - det >= 3 ? 'ok' : 'warn') + '"><b>Detected at week ' + det.toFixed(1) + ', ' + (F - det).toFixed(1) + ' weeks before failure.</b> ' + (F - det >= 3 ? 'Enough time to order parts and plan the repair into a changeover. ' : 'Very little time to plan; this will probably be a rushed repair. ') + rule + '</div>';
    $('#pf-msg', el).innerHTML = txt;
    svg.setAttribute('aria-label', 'P-F curve. ' + T.n + ' detects from week ' + T.t.toFixed(1) + '; functional failure at week ' + F + '. ' + (det === null ? 'Missed with this interval.' : 'Detected at week ' + det.toFixed(1) + '.'));
  }
  el.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { sel = +b.dataset.t; draw(); } });
  el.addEventListener('input', draw);
  draw();
};

/* ---- vision threshold ---- */
LABS.vision = function(el){
  const G = [30, 8], Bd = [62, 11], VOL = 100000;
  el.innerHTML = '<div class="grid-fields"><div class="rng"><label class="flabel" for="vz-t">Reject threshold (anomaly score)</label><input type="range" id="vz-t" min="20" max="90" step="0.5" value="50"><output id="vz-to" for="vz-t"></output></div>' +
    '<div class="rng"><label class="flabel" for="vz-r">True defect rate</label><input type="range" id="vz-r" min="0.1" max="5" step="0.1" value="1"><output id="vz-ro" for="vz-r"></output></div></div>' +
    '<div class="grid-fields"><div class="field"><label for="vz-cf">Cost of a false reject ($)</label><input type="number" id="vz-cf" min="0" step="0.05" value="0.40"></div><div class="field"><label for="vz-ce">Cost of an escape ($)</label><input type="number" id="vz-ce" min="0" step="1" value="25"></div></div>' +
    '<div style="overflow-x:auto"><svg class="chart" id="vz-svg" viewBox="0 0 640 230" role="img"></svg></div>' +
    '<div class="legend"><span><i style="background:var(--ok);opacity:.5"></i>Good packs (score shape)</span><span><i style="background:var(--bad);opacity:.5"></i>Defective packs (score shape)</span><span><i style="background:var(--amber)"></i>False rejects</span><span><i style="background:var(--bad)"></i>Escapes</span></div>' +
    '<div class="readout" id="vz-out"></div><div class="row"><button type="button" class="btn small" id="vz-best">Set the lowest-cost threshold</button><span class="score" id="vz-bt"></span></div>' +
    '<p class="muted small">Both curves are drawn at the same height so their shapes are visible; the counts use the real defect rate, per ' + fmt(VOL) + ' packs.</p>';
  const calc = (t, r, cf, ce) => { const gN = VOL * (1 - r), bN = VOL * r; const fr = gN * (1 - Phi((t - G[0]) / G[1])), es = bN * Phi((t - Bd[0]) / Bd[1]); return {fr:fr, es:es, cost:fr * cf + es * ce}; };
  function best(r, cf, ce){ let bt = 20, bc = Infinity; for (let t = 20; t <= 90; t += 0.5) { const c = calc(t, r, cf, ce).cost; if (c < bc) { bc = c; bt = t; } } return bt; }
  function draw(){
    const t = +$('#vz-t', el).value, r = +$('#vz-r', el).value / 100;
    const cf = Math.max(0, parseFloat($('#vz-cf', el).value) || 0), ce = Math.max(0, parseFloat($('#vz-ce', el).value) || 0);
    $('#vz-to', el).textContent = t.toFixed(1); $('#vz-ro', el).textContent = (r * 100).toFixed(1) + '%';
    const x0 = 16, x1 = 624, y0 = 26, y1 = 196;
    const X = s => x0 + s / 100 * (x1 - x0), Y = h => y1 - h * (y1 - y0);

const AIS = {
  '00':{n:'SSCC', fixed:18, num:true, cd:true}, '01':{n:'GTIN', fixed:14, num:true, cd:true}, '02':{n:'GTIN of contained trade items', fixed:14, num:true, cd:true},
  '10':{n:'Batch or lot', max:20}, '11':{n:'Production date', fixed:6, date:true}, '13':{n:'Packaging date', fixed:6, date:true}, '15':{n:'Best before date', fixed:6, date:true}, '17':{n:'Expiry date', fixed:6, date:true},
  '21':{n:'Serial number', max:20}, '22':{n:'Consumer product variant', max:20}, '30':{n:'Variable count', max:8, num:true}, '37':{n:'Count of trade items', max:8, num:true},
  '400':{n:"Customer's purchase order", max:30}, '414':{n:'GLN of physical location', fixed:13, num:true, cd:true}
};
for (let d = 0; d <= 5; d++) AIS['310' + d] = {n:'Net weight (kg, ' + d + ' decimals)', fixed:6, num:true, dec:d};
function gs1cd(s){ let sum = 0; for (let i = 0; i < s.length; i++) sum += (+s[s.length - 1 - i]) * (i % 2 === 0 ? 3 : 1); return (10 - sum % 10) % 10; }
function gs1date(v){
  if (!/^\d{6}$/.test(v)) return null;
  const yy = +v.slice(0, 2), mm = +v.slice(2, 4), dd = +v.slice(4, 6);
  if (mm < 1 || mm > 12) return null;
  const now = new Date().getFullYear(), cur = now % 100, cent = now - cur;
  const diff = yy - cur; const year = (diff >= 51 ? cent - 100 : diff <= -50 ? cent + 100 : cent) + yy;
  const last = new Date(year, mm, 0).getDate();
  if (dd > last) return null;
  const day = dd === 0 ? last : dd;
  return year + '-' + pad2(mm) + '-' + pad2(day) + (dd === 0 ? ' (00 = last day of month)' : '');
}
function checkAI(ai, v){
  const d = AIS[ai];
  if (!d) return {name:'Not in this lab\'s table', ok:null, note:'Unknown AI'};
  if (d.fixed && v.length !== d.fixed) return {name:d.n, ok:false, note:'Must be exactly ' + d.fixed + ' characters'};
  if (d.max && (v.length < 1 || v.length > d.max)) return {name:d.n, ok:false, note:'1 to ' + d.max + ' characters'};
  if (d.num && !/^\d+$/.test(v)) return {name:d.n, ok:false, note:'Digits only'};
  if (d.cd) { const c = gs1cd(v.slice(0, -1)); return +v.slice(-1) === c ? {name:d.n, ok:true, note:'Check digit ' + c + ' is correct'} : {name:d.n, ok:false, note:'Check digit should be ' + c}; }
  if (d.date) { const x = gs1date(v); return x ? {name:d.n, ok:true, note:x} : {name:d.n, ok:false, note:'Not a valid YYMMDD date'}; }
  if (d.dec !== undefined) return {name:d.n, ok:true, note:(+v / Math.pow(10, d.dec)).toFixed(d.dec) + ' kg'};
  return {name:d.n, ok:true, note:''};
}
function parseGS1(s){
  s = s.trim();
  if (/^https?:\/\//i.test(s)) {
    let u; try { u = new URL(s); } catch (e) { return {err:'That URL could not be read.'}; }
    const seg = u.pathname.split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
    const out = []; let i = seg.findIndex(x => AIS[x]);
    if (i < 0) return {err:'No GS1 key (such as /01/ or /00/) found in the path.'};
    for (; i < seg.length - 1; i += 2) out.push([seg[i], seg[i + 1]]);
    u.searchParams.forEach((v, k) => { if (/^\d{2,4}$/.test(k)) out.push([k, v]); });
    return {items:out, src:'Digital Link URI'};
  }
  const re = /\((\d{2,4})\)([^()]*)/g; const out = []; let m;
  while ((m = re.exec(s))) out.push([m[1], m[2].trim()]);
  if (!out.length) return {err:'Use the bracketed form, e.g. (01)09506000134352(10)ABC123, or paste a GS1 Digital Link URI.'};

function toDL(items){
  const get = k => (items.find(x => x[0] === k) || [])[1];

  if (get('01')) { path = '/01/' + get('01'); used['01'] = 1; ['22','10','21'].forEach(k => { if (get(k)) { path += '/' + k + '/' + encodeURIComponent(get(k)); used[k] = 1; } }); }

  else if (get('414')) { path = '/414/' + get('414'); used['414'] = 1; }
  else return null;
  const q = items.filter(x => !used[x[0]]).map(x => x[0] + '=' + encodeURIComponent(x[1])).join('&');
  return 'https://id.gs1.org' + path + (q ? '?' + q : '');
}

LABS.capstone = function(el, d, lesson){
  const BUDGET = 200000, PT = 11520;
  const LOSS = {chg:['Changeovers','Availability',13], brk:['Breakdowns','Availability',6], minor:['Minor stops','Performance',10], speed:['Reduced speed','Performance',8], def:['Process defects (seal leaks)','Quality',3], start:['Start-up rejects','Quality',2]};
  const INI = [
    {id:'A', t:'SMED program with servo format settings', d:'Film and analyse changeovers, move work to external, add recipe-driven servo guide rails and tool-less change parts.', cost:60000, fx:{chg:0.5}},
    {id:'B', t:'Real-time OEE and stop-reason capture', d:'An edge gateway reads PackML states and counters from every machine; operators see live stop reasons; a daily 15-minute review acts on the top three.', cost:40000, fx:{minor:0.4, speed:0.25}},
    {id:'C', t:'Predictive maintenance on bagger and weigher drives', d:'Vibration and temperature sensors, an analytics subscription, and alerts to the maintenance planner.', cost:90000, fx:{brk:0.5}},
    {id:'D', t:'AI vision seal inspection with closed-loop jaw control', d:'Deep-learning seal inspection; detected drift adjusts jaw temperature and dwell time automatically.', cost:110000, fx:{def:0.6, start:0.3}},
    {id:'E', t:'Full 3D digital twin of Line 3', d:'A physics-based model of every machine for virtual commissioning and what-if studies.', cost:180000, flat:1},
    {id:'F', t:'Cobot palletizer', d:'Replaces manual palletizing at the end of the line and frees one operator per shift for other work.', cost:140000, labor:55000}
  ];
  const evalPlan = set => {
    let pts = 0, labor = 0, cost = 0;
    INI.forEach(x => { if (!set[x.id]) return; cost += x.cost; labor += x.labor || 0; pts += x.flat || 0; Object.keys(x.fx || {}).forEach(k => { pts += LOSS[k][2] * x.fx[k] * (x.id === 'C' && !set.B ? 0.5 : 1); }); });
    return {pts:pts, labor:labor, cost:cost, annual:pts * PT + labor};
  };
  let bestSet = null, bestR = null;
  for (let mask = 0; mask < 64; mask++) { const s = {}; INI.forEach((x, i) => { if (mask & (1 << i)) s[x.id] = true; }); const r = evalPlan(s); if (r.cost <= BUDGET && (!bestR || r.annual > bestR.annual)) { bestR = r; bestSet = s; } }
  el.innerHTML = '<div><span class="flabel">Line 3 losses, in OEE points (share of planned time)</span><div class="tbl-wrap"><table class="loss-tbl"><thead><tr><th>Loss</th><th>OEE factor</th><th>Points</th></tr></thead><tbody>' +
    Object.keys(LOSS).map(k => '<tr><td>' + LOSS[k][0] + '</td><td>' + LOSS[k][1] + '</td><td>' + LOSS[k][2] + '</td></tr>').join('') + '<tr><td>Total loss</td><td></td><td>42</td></tr></tbody></table></div></div>' +
    '<div><span class="flabel">Initiatives</span><div class="ini">' + INI.map(x => '<label for="cap-' + x.id + '"><input type="checkbox" id="cap-' + x.id + '" value="' + x.id + '"><span class="ti">' + x.id + '. ' + esc(x.t) + '</span><span class="co">$' + fmt(x.cost) + '</span><span class="de">' + esc(x.d) + '</span></label>').join('') + '</div></div>' +
    '<div class="budget" id="cap-bud"><div class="row" style="justify-content:space-between"><span class="flabel">Budget used</span><span class="score" id="cap-bt"></span></div><div class="t"><i id="cap-bi"></i></div></div>' +
    '<div class="row"><button type="button" class="btn primary" id="cap-go">Evaluate my plan</button><span class="muted small" id="cap-hint" aria-live="polite"></span></div>' +
    '<div id="cap-out" aria-live="polite"></div>';
  const sel = () => { const s = {}; $$('.ini input', el).forEach(c => { if (c.checked) s[c.value] = true; }); return s; };
  function bud(){
    const r = evalPlan(sel()), over = r.cost > BUDGET;
    $('#cap-bt', el).textContent = '$' + fmt(r.cost) + ' of $' + fmt(BUDGET);
    $('#cap-bi', el).style.width = Math.min(100, r.cost / BUDGET * 100) + '%';
    $('#cap-bud', el).classList.toggle('over', over);
    $('#cap-go', el).disabled = over || r.cost === 0;
    $('#cap-hint', el).textContent = over ? 'Over budget by $' + fmt(r.cost - BUDGET) + '. Remove an initiative.' : r.cost === 0 ? 'Select at least one initiative.' : '';
  }
  function feedback(s){
    const F = [];
    F.push(s.A ? ['good', 'A. Changeovers are the largest loss (13 points). Halving them is worth about 6.5 points for $60k.'] : ['poor', 'A. Changeovers are the biggest loss on Line 3, and SMED is cheap. This is the first place to look.']);
    F.push(s.B ? ['good', 'B. Cheap and fast: minor stops and slow running cost 18 points together, and live stop reasons are the data foundation for everything else.'] : ['poor', 'B. Minor stops and slow running cost 18 points and nothing else attacks them. Without live stop data, the other projects also lose their feedback loop.']);
    F.push(s.C ? (s.B ? ['good', 'C. Breakdowns cost 6 points; halving them adds about 3. Worth it once the data foundation exists.'] : ['meh', 'C. Without live stop data and a routine that acts on alerts, predictive maintenance pilots often stall. Counted at half effect.']) : ['meh', 'C. Breakdowns are only 6 points. Deferring this until the bigger losses are fixed is reasonable.']);
    F.push(s.D ? ['meh', 'D. Quality losses total 5 points, so $110k buys about 2.4 points. Good technology, wrong year for this line.'] : ['good', 'D. Right to defer: quality losses are the smallest bucket.']);
    F.push(s.E ? ['poor', 'E. A full twin uses most of the budget and does not attack the measured losses. Scope a twin to a specific decision instead.'] : ['good', 'E. Right call: a full twin does not address this loss profile.']);
    F.push(s.F ? ['meh', 'F. The palletizer is not the constraint, so line output does not change. It saves labour ($55k a year counted) and heavy lifting, which may justify it on other grounds.'] : ['good', 'F. Right for OEE: the palletizer is not the constraint. Revisit it as an ergonomics and labour project.']);
    return F;
  }
  el.addEventListener('change', bud);
  $('#cap-go', el).addEventListener('click', () => {
    const s = sel(), r = evalPlan(s);
    const isBest = Object.keys(s).sort().join('') === Object.keys(bestSet).sort().join('');
    const after = 58 + r.pts, pay = r.annual > 0 ? r.cost / r.annual * 12 : Infinity;
    $('#cap-out', el).innerHTML =
      '<div class="bars"><div class="bar"><span>OEE before</span><span class="t"><i style="width:58%;background:var(--ink-3)"></i></span><output>58.0%</output></div><div class="bar total"><span><b>OEE after</b></span><span class="t"><i style="width:' + after + '%;background:var(--ok)"></i></span><output><b>' + after.toFixed(1) + '%</b></output></div></div>' +
      '<div class="readout" style="margin-top:12px"><div class="ro"><div class="k">OEE gain</div><div class="v">+' + r.pts.toFixed(1) + ' pts</div></div><div class="ro hl"><div class="k">Annual benefit</div><div class="v">$' + fmt(r.annual) + '</div></div><div class="ro"><div class="k">Investment</div><div class="v">$' + fmt(r.cost) + '</div></div><div class="ro"><div class="k">Simple payback</div><div class="v">' + (isFinite(pay) ? pay.toFixed(1) + ' mo' : 'none') + '</div></div></div>' +
      '<div class="msg ' + (isBest ? 'ok' : 'warn') + '" style="margin-top:12px">' + (isBest ? '<b>This is the strongest plan for Line 3\'s loss profile.</b> It attacks the largest losses first and builds the data foundation the others depend on.' : '<b>A stronger plan exists.</b> The best combination within budget is ' + Object.keys(bestSet).sort().join(', ') + ': +' + bestR.pts.toFixed(1) + ' points and $' + fmt(bestR.annual) + ' a year. Read the feedback below and try again.') + '</div>' +
      '<ul class="fb-list" style="margin-top:12px">' + feedback(s).map(f => '<li class="' + f[0] + '">' + esc(f[1]) + '</li>').join('') + '</ul>';
    S.cap = {plan:Object.keys(s).sort().join(''), pts:+r.pts.toFixed(1)};
    if (!S.done[lesson.id]) { S.done[lesson.id] = true; renderNav(lesson.id); }
    save();
  });
  if (S.cap && S.cap.plan) S.cap.plan.split('').forEach(id => { const c = $('#cap-' + id, el); if (c) c.checked = true; });
  bud();
};

/* ======================= TUTOR (Claude, when available) ======================= */
let SAMPLE = null;
try {
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(s => { if (s) { SAMPLE = s; document.documentElement.classList.add('has-tutor'); } }).catch(() => {});
  }
} catch (e) {}
function tutorHtml(){
  const chips = ['Explain this with a different example', 'What do people often get wrong here?', 'How does this connect to OEE?'];
  return '<section class="tutor" aria-labelledby="tutor-h"><h2 id="tutor-h">Ask the tutor</h2><p class="muted small" style="margin:0 0 10px">Ask anything about this lesson. Claude answers using the lesson text as context, on your own Claude account.</p>' +
    '<form id="tutor-form"><label class="sr" for="tutor-q">Your question</label><textarea id="tutor-q" placeholder="For example: how would this work on a bottling line?"></textarea>' +
    '<div class="tutor-chips">' + chips.map(c => '<button type="button" data-chip="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>' +
    '<div class="row"><button class="btn primary" type="submit" id="tutor-ask">Ask</button><button class="btn" type="button" id="tutor-stop" hidden>Stop</button></div></form>' +
    '<div class="tutor-out" id="tutor-out" aria-live="polite"></div><p class="tutor-note" id="tutor-note"></p></section>';
}
function setupTutor(l){
  const form = $('#tutor-form'); if (!form) return;
  let ctl = null;
  onLeave(() => { if (ctl) ctl.abort(); });
  form.addEventListener('click', e => { const c = e.target.closest('[data-chip]'); if (c) { $('#tutor-q').value = c.dataset.chip; $('#tutor-q').focus(); } });
  $('#tutor-stop').addEventListener('click', () => { if (ctl) ctl.abort(); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('#tutor-q').value.trim(); if (!q || !SAMPLE || ctl) return;
    const text = $$('#lesson-text .prose').map(p => p.innerText).join('\n').replace(/\n{3,}/g, '\n\n').slice(0, 7000);
    const prompt = 'You are a patient, precise tutor for "The Connected Line", a micro course on Industry 4.0 in packaging and manufacturing.\n' +
      'Answer the learner\'s question. Use the lesson below as your main context; you may add accurate background knowledge. If an answer depends on a specific standard edition, regulation date or plant situation, say so briefly.\n' +
      'Format: plain text, under 180 words, short paragraphs or lines starting with "- ". No markdown headings and no asterisks. Where it helps, use a concrete packaging-line example.\n\n' +
      'LESSON ' + l.num + ': ' + l.title + '\n' + text + '\nKEY POINTS: ' + l.keys.join(' ') + '\n\nQUESTION: ' + q;
    const out = $('#tutor-out'), note = $('#tutor-note'), ask = $('#tutor-ask'), stop = $('#tutor-stop');
    out.textContent = 'Thinking...'; note.textContent = ''; ask.disabled = true; stop.hidden = false;
    ctl = new AbortController();
    try {
      const r = await SAMPLE(prompt, {signal:ctl.signal, onText:({text}) => { out.textContent = text; }});
      out.textContent = r.text;
      if (r.truncated) note.textContent = 'The answer was cut short. Ask a narrower question for the rest.';
    } catch (err) {
      const code = err && err.code;
      out.textContent = (err && err.text) || '';
      if (code === 'cancelled') note.textContent = 'Stopped.';
      else if (code === 'not_granted') { note.textContent = 'Claude was not allowed for this page, so the tutor is off for this visit.'; SAMPLE = null; setTimeout(() => document.documentElement.classList.remove('has-tutor'), 4000); }
      else if (code === 'rate_limited') note.textContent = 'Too many questions at once. Wait a moment, then ask again.';
      else note.textContent = 'The tutor could not answer just now. Try again in a moment.';
    } finally { ask.disabled = false; stop.hidden = true; ctl = null; }
  });
}

/* ======================= ROUTER ======================= */
const STATIC = {home:viewHome, labs:viewLabs, glossary:viewGlossary, exam:viewExam, certificate:viewCert};
function isRoute(h){ return !!(STATIC[h] || BYID[h] || /^s\d+-check$/.test(h)); }
function route(){
  const h = (location.hash || '').slice(1) || 'home';
  if (!isRoute(h) && document.getElementById(h)) return;
  runClean(); openNav(false);
  const key = isRoute(h) ? h : 'home';
  const cm = key.match(/^s(\d+)-check$/);
  if (STATIC[key]) STATIC[key]();
  else if (BYID[key]) viewLesson(BYID[key]);
  else if (cm) viewCheck(+cm[1]);
  renderNav(key);
  window.scrollTo(0, 0);
  main.focus({preventScroll:true});
}
window.addEventListener('hashchange', route);
route();
})();

</script>
