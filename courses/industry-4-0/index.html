{ code:`Performance`, title:`OEE, line design and analytics`,
  blurb:`Measure the line honestly with OEE, design it around the bottleneck, and turn data into decisions with SPC.`,
  lessons:[
  { title:`OEE: the line's scoreboard`, min:8,
    lab:{type:`oee`, title:`OEE calculator`},
    body:`
<p><b>Overall Equipment Effectiveness</b> (OEE) answers one question: of the time we planned to produce, how much did we turn into good product at full speed? It comes from Total Productive Maintenance (TPM), developed in Japan and popularized by Seiichi Nakajima in the 1980s.</p>
<div class="formula">OEE = Availability &times; Performance &times; Quality</div>
<div class="tbl-wrap"><table>
<thead><tr><th>Factor</th><th>Formula</th><th>Captures</th></tr></thead>
<tbody>
<tr><td>Availability</td><td>Run time &divide; Planned production time</td><td>Stops: breakdowns, changeovers, waiting for material</td></tr>
<tr><td>Performance</td><td>(Ideal cycle time &times; Total count) &divide; Run time</td><td>Running below ideal speed, and short stops not logged as downtime</td></tr>
<tr><td>Quality</td><td>Good count &divide; Total count</td><td>Rejects and rework, including start-up scrap</td></tr>
</tbody></table></div>
<p>Multiply the three and most terms cancel, which gives a handy check: <b>OEE = (Good count &times; Ideal cycle time) &divide; Planned production time</b>. It is the share of planned time spent making good product at ideal speed.</p>
<h3>The six big losses</h3>
<div class="tbl-wrap"><table>
<thead><tr><th>Factor</th><th>Loss</th><th>Packaging example</th></tr></thead>
<tbody>
<tr><td>Availability</td><td>Equipment failure</td><td>Filler valve fault, broken vacuum pump on the case erector</td></tr>
<tr><td>Availability</td><td>Setup and adjustments</td><td>Format changeover, film reel change, allergen clean</td></tr>
<tr><td>Performance</td><td>Idling and minor stops</td><td>A fallen bottle on the conveyor, a label web break cleared in a minute</td></tr>
<tr><td>Performance</td><td>Reduced speed</td><td>Labeler run at 85% because labels wrinkle at full speed</td></tr>
<tr><td>Quality</td><td>Process defects</td><td>Leaking seals, missing codes, underweight packs</td></tr>
<tr><td>Quality</td><td>Reduced yield</td><td>Packs scrapped while the machine stabilizes after start-up</td></tr>
</tbody></table></div>
<h3>A worked example</h3>
<p>An 8-hour shift (480 min) has a 30-minute break, so planned production time is 450 min. The line stops for 47 min (a 25-minute changeover and a 22-minute breakdown), leaving 403 min of run time. The filler's ideal rate is 300 bottles/min. It produces 105,000 bottles, of which 103,200 are good.</p>
<ul class="calc">
<li>Availability = 403 &divide; 450 = <b>89.6%</b></li>
<li>Performance = 105,000 &divide; (403 &times; 300) = <b>86.8%</b></li>
<li>Quality = 103,200 &divide; 105,000 = <b>98.3%</b></li>
<li>OEE = 0.896 &times; 0.868 &times; 0.983 = <b>76.4%</b>. Check: 103,200 &divide; (450 &times; 300) = 76.4%.</li>
</ul>
<!--LAB-->
<aside class="note watch"><b>Watch out</b>The often-quoted "world-class OEE of 85%" (90% &times; 95% &times; 99.9%) is a rough benchmark from discrete manufacturing. Compare a line with its own history and constraints. Measure OEE at the line's constraint, usually the filler, against an honest ideal rate: the machine's rated speed for that product, not "what we usually run".</aside>
<p>Industry 4.0 changes OEE in one important way: automatic capture. Paper logs rarely record stops shorter than a few minutes. When plants switch to automatic data from PackML states and counters, reported OEE often <em>drops</em> at first. The line did not get worse. The measurement became honest, and the microstops became visible.</p>
<p><b>TEEP</b> (total effective equipment performance) extends OEE to all calendar time: TEEP = OEE &times; utilization, where utilization is planned production time divided by total calendar time. It shows how much hidden capacity sits in unscheduled shifts.</p>`,
    keys:[`OEE = Availability x Performance x Quality = good output at ideal speed as a share of planned time.`,`The six big losses map onto the three factors.`,`Automatic data capture usually lowers reported OEE at first, because microstops become visible.`] },
  { title:`Bottlenecks, buffers and the V-curve`, min:8,
    lab:{type:`linesim`, title:`Line simulator`},
    body:`
<p>A packaging line is a set of machines in series connected by conveyors. The conveyors are more than transport: they are <b>accumulation buffers</b> that absorb short stops. If the labeler stops for 30 seconds, bottles from the filler keep flowing onto the conveyor in between, and the filler keeps running.</p>
<h3>Protect the constraint</h3>
<p>Every line has a constraint: the machine that limits output. On beverage, food and pharma lines it is usually designed to be the <b>filler</b>, because it is the most expensive machine, the most product-critical (open product, hygiene, dosing accuracy) and the hardest to restart cleanly. Every minute the filler loses is lost for the whole line, so every other design choice serves one goal: keep the filler running.</p>
<h3>The V-curve</h3>
<p>To protect the filler, machines are rated faster the further they are from it, upstream and downstream. Plot rated speed against position on the line and you get a "V" with the filler at the bottom. A common rule of thumb is roughly 10% extra speed per step away from the filler, though the right values depend on each machine's reliability and on buffer sizes.</p>
<p>The extra speed lets each machine catch up after its own stops. A labeler that stops for 30 seconds can work off the bottles that built up in front of it, and a depalletizer can refill the buffer that feeds the filler. Without that overspeed, a buffer that fills once stays full, and the next stop reaches the filler.</p>
<aside class="note std"><b>Standard</b>The German standard DIN 8743 defines time-based terms and indicators for the efficiency of packaging machines and lines, so builders and plants measure line efficiency the same way.</aside>
<!--LAB-->
<p>Run the same shift with a flat line and then with a V-curve. The breakdowns happen at identical times in both runs, so any difference in output comes from line design alone.</p>
<p>Notice where the time goes. In a flat line, healthy machines spend much of the shift <em>blocked</em> or <em>starved</em>. That is the line losing output, not the machine, and it stays invisible if you only look at each machine's own OEE.</p>`,
    keys:[`Conveyors between machines are accumulation buffers that absorb short stops.`,`The filler is usually the designed constraint; everything else exists to keep it running.`,`In a V-curve, machines further from the filler run faster so they can catch up after stops.`] },
  { title:`From data to decisions: SPC`, min:7,
    lab:{type:`spc`, title:`Seal temperature control chart`},
    body:`
<p>Collecting data is not the goal; better decisions are. Analytics is often described as a ladder with four rungs:</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Rung</th><th>Question</th><th>Packaging example</th></tr></thead>
<tbody>
<tr><td>Descriptive</td><td>What happened?</td><td>OEE dashboard: line 2 ran at 71% last shift.</td></tr>
<tr><td>Diagnostic</td><td>Why did it happen?</td><td>Pareto of stop reasons: 40% of minor stops are label web breaks on one supplier's rolls.</td></tr>
<tr><td>Predictive</td><td>What will happen?</td><td>Vibration trend: the case erector gearbox bearing will likely fail within three weeks.</td></tr>
<tr><td>Prescriptive</td><td>What should we do?</td><td>Replace the bearing during Tuesday's planned changeover and order the part today.</td></tr>
</tbody></table></div>
<h3>Statistical process control</h3>
<p>Long before Industry 4.0, Walter Shewhart's <b>control charts</b> (1920s) separated two kinds of variation. <em>Common-cause</em> variation is the normal noise of a stable process. <em>Special-cause</em> variation signals that something changed: an aging heater, a new material lot, a worn part. Control limits sit at the process mean plus and minus three standard deviations (&sigma;), calculated from the process's own data.</p>
<p>The <b>Western Electric rules</b> detect special causes earlier than waiting for a point outside the limits:</p>
<ol>
<li>One point beyond 3&sigma;.</li>
<li>Two of three consecutive points beyond 2&sigma; on the same side.</li>
<li>Four of five consecutive points beyond 1&sigma; on the same side.</li>
<li>Eight consecutive points on the same side of the center line.</li>
</ol>
<aside class="note watch"><b>Watch out</b>Control limits are not specification limits. Specification limits say what the customer needs, such as a minimum seal strength. Control limits say what the process actually does. A process can be in control and still out of specification, or the other way round.</aside>
<!--LAB-->
<p>Connected lines make SPC continuous. Instead of an operator plotting five samples an hour, every pack's seal temperature, fill weight or label position can be charted automatically, and a rule violation can raise an alert or adjust the process before defects appear.</p>`,
    keys:[`Analytics climbs from descriptive to diagnostic, predictive and prescriptive.`,`Control charts separate common-cause noise from special causes; limits are mean plus or minus 3 sigma from process data.`,`Western Electric rules flag shifts and trends before a point crosses the limits.`] }
  ],
  quiz:[
    {q:`Planned time 400 min, run time 360 min, ideal rate 100 units/min, total count 32,400, good count 31,752. What is the OEE?`, o:[`90.0%`,`88.2%`,`81.0%`,`79.4%`], a:3, why:`A = 360/400 = 90%; P = 32,400/(360 x 100) = 90%; Q = 31,752/32,400 = 98%; OEE = 0.9 x 0.9 x 0.98 = 79.4%.`},
    {q:`Which losses reduce the Performance factor of OEE?`, o:[`Breakdowns and changeovers`,`Minor stops and reduced speed`,`Rejects and start-up scrap`,`Planned breaks and holidays`], a:1, why:`Breakdowns and setups hit Availability; minor stops and slow running hit Performance; defects and start-up losses hit Quality. Planned breaks are outside planned production time.`},
    {q:`Why are the machines next to the filler usually rated faster than the filler?`, o:[`Faster machines are cheaper to buy`,`So they can catch up after their own stops and keep the filler fed and cleared`,`Because regulations require it`,`To increase the filler's own speed`], a:1, why:`Overspeed lets buffers recover after a stop, so short stops do not reach the constraint.`},
    {q:`Seal temperature shows eight consecutive points above the center line, none outside 3 sigma. What does SPC suggest?`, o:[`Nothing; all points are within limits`,`The process has probably shifted; look for a special cause`,`Recalculate the control limits right away`,`Widen the specification limits`], a:1, why:`Western Electric rule 4: eight in a row on one side signals a shift, even inside the limits.`}
  ]
},

{ code:`Digital twins`, title:`Digital twins and simulation`,
  blurb:`Tell a digital model from a shadow and a twin, and use virtual commissioning to find bugs before startup.`,
  lessons:[
  { title:`Digital model, shadow and twin`, min:7,
    lab:{type:`classify`, title:`Model, shadow or twin?`, data:{
      prompt:`Classify each example by how data flows between the physical and digital object.`,
      cats:[`Digital model`,`Digital shadow`,`Digital twin`],
      items:[
        {t:`A 3D CAD model of a new tray former, used in a design review.`, a:`Digital model`, why:`No automatic data exchange with a physical machine.`},
        {t:`A dashboard shows a live 3D view of the line; each machine's colour follows its PackML state.`, a:`Digital shadow`, why:`Data flows automatically from physical to digital, but nothing flows back.`},
        {t:`A simulation receives live buffer levels and automatically adjusts the labeler's speed setpoint.`, a:`Digital twin`, why:`Data flows automatically in both directions.`},
        {t:`An engineer exports last week's downtime log into a spreadsheet simulation to test a bigger buffer.`, a:`Digital model`, why:`The data transfer is manual, so this is a model, however useful.`},
        {t:`A cloud model streams compressor energy data and predicts tomorrow's peak load for the planner.`, a:`Digital shadow`, why:`Automatic flow in; a person decides what to change.`},
        {t:`A virtual filler model synchronizes with the real filler's valve-wear data and automatically updates its valve timing.`, a:`Digital twin`, why:`The digital object changes the physical one automatically.`}
      ]}},
    body:`
<p>"Digital twin" is one of the most stretched terms in manufacturing. The concept is usually traced to Michael Grieves, who presented it for product life-cycle management at the University of Michigan around 2002, and NASA used the term in its 2010 technology roadmaps. Today it is applied to everything from a CAD file to a live plant simulation.</p>
<p>A useful way through the noise is the classification by <b>Kritzinger and colleagues (2018)</b>, which looks only at how data flows between the physical object and its digital counterpart:</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Type</th><th>Physical to digital</th><th>Digital to physical</th><th>Example</th></tr></thead>
<tbody>
<tr><td>Digital model</td><td>Manual</td><td>Manual</td><td>A 3D CAD model of a tray former used in a design review.</td></tr>
<tr><td>Digital shadow</td><td>Automatic</td><td>Manual</td><td>A live line view whose machine colours follow each PackML state.</td></tr>
<tr><td>Digital twin</td><td>Automatic</td><td>Automatic</td><td>A model that receives live buffer levels and writes new speed setpoints to the conveyors.</td></tr>
</tbody></table></div>
<h3>Twins at different scales</h3>
<ul>
<li><b>Product and package twin</b>: simulating a bottle's top-load strength or a case's compression behaviour before tooling is cut.</li>
<li><b>Machine twin</b>: a physics and logic model of one machine, used for virtual commissioning and operator training.</li>
<li><b>Line or process twin</b>: a discrete-event model of the whole line for testing buffer sizes, speeds and schedules.</li>
<li><b>Supply chain twin</b>: a model of material flows across plants, warehouses and suppliers.</li>
</ul>
<aside class="note watch"><b>Watch out</b>A twin is only as good as its model fidelity and its data. Start from a decision you need to make ("Do we need a bigger buffer before the case packer?") and build the simplest model that answers it.</aside>
<!--LAB-->`,
    keys:[`Model: manual data both ways. Shadow: automatic in, manual out. Twin: automatic both ways.`,`Twins exist at product, machine, line and supply-chain scale.`,`Scope a twin to a decision, not to "everything".`] },
  { title:`Virtual commissioning`, min:6,
    lab:{type:`reject`, title:`Reject timing test`},
    body:`
<p>Commissioning is the phase where a new machine or line is started up and its control software is proven. Traditionally it happens on site, under schedule pressure, with production waiting. Software bugs found then are expensive.</p>
<p><b>Virtual commissioning</b> moves much of that work earlier. The machine's control code runs against a simulation model of the machine, with its mechanics, sensors and actuators. Engineers test sequences, faults and edge cases on a computer before the steel is built.</p>
<ul>
<li><b>Software-in-the-loop (SIL)</b>: an emulated controller runs the real PLC program against the simulation.</li>
<li><b>Hardware-in-the-loop (HIL)</b>: the real controller hardware is connected to the simulation, which behaves like the machine's I/O.</li>
</ul>
<p>Machine builders use it to shorten the factory acceptance test (FAT) and site acceptance test (SAT). Plants use it to test a new format, a new robot pick pattern or changed collation logic before taking the line down.</p>
<h3>A classic bug a simulation catches</h3>
<p>A camera inspects packs, and a pusher 1.2 m downstream rejects the bad ones. The simplest code waits a fixed time after the camera trigger, tuned during commissioning at 40 m/min. It works perfectly at that speed. Then production raises the line speed.</p>
<!--LAB-->
<p>The fix is to track each pack by conveyor position, using an encoder, instead of by time. A virtual commissioning test that sweeps the speed range finds this in minutes. On the real line it shows up as escapes after the first speed change.</p>`,
    keys:[`Virtual commissioning tests control code against a simulated machine before or without the real hardware.`,`SIL emulates the controller; HIL connects the real controller to the simulation.`,`Track product by position (encoder), not by time, so logic works at every speed.`] }
  ],
  quiz:[
    {q:`Data flows automatically from a machine to its model, but changes go back only through an operator. What is this?`, o:[`A digital model`,`A digital shadow`,`A digital twin`,`An asset administration shell`], a:1, why:`Automatic one-way flow from physical to digital is a digital shadow (Kritzinger et al., 2018).`},
    {q:`What is the main purpose of virtual commissioning?`, o:[`To replace the PLC with a cloud service`,`To test control logic against a simulated machine before or without the physical hardware`,`To train operators in virtual reality only`,`To certify the machine's safety functions`], a:1, why:`Running the control code against a simulation finds logic errors before on-site startup.`},
    {q:`A reject station uses a fixed time delay tuned at 40 m/min. The line speeds up to 60 m/min. What happens?`, o:[`Nothing; time delays are speed-independent`,`The pusher fires too early and hits the pack in front`,`The pusher fires too late, the bad pack escapes, and a good pack may be rejected`,`The camera stops triggering`], a:2, why:`At higher speed the pack reaches the pusher sooner than the fixed delay assumes, so the pusher fires after it has passed.`},
    {q:`What distinguishes hardware-in-the-loop (HIL) from software-in-the-loop (SIL)?`, o:[`HIL uses the real controller hardware connected to the simulation`,`HIL runs only in the cloud`,`HIL does not need a simulation model`,`SIL requires the finished machine`], a:0, why:`In HIL the physical controller exchanges signals with a simulated machine; in SIL the controller is emulated in software.`}
  ]
},

{ code:`Maintenance & quality`, title:`Predictive maintenance and Quality 4.0`,
  blurb:`Catch failures early on the P-F curve, and tune vision inspection between false rejects and escapes.`,
  lessons:[
  { title:`Maintenance strategies and the P-F curve`, min:8,
    lab:{type:`pf`, title:`P-F curve explorer`},
    body:`
<p>Maintenance strategies form a progression from reacting to anticipating:</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Strategy</th><th>Trigger</th><th>Example</th></tr></thead>
<tbody>
<tr><td>Reactive</td><td>Failure</td><td>Run the conveyor motor until it fails, then replace it.</td></tr>
<tr><td>Preventive</td><td>Time or count</td><td>Replace the sealing jaw's PTFE tape every 200,000 cycles.</td></tr>
<tr><td>Condition-based</td><td>A measured condition crosses a limit</td><td>Change the vacuum cups when time-to-vacuum exceeds 120 ms.</td></tr>
<tr><td>Predictive</td><td>A forecast of remaining useful life</td><td>A model predicts the gearbox bearing will fail in about three weeks.</td></tr>
<tr><td>Prescriptive</td><td>A recommended action and timing</td><td>Replace the bearing at Tuesday's changeover, the cheapest slot before the predicted failure.</td></tr>
</tbody></table></div>
<p>Why not simply replace parts on a schedule? Nowlan and Heap's 1978 study of airline equipment, the foundation of reliability-centred maintenance (RCM), found that most components showed no clear wear-out age; their failures were largely random in time. Replacing such parts on a fixed schedule wastes parts and can even introduce failures, while monitoring their condition catches each failure as it develops.</p>
<h3>The P-F curve</h3>
<p>The P-F curve shows how a failure develops. At point <b>P</b>, a potential failure becomes detectable. At point <b>F</b>, the equipment fails functionally. The time between them, the <b>P-F interval</b>, is your window to plan the repair. Different techniques see the problem at different points: a bearing defect shows up first in ultrasound and vibration data, later as heat, then as noise, and only at the end as something an operator can feel.</p>
<!--LAB-->
<p>The key rule: the inspection interval must be shorter than the P-F interval, and is commonly set at about half of it. Continuous online sensors make the interval effectively zero, which is why connected condition monitoring is attractive for critical machines.</p>
<aside class="note line"><b>On the line</b>Good candidates for condition monitoring: vacuum pumps on thermoformers and pick-and-place heads, gearboxes on case erectors and palletizers, sealing-jaw heaters (watch the current draw), conveyor chains (elongation) and the filler's main drive.</aside>`,
    keys:[`Strategies progress from reactive and preventive to condition-based, predictive and prescriptive.`,`Many failures are not age-related, so condition monitoring beats fixed schedules for them.`,`Inspect more often than the P-F interval (commonly half of it); online sensors close the gap.`] },
  { title:`Machine vision and AI inspection`, min:8,
    lab:{type:`vision`, title:`Reject threshold trade-off`},
    body:`
<p>Machine vision is the most widespread "smart" technology on packaging lines. Cameras check every pack at full line speed, which no human inspector can.</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Check</th><th>Examples</th></tr></thead>
<tbody>
<tr><td>Presence and completeness</td><td>Cap, leaflet, spoon, every bottle in the case</td></tr>
<tr><td>Position and orientation</td><td>Label skew, cap alignment, carton flap closure</td></tr>
<tr><td>Code reading and grading</td><td>1D and 2D barcodes, graded to ISO/IEC 15416 (linear) and ISO/IEC 15415 (2D)</td></tr>
<tr><td>Text verification</td><td>OCR and OCV of lot, expiry and price</td></tr>
<tr><td>Seal and contamination</td><td>Product trapped in pouch seals, wrinkles, channel leaks</td></tr>
<tr><td>Fill and count</td><td>Fill level, pieces per tray, blister pockets</td></tr>
</tbody></table></div>
<h3>Rules or deep learning?</h3>
<p><b>Rule-based vision</b> measures defined features: edges, blobs, pattern matches, dimensions. It is precise, fast and easy to validate for well-defined checks such as reading a code or measuring cap height. <b>Deep learning</b> learns from labelled example images. It handles defects that vary in shape and appearance, such as wrinkles or crumbs in a seal, but it needs representative training data and ongoing monitoring, because products, lighting and materials drift.</p>
<h3>Every threshold is a trade-off</h3>
<p>An inspection system scores each pack and compares the score with a threshold. Two errors are possible:</p>
<ul>
<li><b>False reject</b>: a good pack is rejected. It costs product, packaging and the Quality factor of OEE.</li>
<li><b>Escape</b>: a bad pack is accepted. It costs complaints, chargebacks, recalls and trust.</li>
</ul>
<p>Moving the threshold trades one error for the other. The right setting depends on what each error costs, and the only way to reduce <em>both</em> is a better inspection: better lighting, optics or model.</p>
<!--LAB-->
<p><b>Quality 4.0</b> goes one step further and uses inspection data to correct the process, not only to sort its output. If the camera sees labels drifting 1 mm to the left, the system adjusts the labeler's registration before any pack fails.</p>`,
    keys:[`Vision checks presence, position, codes, text, seals, fill and count at full line speed.`,`Rule-based vision suits measurable features; deep learning suits variable, cosmetic defects.`,`A threshold trades false rejects against escapes; set it by cost, and improve the inspection to reduce both.`] }
  ],
  quiz:[
    {q:`On a typical P-F curve for a bearing, which technique gives the earliest warning?`, o:[`Hot to the touch`,`Audible noise`,`Vibration or ultrasound analysis`,`Visible smoke`], a:2, why:`Ultrasound and vibration detect bearing defects long before heat, noise or touch.`},
    {q:`How should the condition-monitoring interval relate to the P-F interval?`, o:[`It should equal the P-F interval`,`It should be shorter, commonly about half of it`,`It should be twice as long to save cost`,`They are unrelated`], a:1, why:`Inspect often enough to catch the failure inside the P-F window with time left to act; about half the interval is a common rule.`},
    {q:`What usually happens when you make an inspection more sensitive by lowering the reject threshold?`, o:[`Escapes and false rejects both fall`,`Escapes fall but false rejects rise`,`False rejects fall but escapes rise`,`Nothing changes`], a:1, why:`A lower threshold catches more defects but also rejects more good packs.`},
    {q:`Which task suits deep learning better than rule-based vision?`, o:[`Reading a GS1 DataMatrix`,`Measuring cap height`,`Detecting wrinkles and trapped product in pouch seals`,`Checking that a label is present`], a:2, why:`Variable, cosmetic defects are hard to describe with rules but learnable from labelled examples.`}
  ]
},

{ code:`Traceability`, title:`Serialization, traceability and smart packaging`,
  blurb:`GS1 identifiers and aggregation, EPCIS 2.0 events, connected packs, and fast changeovers for mass customization.`,
  lessons:[
  { title:`Serialization and GS1 identifiers`, min:9,
    lab:{type:`gs1`, title:`GS1 decoder and check digit`},
    body:`
<p>Most products carry a code that identifies the <em>product type</em>: every 500 ml bottle of the same juice has the same barcode. <b>Serialization</b> adds a unique serial number to every saleable unit, so each pack can be identified individually. It is mandatory for prescription medicines in many markets and spreading to other goods for anti-counterfeiting, recalls and consumer engagement.</p>
<h3>GS1 identification keys</h3>
<p>GS1 is the global not-for-profit organization behind the barcode on nearly every retail product. Its main identification keys:</p>
<ul>
<li><b>GTIN</b> (Global Trade Item Number) identifies a product type at any packaging level, in 8, 12, 13 or 14 digits.</li>
<li><b>SSCC</b> (Serial Shipping Container Code) is an 18-digit number that identifies one logistic unit, such as one specific pallet.</li>
<li><b>GLN</b> (Global Location Number) identifies a location or a party.</li>
</ul>
<p>Data on the pack is encoded with <b>Application Identifiers</b> (AIs), shown in parentheses in the human-readable text:</p>
<div class="tbl-wrap"><table>
<thead><tr><th>AI</th><th>Meaning</th><th>Format</th></tr></thead>
<tbody>
<tr><td><code>(01)</code></td><td>GTIN</td><td>14 digits</td></tr>
<tr><td><code>(17)</code></td><td>Expiry date</td><td>YYMMDD</td></tr>
<tr><td><code>(10)</code></td><td>Batch or lot</td><td>Up to 20 characters</td></tr>
<tr><td><code>(21)</code></td><td>Serial number</td><td>Up to 20 characters</td></tr>
<tr><td><code>(00)</code></td><td>SSCC</td><td>18 digits</td></tr>
</tbody></table></div>
<p>The data is carried in a <b>GS1 DataMatrix</b> (the standard on medicine packs), a GS1-128 barcode on logistic labels, an RFID tag, or a QR code using <b>GS1 Digital Link</b>, which writes the same data as a web address. GS1 US's "Sunrise 2027" initiative aims for retail checkouts to scan 2D codes by the end of 2027, so one code can serve both the checkout and the consumer.</p>
<!--LAB-->
<h3>Aggregation</h3>
<p>A pallet can hold thousands of serialized units. <b>Aggregation</b> records the parent-child relationships as products are packed: units into bundles, bundles into cases, cases onto a pallet with its SSCC. Downstream, scanning one pallet code reveals every unit inside. Aggregation data must stay correct: if an operator pulls a pack out of a case for inspection, the system has to record that too.</p>
<h3>Regulations that drove it</h3>
<ul>
<li><b>EU Falsified Medicines Directive</b> (Directive 2011/62/EU, with Delegated Regulation 2016/161): since 9 February 2019, prescription medicine packs carry a unique identifier in a DataMatrix and an anti-tampering device, and are verified against a European verification system before they are dispensed.</li>
<li><b>US Drug Supply Chain Security Act</b> (DSCSA, 2013): phased in package-level serialization and, from November 2023, electronic, interoperable tracing between trading partners, with the FDA allowing some trading partners extra time.</li>
</ul>
<aside class="note std"><b>Standard</b>Serialization systems are often described in five levels that mirror ISA-95: L1 printers and cameras, L2 the line system, L3 the site server, L4 the enterprise repository, L5 the connection to trading partners and regulatory hubs.</aside>`,
    keys:[`A GTIN identifies a product type; a serial number makes each unit unique; an SSCC identifies one logistic unit.`,`Application Identifiers such as (01), (17), (10) and (21) structure the data in the code.`,`Aggregation links units to cases and pallets, so one scan reveals the contents.`] },
  { title:`Traceability events with EPCIS 2.0`, min:6,
    lab:{type:`epcis`, title:`Anatomy of an EPCIS event`},
    body:`
<p>Identifiers say <em>which</em> item. Traceability also needs to know <em>what happened to it</em>. GS1's <b>EPCIS</b> (Electronic Product Code Information Services) standard records this as a stream of events that companies can share. Version 2.0, ratified in 2022, added a JSON and JSON-LD syntax, a REST interface and support for sensor data.</p>
<p>Every EPCIS event answers the same questions:</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Dimension</th><th>Question</th><th>Example</th></tr></thead>
<tbody>
<tr><td>What</td><td>Which objects?</td><td>The case's SSCC and the serialized units inside it</td></tr>
<tr><td>When</td><td>When did it happen?</td><td>2026-03-14 09:41:07, UTC-05:00</td></tr>
<tr><td>Where</td><td>Where did it happen, and where are the objects now?</td><td>Read point: Line 2 case packer. Business location: the Dallas plant.</td></tr>
<tr><td>Why</td><td>In which business step, and in what state?</td><td>Business step: packing. Disposition: in progress.</td></tr>
<tr><td>How (new in 2.0)</td><td>Under which conditions?</td><td>Sensor data such as temperature, humidity or shock</td></tr>
</tbody></table></div>
<h3>Event types</h3>
<ul>
<li><b>ObjectEvent</b>: something happened to objects, such as commissioning a serial number or shipping.</li>
<li><b>AggregationEvent</b>: objects were packed into, or unpacked from, a parent, such as units into a case.</li>
<li><b>TransformationEvent</b>: inputs became different outputs, such as bulk product filled into bottles.</li>
<li><b>TransactionEvent</b>: objects were linked to a business transaction, such as a purchase order.</li>
<li><b>AssociationEvent</b> (new in 2.0): objects were associated with an asset, such as a temperature logger attached to a pallet.</li>
</ul>
<!--LAB-->
<aside class="note line"><b>On the line</b>In a recall, EPCIS events let you answer "which pallets contain units from film lot F-2207, and where did those pallets go?" in minutes instead of days. That is the difference between a targeted withdrawal and pulling everything off the shelves.</aside>`,
    keys:[`EPCIS records what, when, where and why for every event; 2.0 adds how (sensor data).`,`Five event types: Object, Aggregation, Transformation, Transaction and Association.`,`Shared event data makes recalls targeted and fast.`] },
  { title:`Smart packaging and fast changeovers`, min:8,
    lab:{type:`classify`, title:`SMED sorter`, data:{
      prompt:`Sort each changeover task. Can it be done while the machine is still running (external), or only when it is stopped (internal)?`,
      cats:[`External`,`Internal`],
      items:[
        {t:`Fetch the next format's change parts from the tool store.`, a:`External`, why:`Do it while the current order runs; the parts should be at the line before the stop.`},
        {t:`Pre-heat the spare set of sealing jaws for the new film.`, a:`External`, why:`Pre-heating outside the machine removes a wait from the stop.`},
        {t:`Swap the star wheels and guide parts on the filler.`, a:`Internal`, why:`It needs the machine stopped. Tool-less quick-release parts and RFID verification shorten it.`},
        {t:`Stage the new labels, cartons and film reels at the line.`, a:`External`, why:`Material staging is classic external work.`},
        {t:`Adjust the guide-rail width for the new bottle diameter.`, a:`Internal`, why:`Internal when done by hand. Servo-driven rails with recipe positions turn it into a few seconds of automatic movement.`},
        {t:`Clean product-contact parts for an allergen changeover.`, a:`Internal`, why:`Cleaning needs the machine stopped; clean-in-place and hygienic design shorten it.`}
      ]}},
    body:`
<h3>Smart packaging</h3>
<p>Packaging itself is becoming part of the connected system. Two families are usually distinguished:</p>
<ul>
<li><b>Active packaging</b> interacts with the product to extend shelf life: oxygen scavengers, moisture absorbers, antimicrobial films.</li>
<li><b>Intelligent packaging</b> monitors and communicates: time-temperature indicators, freshness indicators, NFC and RFID tags, and QR codes carrying GS1 Digital Link data.</li>
</ul>
<p>Connected packs support authentication (an NFC tag that signs each tap cryptographically), consumer information and recycling instructions, cold-chain records and digital product passports. The EU's Ecodesign for Sustainable Products Regulation (2024) introduces digital product passports for priority product groups, and the EU Packaging and Packaging Waste Regulation (Regulation (EU) 2025/40) sets requirements for recyclability, recycled content and packaging minimization that companies will need data to demonstrate.</p>
<h3>Mass customization</h3>
<p>Digital printing makes short runs and variable data affordable: regional versions, promotions, even personalized packs. The result is more changeovers with shorter runs between them. On many lines, changeovers are now the largest single OEE loss.</p>
<h3>SMED meets Industry 4.0</h3>
<p><b>SMED</b> (single-minute exchange of die), developed by Shigeo Shingo, aims to cut changeovers to under ten minutes. Its core method:</p>
<ol>
<li>Separate <b>internal</b> setup (work that can only be done while the machine is stopped) from <b>external</b> setup (work that can be done while it is still running).</li>
<li>Convert internal work to external wherever possible: prepare, pre-heat and pre-assemble in advance.</li>
<li>Streamline what remains internal: quick-release fasteners, tool-less change parts, standard heights.</li>
</ol>
<p>Industry 4.0 adds recipe management that downloads every setpoint from the MES, servo-driven format adjustment that moves guide rails and stops to stored positions, RFID-verified change parts, and digital or augmented-reality work instructions that guide each step.</p>
<!--LAB-->`,
    keys:[`Active packaging acts on the product; intelligent packaging monitors and communicates.`,`Mass customization multiplies changeovers, so changeover speed becomes a core capability.`,`SMED separates internal from external work; Industry 4.0 automates and verifies what remains.`] }
  ],
  quiz:[
    {q:`Which GS1 Application Identifier carries the expiry date?`, o:[`(01)`,`(10)`,`(17)`,`(21)`], a:2, why:`(17) is the expiry date in YYMMDD. (01) is the GTIN, (10) the batch or lot, (21) the serial number.`},
    {q:`What does aggregation record?`, o:[`The total number of packs produced per shift`,`Parent-child links between serialized units and the cases and pallets that contain them`,`The price of each unit`,`The barcode print quality grade`], a:1, why:`Aggregation lets one scan of a case or pallet reveal every unit inside.`},
    {q:`Which EPCIS 2.0 dimension captures sensor data such as temperature?`, o:[`What`,`Where`,`Why`,`How`], a:3, why:`EPCIS 2.0 added the "how" dimension for sensor data.`},
    {q:`What is the key first step in SMED?`, o:[`Buy faster machines`,`Separate internal setup (machine stopped) from external setup (machine running)`,`Reduce the number of SKUs`,`Lengthen production runs`], a:1, why:`Separating internal and external work, then converting internal to external, is the core of SMED.`}
  ]
},

{ code:`People & robots`, title:`Robots, people and Industry 5.0`,
  blurb:`Robots and cobots in packaging, mobile robots, high-performance HMIs, and the human-centric view of Industry 5.0.`,
  lessons:[
  { title:`Robots, cobots and mobile robots`, min:7,
    lab:{type:`classify`, title:`Collaborative modes`, data:{
      prompt:`Which collaborative operation method does each situation describe?`,
      cats:[`Monitored stop`,`Hand guiding`,`Speed & separation`,`Power & force limiting`],
      items:[
        {t:`The robot stops while an operator places cartons in the shared area, and resumes when they leave.`, a:`Monitored stop`, why:`A safety-rated monitored stop holds the robot while a person is in the collaborative space.`},
        {t:`An operator teaches a new palletizing pattern by pushing the robot arm by hand.`, a:`Hand guiding`, why:`The person moves the robot directly through a guiding device.`},
        {t:`A laser scanner slows the robot as a person approaches and stops it at a minimum distance.`, a:`Speed & separation`, why:`Speed and separation monitoring keeps a protective distance, adjusting speed as people approach.`},
        {t:`The robot works beside the operator; if it touches them, contact forces stay below limits for that body region.`, a:`Power & force limiting`, why:`Contact is allowed but limited by design and control.`}
      ]}},
    body:`
<p>Robots in packaging handle three broad jobs: picking products into primary packs, loading packs into cases, and palletizing.</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Robot type</th><th>Strength</th><th>Typical use</th></tr></thead>
<tbody>
<tr><td>Delta (parallel) robot</td><td>Very fast, light payloads</td><td>Picking biscuits, chocolates or pouches from a conveyor into trays</td></tr>
<tr><td>SCARA</td><td>Fast and precise in a plane</td><td>Pick-and-place, tray loading</td></tr>
<tr><td>Articulated (6-axis)</td><td>Reach, flexibility, heavier payloads</td><td>Case packing, palletizing, depalletizing</td></tr>
<tr><td>Gantry</td><td>Large work areas, heavy loads</td><td>Layer palletizing, case packing</td></tr>
<tr><td>Collaborative robot (cobot)</td><td>Can work near people without full guarding, where the risk assessment allows</td><td>End-of-line palletizing, case erecting, machine tending</td></tr>
</tbody></table></div>
<p>The delta robot was invented by Reymond Clavel at EPFL in the 1980s and is now standard in high-speed food packaging. With vision and conveyor tracking it picks randomly oriented products from a moving belt.</p>
<h3>Safety and collaboration</h3>
<p>Robot safety is defined in <b>ISO 10218</b> (parts 1 and 2), with guidance for collaborative applications in <b>ISO/TS 15066</b>. They describe four ways a robot and a person can share work:</p>
<ul>
<li><b>Safety-rated monitored stop</b>: the robot stops while a person is in the shared space.</li>
<li><b>Hand guiding</b>: the person moves the robot directly by hand.</li>
<li><b>Speed and separation monitoring</b>: sensors slow the robot as a person approaches and stop it at a protective distance.</li>
<li><b>Power and force limiting</b>: contact is possible, but forces and pressures stay below limits for each body region.</li>
</ul>
<aside class="note watch"><b>Watch out</b>A cobot is not automatically safe. The <em>application</em> is what gets assessed: a cobot carrying a 15 kg case with sharp corners, or a gripper with a blade, may need guarding just like an industrial robot.</aside>
<h3>Mobile robots</h3>
<p><b>AGVs</b> (automated guided vehicles) follow fixed paths marked by tape, magnets or wires. <b>AMRs</b> (autonomous mobile robots) build a map with lidar and cameras and plan their own routes around obstacles. In packaging plants they bring film reels and carton blanks to the lines and take finished pallets to the warehouse. The VDA 5050 interface standardizes communication between vehicles of different makes and a central fleet manager.</p>
<!--LAB-->`,
    keys:[`Delta robots pick fast and light; articulated and gantry robots handle cases and pallets.`,`ISO 10218 and ISO/TS 15066 define four collaborative methods; the application, not the robot, is assessed.`,`AGVs follow fixed paths; AMRs navigate dynamically.`] },
  { title:`Operator 4.0 and Industry 5.0`, min:6,
    lab:{type:`hmi`, title:`Find the abnormal value`},
    body:`
<p>Industry 4.0 does not remove people from the line. It changes their work: less knob-turning and clearing the same jam, more supervising, diagnosing and improving. The concept of <b>Operator 4.0</b> (Romero and colleagues, 2016) describes how technology can augment workers physically and cognitively:</p>
<ul>
<li><b>Super-strength</b>: exoskeletons support lifting and overhead work.</li>
<li><b>Augmented</b>: tablets or AR glasses overlay changeover steps on the machine.</li>
<li><b>Virtual</b>: VR training on a machine model before touching the real one.</li>
<li><b>Healthy</b>: wearables monitor strain, heat and fatigue.</li>
<li><b>Smarter</b>: assistants answer "how do I clear fault 214?" from manuals and past repairs.</li>
<li><b>Collaborative</b>: cobots take over heavy and repetitive tasks.</li>
<li><b>Social and analytical</b>: operators read live data and share knowledge across shifts.</li>
</ul>
<h3>Screens that show what matters</h3>
<p>The operator's main window is the HMI. <b>ISA-101</b> (ANSI/ISA-101.01) describes high-performance HMI design: muted grey backgrounds, values shown in context, and strong colour reserved for abnormal conditions, so an operator sees at a glance what needs attention. Many legacy screens do the opposite, with bright pictures of machines in every colour, so an alarm has to compete with decoration.</p>
<!--LAB-->
<h3>Industry 5.0</h3>
<p>In 2021 the European Commission described <b>Industry 5.0</b> as a complement to Industry 4.0 rather than its successor. It adds three values to the efficiency focus: <b>human-centric</b> (technology adapts to people), <b>sustainable</b> (circular, low-energy, low-waste) and <b>resilient</b> (able to absorb shocks).</p>
<aside class="note line"><b>On the line</b>Most digital projects that fail do so for organizational reasons. Involve operators from the start, show them the data, and use it first to remove their daily frustrations (the jam that happens every shift), not to rank people. When the data makes their job easier, they keep it accurate.</aside>`,
    keys:[`Operator 4.0 augments people physically and cognitively; it does not remove them.`,`ISA-101 HMIs reserve strong colour for abnormal conditions.`,`Industry 5.0 adds human-centric, sustainable and resilient goals to Industry 4.0.`] }
  ],
  quiz:[
    {q:`A laser scanner slows a robot as people approach and stops it at a minimum distance. Which collaborative method is this?`, o:[`Hand guiding`,`Power and force limiting`,`Speed and separation monitoring`,`Safety-rated monitored stop`], a:2, why:`Speed and separation monitoring adjusts robot speed to keep a protective distance.`},
    {q:`What is the key difference between an AMR and an AGV?`, o:[`AMRs are always slower`,`AMRs navigate dynamically with onboard sensors and maps; AGVs follow fixed guided paths`,`AGVs cannot carry pallets`,`AMRs need magnetic tape on the floor`], a:1, why:`AGVs follow tape, magnets or wires; AMRs plan their own routes around obstacles.`},
    {q:`Which is a core principle of ISA-101 high-performance HMI design?`, o:[`Use a bright colour for every machine state`,`Show realistic 3D pictures of each machine`,`Use muted greys and reserve strong colour for abnormal situations`,`Show as many trends as possible on one screen`], a:2, why:`When colour means "abnormal", abnormal conditions stand out immediately.`},
    {q:`Which three values does Industry 5.0 emphasize?`, o:[`Speed, cost, quality`,`Human-centric, sustainable, resilient`,`Automated, autonomous, artificial`,`Lean, agile, digital`], a:1, why:`The European Commission's 2021 framing adds human-centricity, sustainability and resilience.`}
  ]
},
/* ---------- STATION 9 ---------- */
{ code:`Security & roadmap`, title:`Security, maturity and your roadmap`,
  blurb:`Secure the connected line with IEC 62443, find your maturity stage, and build an investment plan in the capstone.`,
  lessons:[
  { title:`OT cybersecurity`, min:8,
    lab:{type:`classify`, title:`Spot the risks`, data:{
      prompt:`A plant audit lists these findings. Which are risks, and which are good practice?`,
      cats:[`Risk`,`Good practice`],
      items:[
        {t:`The case packer builder's remote-access modem is permanently connected.`, a:`Risk`, why:`Always-on remote access is a common entry point. Use brokered, logged, on-demand access through the DMZ.`},
        {t:`The historian sits in the DMZ and replicates data to the business network; there is no direct office-to-PLC traffic.`, a:`Good practice`, why:`A DMZ between the plant and business networks is the core of Purdue-style segmentation.`},
        {t:`An HMI runs an unsupported Windows version and has an open USB port for recipe updates.`, a:`Risk`, why:`Unpatched systems and removable media are classic infection paths. Isolate, harden and control media.`},
        {t:`Line PLCs and HMIs sit in their own zone, with firewall rules that allow only the protocols they need.`, a:`Good practice`, why:`This is zones and conduits from IEC 62443 in practice.`},
        {t:`All HMIs share one "operator" login, and the password is on a sticky note.`, a:`Risk`, why:`Shared, exposed credentials remove accountability and access control.`},
        {t:`The OPC UA server uses SignAndEncrypt with a certificate per client.`, a:`Good practice`, why:`OPC UA's built-in security authenticates applications and protects data in transit.`},
        {t:`The network is flat: office laptops can reach the filler PLC.`, a:`Risk`, why:`Without segmentation, any compromised office device can reach the controllers.`},
        {t:`Offline, tested backups of every PLC program are kept per machine.`, a:`Good practice`, why:`Tested offline backups are what make recovery after ransomware possible.`}
      ]}},
    body:`
<p>Every connection that brings data out of a machine is also a path in. Operational technology (OT), meaning the PLCs, HMIs, drives and networks that run the process, needs different security thinking than office IT:</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Aspect</th><th>Office IT</th><th>Plant OT</th></tr></thead>
<tbody>
<tr><td>First priority</td><td>Confidentiality of data</td><td>Availability and safety of the process</td></tr>
<tr><td>Asset lifetime</td><td>3 to 5 years</td><td>15 to 25 years or more</td></tr>
<tr><td>Patching</td><td>Monthly, often automatic</td><td>Needs planned downtime and vendor validation; some systems cannot be patched</td></tr>
<tr><td>Impact of an incident</td><td>Data loss, outage</td><td>Stopped lines, damaged equipment, unsafe conditions, unsafe product</td></tr>
</tbody></table></div>
<p>Incidents show the stakes. Stuxnet, discovered in 2010, manipulated PLCs to damage centrifuges. In 2019 a ransomware attack forced aluminium producer Norsk Hydro to switch several plants to manual operation. Several industry threat reports in recent years have ranked manufacturing as the most frequently attacked sector.</p>
<h3>IEC 62443</h3>
<p>The <b>ISA/IEC 62443</b> series is the main standard family for industrial automation security. Its central ideas:</p>
<ul>
<li><b>Zones and conduits</b>: group assets with similar security needs into zones (for example, Line 2 control), and allow communication between zones only through defined conduits with controls such as firewalls.</li>
<li><b>Security levels</b> SL 1 to SL 4, from protection against casual or accidental violation up to protection against sophisticated attackers with extensive resources.</li>
<li><b>Shared responsibility</b> between the asset owner (the plant), the system integrator, and the product suppliers (machine and component builders).</li>
</ul>
<p>The older <b>Purdue model</b> provides the layered network picture most plants use, with an industrial DMZ (often called Level 3.5) between the plant network and the business network. Data such as historian replication passes through the DMZ; there is no direct traffic from the office to a PLC.</p>
<aside class="note std"><b>Regulation</b>The EU NIS2 Directive (2022/2555) extended cybersecurity obligations to many manufacturers, and the EU Cyber Resilience Act (Regulation (EU) 2024/2847) sets security requirements for products with digital elements, which include many machine components.</aside>
<!--LAB-->`,
    keys:[`OT puts availability and safety first; assets live for decades and are hard to patch.`,`IEC 62443 organizes security with zones, conduits, security levels and shared responsibility.`,`Segment the network, control remote access and keep tested offline backups.`] },
  { title:`Maturity, business case and roadmap`, min:8,
    lab:{type:`maturity`, title:`Maturity self-check`},
    body:`
<p>Industry 4.0 is not one project. It is a sequence of capabilities, and skipping steps is the most common way to waste money. The <b>acatech Industrie 4.0 Maturity Index</b> describes six stages:</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Stage</th><th>Question it answers</th><th>Packaging line example</th></tr></thead>
<tbody>
<tr><td>1. Computerization</td><td>(foundation)</td><td>Machines have PLCs; the plant has an ERP; they are not connected.</td></tr>
<tr><td>2. Connectivity</td><td>(foundation)</td><td>Machines are networked and their data can be read remotely.</td></tr>
<tr><td>3. Visibility</td><td>What is happening?</td><td>Live states and OEE for every machine: a digital shadow.</td></tr>
<tr><td>4. Transparency</td><td>Why is it happening?</td><td>Root-cause analysis links stops to materials, shifts and settings.</td></tr>
<tr><td>5. Predictive capacity</td><td>What will happen?</td><td>Forecasts of failures, quality drift and late orders.</td></tr>
<tr><td>6. Adaptability</td><td>How can it respond by itself?</td><td>The line adjusts speeds and schedules autonomously within set limits.</td></tr>
</tbody></table></div>
<p>Stages 1 and 2 are the digital foundation; Industry 4.0 proper starts at visibility. The index also assesses four structural areas, because technology alone does not move a company up: <b>resources</b>, <b>information systems</b>, <b>culture</b> and <b>organizational structure</b>. Other frameworks, such as Singapore's Smart Industry Readiness Index (SIRI), serve the same purpose.</p>
<!--LAB-->
<h3>Building the business case</h3>
<p>Translate improvements into money with the value of one OEE point:</p>
<div class="formula">Value of 1 OEE point per year = Ideal rate &times; Planned time &times; 1% &times; Margin per unit</div>
<p>Example: a line with an ideal rate of 200 units/min, 6,000 planned hours a year (360,000 minutes) and a contribution margin of $0.05 per unit. One OEE point is 720,000 more good units, worth $36,000 a year, provided the market takes the extra output or it replaces overtime and extra shifts.</p>
<h3>A roadmap that scales</h3>
<ol>
<li><b>Start from a problem</b>, not a technology. "We lose 90 minutes a shift to changeovers" beats "we need AI".</li>
<li><b>Pick a lighthouse line</b> and measure a baseline before changing anything.</li>
<li><b>Build the data foundation</b>: connectivity, naming, a unified namespace, security.</li>
<li><b>Deliver one use case end to end</b>, including the work routine that uses the data, such as the daily meeting or the maintenance round.</li>
<li><b>Scale with templates</b>, so the second line takes weeks, not months.</li>
</ol>
<aside class="note watch"><b>Watch out</b>"Pilot purgatory" is the common failure mode: successful pilots that never scale because each was a one-off, built on a custom data model, with no owner once the project team left.</aside>`,
    keys:[`Maturity runs computerization, connectivity, visibility, transparency, predictive capacity, adaptability.`,`Value one OEE point: ideal rate x planned time x 1% x margin.`,`Start from a problem, prove one use case end to end, then scale with templates.`] },
  { title:`Capstone: the Line 3 investment plan`, min:15, capstone:true,

    body:`
<p>Put the course to work. You are the operations engineer at a contract packager. Line 3 is a vertical form-fill-seal (VFFS) line bagging snacks: a multihead weigher, the bagger, a checkweigher with metal detector, a case packer and a palletizer. Management has approved <b>$200,000</b> for improvements this year and wants the best return.</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Fact</th><th>Value</th></tr></thead>
<tbody>
<tr><td>Ideal rate (bagger, the constraint)</td><td>80 bags/min</td></tr>
<tr><td>Planned production time</td><td>4,000 h/year (2 shifts, 250 days)</td></tr>
<tr><td>Contribution margin</td><td>$0.06 per bag</td></tr>
<tr><td>Current OEE</td><td>58%, measured automatically for the last three months</td></tr>
<tr><td>Value of one OEE point</td><td>80 &times; 60 &times; 4,000 &times; 1% &times; $0.06 = <b>$11,520 a year</b></td></tr>
</tbody></table></div>
<p>The loss analysis below shows where the other 42 points go. Choose your initiatives: think about which losses are largest, which investments address them, and which depend on others. The effects are planning estimates, as they would be in a real business case.</p>
<!--LAB-->`,
    keys:[`Start with the largest measured losses, not the most exciting technology.`,`Data visibility is often the cheapest improvement and the foundation for the rest.`,`Investments that do not touch the constraint do not raise line output, even when they bring other benefits.`] }
  ],
  quiz:[
    {q:`In plant OT, which security objective usually comes first?`, o:[`Confidentiality`,`Availability and safety`,`Non-repudiation`,`Anonymity`], a:1, why:`Keeping the process running safely is the first priority in OT, unlike office IT where confidentiality often leads.`},
    {q:`What does the IEC 62443 "zones and conduits" concept describe?`, o:[`Physical fire zones in the plant`,`Grouping assets with similar security needs into zones, and controlling communication between them through defined conduits`,`Wireless coverage areas`,`Electrical cable routing`], a:1, why:`Zones group assets by security requirement; conduits are the controlled communication paths between zones.`},
    {q:`In the acatech maturity index, which stage first answers "why is it happening?"`, o:[`Connectivity`,`Visibility`,`Transparency`,`Adaptability`], a:2, why:`Visibility shows what is happening; transparency explains why; predictive capacity forecasts; adaptability responds.`},
    {q:`Ideal rate 200 units/min, 6,000 planned hours a year, margin $0.05 per unit. What is one OEE point worth per year?`, o:[`$3,600`,`$36,000`,`$60,000`,`$360,000`], a:1, why:`200 x 60 x 6,000 = 72 million units at 100%. 1% = 720,000 units x $0.05 = $36,000.`}

/* Integrative questions used only in the final assessment */
const EXAM_EXTRA = [
  {q:`A beverage plant wants to cut filler changeovers from 45 to 20 minutes. Which plan fits best?`, o:[`Buy a faster filler`,`SMED analysis, recipe-driven servo adjustments and RFID-verified change parts`,`Add a larger buffer after the filler`,`Install a cloud data lake first`], a:1, why:`SMED removes and shortens internal work; recipes, servo formats and verified change parts make the remaining steps fast and error-free.`},
  {q:`A jam signal travels: photo-eye, PLC, PackML state Held, OPC UA, MQTT broker, then a downtime record. Where does the downtime record belong in ISA-95?`, o:[`Level 1`,`Level 2`,`Level 3`,`Level 4`], a:2, why:`Downtime tracking and OEE are manufacturing operations management functions at Level 3, typically the MES.`},
  {q:`A cobot palletizer is installed at the end of the line, but line OEE does not change. What is the most likely reason?`, o:[`Cobots are slower than people`,`The palletizer was not the constraint; the filler still limits output`,`OEE cannot measure robots`,`The cobot needs a digital twin`], a:1, why:`Only gains at the constraint raise line output. The cobot may still save labour and strain.`},
  {q:`A pharma packer must prove which serialized cartons went into which shipper case. Which records provide that?`, o:[`ObjectEvents with bizStep "shipping"`,`AggregationEvents linking each case to its child serials`,`TransformationEvents for the bulk product`,`OEE quality counts`], a:1, why:`AggregationEvents record parent-child packing relationships.`},
  {q:`After automatic data capture replaced paper logs, measured OEE fell from 78% to 64% with no physical change. What is the most likely explanation?`, o:[`The sensors are faulty`,`The paper logs missed short stops and speed losses; 64% is closer to reality`,`Operators started working slower`,`OEE formulas differ between systems`], a:1, why:`Manual logs rarely capture microstops and slow running. Automatic capture reveals them.`},
  {q:`A vision system rejects 1.5% of good packs while the true defect rate is 0.1%, and escapes are near zero. What is the best next step?`, o:[`Lower the threshold further`,`Review the threshold or model against labelled images to cut false rejects while watching escapes`,`Switch the camera off`,`Add a second identical camera`], a:1, why:`The inspection is over-sensitive. Re-tuning or retraining with labelled data can cut false rejects without letting defects through.`},

const GLOSSARY = [
  [`Accumulation buffer`,`Conveyor space between machines that holds product, so a short stop at one machine does not immediately stop its neighbours.`],
  [`Aggregation`,`Recording parent-child links between serialized units and the cases and pallets that contain them.`],
  [`AGV`,`Automated guided vehicle: a mobile robot that follows fixed paths marked by tape, magnets or wires.`],
  [`AMR`,`Autonomous mobile robot: navigates with onboard sensors and maps, planning its own route.`],
  [`Asset Administration Shell (AAS)`,`A standardized digital representation of an asset made of submodels (IEC 63278), maintained with templates from the IDTA.`],
  [`Availability`,`OEE factor: run time divided by planned production time.`],
  [`Batch size one`,`Producing individualized products economically, one at a time, enabled by flexible automation and data.`],
  [`Changeover`,`Switching a line from one product or format to another. A setup loss in OEE.`],
  [`Checkweigher`,`A machine that weighs every pack in motion and rejects those outside limits.`],
  [`Cobot`,`Collaborative robot designed to work near people, subject to a risk assessment of the application.`],
  [`Companion specification`,`A standard OPC UA information model for a type of equipment, such as PackML or machine tools.`],
  [`Condition-based maintenance`,`Maintenance triggered when a measured condition crosses a limit.`],
  [`Constraint`,`The machine or resource that limits a line's output; on most packaging lines, the filler.`],
  [`Control limits`,`Lines on a control chart at the process mean plus or minus 3 sigma, calculated from process data. Not the same as specification limits.`],
  [`Cyber-physical system (CPS)`,`A physical system with embedded computing and networking that senses, computes, acts and communicates.`],
  [`Delta robot`,`A fast parallel-arm robot used for light pick-and-place, invented by Reymond Clavel at EPFL.`],
  [`Digital model`,`A digital representation with only manual data exchange with the physical object.`],
  [`Digital shadow`,`A digital representation fed automatically by the physical object, without automatic flow back.`],
  [`Digital twin`,`A digital representation with automatic data flow in both directions.`],
  [`DIN 8743`,`German standard defining time-based efficiency terms for packaging machines and lines.`],
  [`DSCSA`,`US Drug Supply Chain Security Act (2013), requiring package-level serialization and electronic tracing of prescription drugs.`],
  [`Edge computing`,`Processing data on the plant network close to the machines, rather than in a central cloud.`],
  [`EPCIS`,`GS1 standard for sharing event data about objects: what, when, where, why, and in version 2.0, how.`],
  [`ERP`,`Enterprise resource planning: business systems for orders, materials, finance and logistics (ISA-95 Level 4).`],
  [`EtherCAT`,`A real-time industrial Ethernet protocol used for fast, synchronized motion control.`],
  [`EU FMD`,`EU Falsified Medicines Directive: unique identifiers and anti-tampering devices on prescription medicines since 2019.`],
  [`FAT / SAT`,`Factory acceptance test (at the builder) and site acceptance test (at the plant).`],
  [`GS1 Digital Link`,`A GS1 standard that expresses identifiers and attributes as a web URI, often carried in a QR code.`],
  [`GTIN`,`Global Trade Item Number: identifies a product type at any packaging level.`],
  [`Hardware-in-the-loop (HIL)`,`Testing a real controller against a simulated machine.`],
  [`Held (PackML)`,`Wait state for an internal condition that stops the machine and usually needs an operator.`],
  [`IEC 62443`,`Standard series for industrial automation and control system security: zones, conduits, security levels.`],
  [`IO-Link`,`Point-to-point digital interface for sensors and actuators (IEC 61131-9) carrying data, parameters and diagnostics.`],
  [`ISA-95`,`Standard (IEC 62264) defining levels and information exchange between business and manufacturing systems.`],
  [`ISA-101`,`Standard for high-performance HMI design, reserving strong colour for abnormal conditions.`],
  [`MES`,`Manufacturing execution system: schedules, tracks and records production (ISA-95 Level 3).`],
  [`MQTT`,`Lightweight publish/subscribe messaging protocol using a broker and topics.`],
  [`OEE`,`Overall Equipment Effectiveness: Availability x Performance x Quality.`],
  [`OPC UA`,`Platform-independent industrial communication standard (IEC 62541) with information models and built-in security.`],
  [`P-F interval`,`Time between when a potential failure becomes detectable (P) and functional failure (F).`],
  [`PackML`,`Packaging Machine Language (ISA-TR88.00.02): a standard state model, unit modes and data tags for machines.`],
  [`PackTags`,`Standard PackML data tags grouped into Command, Status and Admin.`],
  [`Performance`,`OEE factor: ideal cycle time times total count, divided by run time.`],
  [`PLC`,`Programmable logic controller: an industrial computer that controls machines.`],
  [`PPWR`,`EU Packaging and Packaging Waste Regulation (Regulation (EU) 2025/40) on recyclability, recycled content and minimization.`],
  [`Predictive maintenance`,`Maintenance based on forecasts of remaining useful life from condition data.`],
  [`Purdue model`,`A layered reference model for industrial networks, with a DMZ between plant and business networks.`],
  [`Quality`,`OEE factor: good count divided by total count.`],
  [`RAMI 4.0`,`Reference Architectural Model Industrie 4.0 (DIN SPEC 91345): layers, life cycle and hierarchy axes.`],
  [`SCADA`,`Supervisory control and data acquisition: monitoring and supervisory control of processes (ISA-95 Level 2).`],
  [`Serialization`,`Giving every saleable unit a unique serial number.`],
  [`SMED`,`Single-minute exchange of die: Shigeo Shingo's method for cutting changeover time.`],
  [`Sparkplug B`,`Specification (ISO/IEC 20237) defining MQTT topics, payloads and device state for industrial use.`],
  [`SPC`,`Statistical process control: using control charts to separate common-cause from special-cause variation.`],
  [`SSCC`,`Serial Shipping Container Code: an 18-digit GS1 key for one logistic unit, such as a pallet.`],
  [`Suspended (PackML)`,`Wait state when a healthy machine is starved or blocked by external conditions.`],
  [`TEEP`,`Total effective equipment performance: OEE x utilization of all calendar time.`],
  [`TSN`,`Time-Sensitive Networking: IEEE 802.1 standards adding deterministic timing to Ethernet.`],
  [`Unified namespace (UNS)`,`An architecture pattern where all systems publish to and subscribe from one structured, event-driven hub.`],
  [`V-curve`,`Line design where machine speeds rise with distance from the filler, upstream and downstream.`],
  [`VFFS`,`Vertical form-fill-seal: a machine that forms bags from film, fills and seals them.`],
  [`Virtual commissioning`,`Testing control software against a simulation of the machine before or without the real hardware.`],
  [`Zones and conduits`,`IEC 62443 concept: group assets by security need and control the paths between groups.`]
];

/* ---------- quizzes ---------- */
function quizView(o){
  page.innerHTML =
    '<p class="crumbs">' + o.crumbs + '</p><h1>' + esc(o.title) + '</h1><p class="meta">' + o.meta + '</p>' +
    '<div id="q-result"></div>' +
    '<form id="quiz" class="quiz" novalidate>' + o.qs.map((q, i) =>
      '<fieldset class="q" id="' + o.key + '-q' + i + '"><legend><span>Question ' + (i + 1) + ' of ' + o.qs.length + '</span>' + esc(q.q) + '</legend><div class="opts">' +
      q.o.map((t, j) => '<label class="opt" for="' + o.key + '-' + i + '-' + j + '"><input type="radio" id="' + o.key + '-' + i + '-' + j + '" name="' + o.key + '-' + i + '" value="' + j + '"><span>' + esc(t) + '</span></label>').join('') +
      '</div><p class="why" hidden></p></fieldset>').join('') +
    '<div class="row"><button class="btn primary" type="submit">Submit answers</button><span class="muted small" id="q-hint" aria-live="polite"></span></div></form>';
  const form = $('#quiz');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const ans = o.qs.map((q, i) => { const c = form.querySelector('input[name="' + o.key + '-' + i + '"]:checked'); return c ? +c.value : -1; });
    const miss = ans.filter(a => a < 0).length;
    if (miss) {
      $('#q-hint').textContent = 'Answer all ' + o.qs.length + ' questions first. ' + miss + ' still open.';
      const first = ans.findIndex(a => a < 0);
      const fs = $('#' + o.key + '-q' + first); if (fs) { fs.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'center'}); const inp = fs.querySelector('input'); if (inp) inp.focus({preventScroll:true}); }
      return;
    }
    let right = 0;
    o.qs.forEach((q, i) => {
      const fs = $('#' + o.key + '-q' + i); fs.classList.add('graded');
      const labels = $$('.opt', fs);
      labels[q.a].classList.add('correct');
      if (ans[i] !== q.a) labels[ans[i]].classList.add('wrong'); else right++;
      $$('input', fs).forEach(x => x.disabled = true);
      const w = $('.why', fs); w.hidden = false;
      w.innerHTML = '<b class="' + (ans[i] === q.a ? 'okt' : 'badt') + '">' + (ans[i] === q.a ? 'Correct.' : 'Incorrect.') + '</b> ' + esc(q.why);
    });
    form.querySelector('button[type=submit]').disabled = true;
    $('#q-hint').textContent = '';
    const score = Math.round(right / o.qs.length * 100), pass = right / o.qs.length >= o.pass;
    o.onDone(score, pass);
    const r = $('#q-result');
    r.innerHTML = '<div class="result ' + (pass ? 'pass' : 'fail') + '" tabindex="-1" id="res-box"><h2>' + (pass ? 'Passed' : 'Not yet passed') + ': ' + right + ' of ' + o.qs.length + ' (' + score + '%)</h2><p>' + (pass ? o.passMsg : o.failMsg) + '</p><div class="row">' + (pass ? o.nextHtml : '') + '<button class="btn' + (pass ? '' : ' primary') + '" type="button" id="retry">' + (o.retryLabel || 'Retake') + '</button></div></div>';
    $('#retry').addEventListener('click', () => o.retry());
    renderNav(o.navId);
    const box = $('#res-box'); box.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'start'}); box.focus({preventScroll:true});
  });
}
function viewCheck(no){
  const m = COURSE[no - 1];
  if (!m) return viewHome();

  quizView({

    qs:m.quiz, pass:0.75,
    onDone:(score, pass) => { const p = S.quiz[no]; S.quiz[no] = {best: Math.max(score, p ? p.best : 0), pass: !!((p && p.pass) || pass)}; save(); },

    retry:() => viewCheck(no)
  });

function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function viewExam(){

    qs:qs, pass:0.8,

    passMsg:'You passed the final assessment. Your certificate is ready.',
    failMsg:'Check the explanations below. A retake draws a new set of questions.',

const LABS = {};

/* ---- classify (reused) ---- */
LABS.classify = function(el, d){
  let ans = {};
  function draw(){
    ans = {};
    el.innerHTML = '<p class="lab-prompt">' + esc(d.prompt) + '</p><ol class="cls-list">' + d.items.map((it, i) =>
      '<li class="cls-item" data-i="' + i + '"><p class="cls-text">' + esc(it.t) + '</p><div class="cls-opts" role="group" aria-label="Choose an answer">' +
      d.cats.map((c, ci) => '<button type="button" class="opt-btn" data-c="' + ci + '">' + esc(c) + '</button>').join('') +
      '</div><p class="cls-fb" aria-live="polite"></p></li>').join('') + '</ol>' +
      '<div class="lab-foot"><span class="score" aria-live="polite">0 of ' + d.items.length + ' answered</span><button type="button" class="btn small" data-reset>Reset</button></div>';
  }
  el.addEventListener('click', e => {
    if (e.target.closest('[data-reset]')) { draw(); return; }
    const b = e.target.closest('.opt-btn'); if (!b) return;
    const li = b.closest('.cls-item'), i = +li.dataset.i;
    if (ans[i] !== undefined) return;
    const it = d.items[i], ok = d.cats[+b.dataset.c] === it.a;
    ans[i] = ok;
    li.classList.add(ok ? 'is-ok' : 'is-bad');
    b.classList.add(ok ? 'pick-ok' : 'pick-bad');
    if (!ok) $('.opt-btn[data-c="' + d.cats.indexOf(it.a) + '"]', li).classList.add('pick-ok');
    $$('.opt-btn', li).forEach(x => x.disabled = true);
    $('.cls-fb', li).innerHTML = '<b class="' + (ok ? 'okt' : 'badt') + '">' + (ok ? 'Correct.' : 'Answer: ' + esc(it.a) + '.') + '</b> ' + esc(it.why);
    const n = Object.keys(ans).length, r = Object.values(ans).filter(Boolean).length;
    $('.score', el).textContent = n < d.items.length ? n + ' of ' + d.items.length + ' answered, ' + r + ' correct' : 'Done: ' + r + ' of ' + d.items.length + ' correct';
  });
  draw();
};

/* ---- timeline ---- */
LABS.timeline = function(el){
  const E = [
    {tag:'1.0', yr:'c. 1784', name:'Mechanization', power:'Water and steam power', text:'Mechanical looms and steam engines move work from hands to machines. Factories form around a central power source driving line shafts and belts.', pack:'Goods ship in hand-made barrels, crates and sacks. Packing is manual work at the end of production.'},
    {tag:'2.0', yr:'c. 1870', name:'Electrification and mass production', power:'Electric motors, assembly lines', text:'Electric motors give each machine its own drive. Conveyor lines and division of labour enable mass production; Ford\'s moving assembly line starts in 1913.', pack:'Machine-made folding cartons (Robert Gair, 1879), the crown cork bottle cap (William Painter, 1892) and the automatic bottle-making machine (Michael Owens, 1903) make packaged consumer goods cheap.'},
    {tag:'3.0', yr:'c. 1969', name:'Automation', power:'Electronics, PLCs, IT', text:'The programmable logic controller (Modicon 084, 1969) replaces relay cabinets. Industrial robots and computers take over repetitive control and planning tasks.', pack:'High-speed fillers, form-fill-seal machines and PLC-controlled lines. The first UPC barcode is scanned at a supermarket checkout in 1974.'},
    {tag:'4.0', yr:'2011 onward', name:'Cyber-physical systems', power:'Networks, data, software', text:'Machines, products and IT systems are connected. Data flows from the sensor to the boardroom and across company borders, and software models mirror physical assets.', pack:'Unit-level serialization, connected machines reporting OEE automatically, digital twins of lines, smart labels, and right-sized packaging made on demand.'}
  ];
  el.innerHTML = '<div class="tl-tabs" role="tablist" aria-label="Industrial revolutions">' + E.map((e, i) => '<button type="button" role="tab" class="tl-tab" id="tl-t' + i + '" aria-controls="tl-p" aria-selected="false"><b>' + e.tag + '</b><span>' + e.yr + '</span></button>').join('') + '</div><div class="tl-panel" id="tl-p" role="tabpanel" aria-live="polite"></div>';
  const tabs = $$('.tl-tab', el);
  function show(i){
    tabs.forEach((b, j) => { b.setAttribute('aria-selected', String(j === i)); b.tabIndex = j === i ? 0 : -1; });
    const e = E[i];
    $('#tl-p', el).setAttribute('aria-labelledby', 'tl-t' + i);
    $('#tl-p', el).innerHTML = '<h4>Industry ' + e.tag + ': ' + esc(e.name) + '</h4><p class="pw">' + esc(e.power) + '</p><p>' + esc(e.text) + '</p><p class="tl-pack"><b>Packaging:</b> ' + esc(e.pack) + '</p>';
  }
  el.addEventListener('click', ev => { const b = ev.target.closest('.tl-tab'); if (b) show(tabs.indexOf(b)); });
  el.addEventListener('keydown', ev => {
    const i = tabs.indexOf(document.activeElement); if (i < 0) return;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { const n = (i + (ev.key === 'ArrowRight' ? 1 : 3)) % 4; show(n); tabs[n].focus(); ev.preventDefault(); }
  });
  show(0);
};

  function up(){
    const n = +$('#se-n', el).value, a = +$('#se-a', el).value / 100, line = Math.pow(a, n);
