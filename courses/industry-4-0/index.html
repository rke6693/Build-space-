<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Connected Line: a self-paced micro course on Industry 4.0 for packaging and manufacturing, with interactive labs, station checks and a final assessment.">
<title>The Connected Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: control-room shell. A station rail (nav) on the left, the lesson sheet centred on a steel ground;
   the home view draws the nine modules as stations along a conveyor. */
:root{
  --bg:#E7EBEE;
  --panel:#FFFFFF;
  --panel-2:#F2F4F6;
  --ink:#131B21;
  --ink-2:#45535E;
  --ink-3:#6B7984;
  --line:#C4CDD4;
  --line-2:#DAE0E5;
  --accent:#0A6990;
  --accent-strong:#075272;
  --accent-soft:#DBEDF5;
  --on-accent:#FFFFFF;
  --amber:#C98D00;
  --amber-soft:#FBEFCB;
  --kraft:#B08458;
  --kraft-2:#8E6640;
  --kraft-soft:#F0E4D4;
  --ok:#1E7845;
  --ok-soft:#DBEFE2;
  --warn:#9A6100;
  --warn-soft:#F9EAC7;
  --bad:#B32E27;
  --bad-soft:#F7DCD9;
  --hmi-g:#2E9E4C; --hmi-b:#2C67C9; --hmi-r:#D2382D; --hmi-y:#EFC21B; --hmi-p:#8549C8; --hmi-on:#FFFFFF; --hmi-on-y:#1A1A1A;
  --shadow:0 1px 2px rgba(16,28,38,.06),0 8px 24px rgba(16,28,38,.07);
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --top-h:56px;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1316; --panel:#161D22; --panel-2:#1B2329; --ink:#E0E6EA; --ink-2:#A2AFB8; --ink-3:#7E8C96; --line:#2D3940; --line-2:#232D34;
    --accent:#4CB2DD; --accent-strong:#7DCAEB; --accent-soft:#11303D; --on-accent:#05202B;
    --amber:#EDBB2C; --amber-soft:#382D0C; --kraft:#C8A078; --kraft-2:#DDBB95; --kraft-soft:#2D251B;
    --ok:#5AC287; --ok-soft:#13301F; --warn:#E5AC47; --warn-soft:#33270E; --bad:#EF7266; --bad-soft:#3A1916;
    --hmi-g:#2F8F48; --hmi-b:#3569C2; --hmi-r:#C83A30; --hmi-y:#D9AF16; --hmi-p:#7D4BBA; --hmi-on:#FFFFFF; --hmi-on-y:#161616;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1316; --panel:#161D22; --panel-2:#1B2329; --ink:#E0E6EA; --ink-2:#A2AFB8; --ink-3:#7E8C96; --line:#2D3940; --line-2:#232D34;
  --accent:#4CB2DD; --accent-strong:#7DCAEB; --accent-soft:#11303D; --on-accent:#05202B;
  --amber:#EDBB2C; --amber-soft:#382D0C; --kraft:#C8A078; --kraft-2:#DDBB95; --kraft-soft:#2D251B;
  --ok:#5AC287; --ok-soft:#13301F; --warn:#E5AC47; --warn-soft:#33270E; --bad:#EF7266; --bad-soft:#3A1916;
  --hmi-g:#2F8F48; --hmi-b:#3569C2; --hmi-r:#C83A30; --hmi-y:#D9AF16; --hmi-p:#7D4BBA; --hmi-on:#FFFFFF; --hmi-on-y:#161616;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.62}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0}
code,pre,.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--panel);padding:8px 12px;border:1px solid var(--line)}
.skip:focus{left:8px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--top-h);display:flex;align-items:center;gap:14px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{flex:1 1 auto;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand:hover{color:var(--ink)}
.brand svg{flex:none}
.brand-text{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-progress{flex:none;margin-left:auto;display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.meter{display:inline-block;width:120px;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s ease}
.menu-btn{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:6px 10px;font-size:14px;cursor:pointer}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:calc(100vh - var(--top-h))}
.nav{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top-h));overflow-y:auto;background:var(--panel-2);border-right:1px solid var(--line);padding:14px 10px 48px}
.nav a{text-decoration:none;color:var(--ink)}
.nav-top{display:grid;gap:2px;margin-bottom:12px}
.nav-link{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:4px;font-size:15px}
.nav-link:hover{background:var(--line-2)}
.nav-link[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.nav-label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 6px}
.nav details{border-radius:4px}
.nav summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 10px;border-radius:4px;cursor:pointer}
.nav summary::-webkit-details-marker{display:none}
.nav summary:hover{background:var(--line-2)}
.nav .stn-no-s{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.nav .stn-name{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.nav details[open] .stn-name{color:var(--accent-strong)}
.nav ol{list-style:none;margin:2px 0 8px;padding:0 0 0 22px;border-left:2px solid var(--line);margin-left:20px}
.nav ol a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:4px;font-size:14px;line-height:1.35;color:var(--ink-2)}
.nav ol a:hover{background:var(--line-2);color:var(--ink)}
.nav ol a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.tick{flex:none;width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);display:inline-grid;place-items:center;transform:translateY(2px)}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick.on::after{content:"";width:6px;height:3px;border-left:2px solid var(--panel);border-bottom:2px solid var(--panel);transform:translateY(-1px) rotate(-45deg)}
.sdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.sdot.exec{background:var(--accent)}
.sdot.done{background:var(--ok)}
.nav-link .sdot{margin-left:auto}
.scrim{display:none}

main{min-width:0;padding-block:28px 96px;padding-inline:24px}
main:focus{outline:none}
.page{max-width:800px;margin:0 auto}

@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .nav{position:fixed;z-index:40;top:calc(var(--top-h) + env(safe-area-inset-top,0px));left:0;bottom:0;height:auto;width:min(320px,88vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .nav.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:35;background:rgba(10,16,20,.45)}
  .top-progress .meter{width:72px}
  main{padding-inline:16px}
}
@media (max-width:560px){
  .brand small{display:none}
  .brand b{font-size:18px}
  .top-progress span:first-child{display:none}
  .topbar{gap:10px}
}
@media (max-width:380px){.brand svg{display:none}}

/* ---------- type & prose ---------- */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.eyebrow b{color:var(--accent-strong);font-weight:600}
.page h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,46px);letter-spacing:.005em;margin-bottom:10px}
.page h2{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);margin:0 0 26px}
.prose{max-width:68ch}
.prose > *{margin:0 0 16px}
.prose h3{font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:.01em;margin:32px 0 10px}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin:0 0 6px}
.prose li::marker{color:var(--ink-3)}
.prose code{font-size:.86em;background:var(--panel-2);border:1px solid var(--line-2);border-radius:3px;padding:1px 5px;overflow-wrap:anywhere}
pre.code{font-size:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--kraft);border-radius:4px;padding:10px 14px;overflow-x:auto;white-space:pre;color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line-2)}
tr:last-child td{border-bottom:0}
th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-2);background:var(--panel-2)}
td:first-child{font-weight:700}
.prose .tbl-wrap table{min-width:540px}
.formula{font-family:var(--f-mono);font-size:15.5px;font-weight:500;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 16px;color:var(--ink);overflow-x:auto}
ul.calc{list-style:none;padding:12px 16px!important;background:var(--panel);border:1px solid var(--line);border-radius:4px;font-variant-numeric:tabular-nums}
.note{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 16px 14px 18px;font-size:15.5px}
.note::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.note b:first-child{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;color:var(--accent-strong)}
.note.line::before{background:var(--kraft)} .note.line b:first-child{color:var(--kraft-2)}
.note.watch::before{background:var(--amber)} .note.watch b:first-child{color:var(--warn)}
.muted{color:var(--ink-2)}
.small{font-size:14px}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.btn.small{min-height:32px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.exec{background:var(--accent-soft);color:var(--accent-strong)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.held{background:var(--warn-soft);color:var(--warn)}

/* ---------- home ---------- */
.hero{display:grid;gap:18px;margin-bottom:34px}
.hero .lede{font-size:19px;color:var(--ink-2);max-width:60ch;margin:0}
.mini-line{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 12px 10px;overflow:hidden}
.mini-line svg{display:block;width:100%;height:auto}
.mini-line .m-body{fill:var(--panel-2);stroke:var(--ink-3);stroke-width:1.2}
.mini-line .m-filler{fill:var(--accent-soft);stroke:var(--accent)}
.mini-line .m-label{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;fill:var(--ink-2);text-anchor:middle}
.mini-line .belt{fill:var(--line-2);stroke:var(--ink-3);stroke-width:1}
.mini-line .roll{fill:var(--panel);stroke:var(--ink-3);stroke-width:1}
.mini-line .pk{fill:var(--kraft);stroke:var(--kraft-2);stroke-width:.8}
.mini-line .pk-move{animation:pk 9s linear infinite}
@keyframes pk{from{transform:translateX(0)}to{transform:translateX(640px)}}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.stats b{color:var(--ink);font-weight:600}
.progress-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pcell{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pcell .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.pcell .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.pcell .v small{font-size:17px;color:var(--ink-3);font-weight:600}
@media (max-width:560px){.progress-strip{grid-template-columns:1fr}}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin:0 0 16px}
.sec-head p{margin:0;color:var(--ink-2);font-size:15px}

.stations{list-style:none;margin:0 0 36px;padding:0;position:relative;display:grid;gap:12px}
.stations::before{content:"";position:absolute;left:21px;top:14px;bottom:14px;width:18px;border-inline:2px solid var(--ink-3);background:repeating-linear-gradient(180deg,var(--line) 0 2px,var(--panel-2) 2px 11px);animation:belt 1.6s linear infinite}
@keyframes belt{from{background-position:0 0}to{background-position:0 11px}}
.stn{display:grid;grid-template-columns:60px minmax(0,1fr);align-items:start;position:relative}
.stn-node{justify-self:center;margin-top:16px;width:34px;height:34px;display:grid;place-items:center;border-radius:4px;background:var(--panel);border:2px solid var(--line);z-index:1}
.stn.is-active .stn-node{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stn.is-done .stn-node{border-color:var(--kraft-2);background:var(--kraft-soft)}
.stn-node svg{width:22px;height:22px}
.stn-node .bx{fill:var(--kraft);stroke:var(--kraft-2)}
.stn-node .tp{stroke:var(--kraft-2)}
.stn-node .idle{fill:none;stroke:var(--line)}
.stn-node .act{fill:var(--accent)}
.plate{display:grid;gap:4px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
a.plate:hover{border-color:var(--accent);box-shadow:var(--shadow);color:var(--ink)}
.plate-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stn-no{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--ink-3)}
.plate-title{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.1;letter-spacing:.01em}
.plate-blurb{color:var(--ink-2);font-size:15px;line-height:1.45}
.plate-meta{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.plate-bar{height:4px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-top:6px}
.plate-bar i{display:block;height:100%;background:var(--ok)}
.stn.end .plate{background:var(--panel-2);border-style:dashed}
.steps{list-style:none;padding:0;margin:0 0 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;counter-reset:s}
.steps li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14.5px;line-height:1.4;color:var(--ink-2)}
.steps li::before{content:counter(s);display:block;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--accent);line-height:1}
.steps b{display:block;color:var(--ink);font-size:15px;margin:4px 0 2px}

/* ---------- lesson ---------- */
.crumbs{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.crumbs a{color:var(--ink-3)}
.lab{margin:26px 0 28px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;max-width:100%}
.lab-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.lab-tag{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.12em;padding:2px 7px;border-radius:3px;background:var(--ink);color:var(--panel)}
.lab-head h3{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.lab-body{padding:16px;min-width:0}
.lab-body > * + *{margin-top:14px}
.lab-prompt{margin:0;font-weight:700}
.lab-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding-top:12px}
.score{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.keys{margin:30px 0;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.keys h2{font-size:22px!important;margin-bottom:8px}
.keys ul{margin:0;padding-left:20px}
.keys li{margin:4px 0}
.lesson-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--line)}
.done-flag{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ok)}

/* ---------- generic lab controls ---------- */
.field{display:grid;gap:4px;min-width:0}
.field label,.flabel{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input[type=number],.field input[type=text],.field select,.txt{width:100%;min-height:38px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);font-family:var(--f-mono);font-size:15px}
.field input:focus,.txt:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.rng{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.rng output{font-family:var(--f-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.rng label{grid-column:1/-1}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ro{border:1px solid var(--line-2);border-radius:4px;padding:8px 12px;background:var(--panel-2)}
.ro .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ro .v{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.ro.hl{border-color:var(--accent);background:var(--accent-soft)}
.ro.hl .v{color:var(--accent-strong)}
.msg{border-radius:4px;padding:10px 12px;font-size:15px;background:var(--panel-2);border:1px solid var(--line-2)}
.msg.ok{background:var(--ok-soft);border-color:transparent;color:var(--ink)}
.msg.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.msg.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:6px 12px;font-size:14px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
svg text{font-family:var(--f-mono)}
.chart{display:block;width:100%;height:auto;max-width:100%}
.ax{stroke:var(--line);stroke-width:1}
.axt{fill:var(--ink-3);font-size:11px}
.gridl{stroke:var(--line-2);stroke-width:1}

/* classify */
.cls-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cls-item{border:1px solid var(--line-2);border-radius:4px;padding:12px;background:var(--panel)}
.cls-item.is-ok{border-color:var(--ok)}
.cls-item.is-bad{border-color:var(--bad)}
.cls-text{margin:0 0 10px}
.cls-opts{display:flex;flex-wrap:wrap;gap:6px}
.opt-btn{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:5px 11px;font-size:14px;cursor:pointer}
.opt-btn:hover:not(:disabled){border-color:var(--accent)}
.opt-btn:disabled{cursor:default;opacity:.55}
.opt-btn.pick-ok{background:var(--ok);border-color:var(--ok);color:var(--panel);opacity:1}
.opt-btn.pick-bad{background:var(--bad);border-color:var(--bad);color:var(--panel);opacity:1}
.cls-fb{margin:10px 0 0;font-size:14.5px;color:var(--ink-2)}
.cls-fb:empty{display:none}

/* timeline */
.tl-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tl-tab{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:8px 10px;cursor:pointer}
.tl-tab b{font-family:var(--f-display);font-size:26px;line-height:1}
.tl-tab span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.tl-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tl-tab[aria-selected="true"] span{color:var(--on-accent)}
.tl-panel h4{font-family:var(--f-display);font-size:24px;margin:0 0 2px}
.tl-panel .pw{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
.tl-panel p{margin:0 0 10px}
.tl-pack{border-left:3px solid var(--kraft);padding-left:12px;color:var(--ink-2)}
@media (max-width:520px){.tl-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* pyramid */
.pyr{display:grid;gap:4px;justify-items:center}
.pyr button{border:1px solid var(--line);background:var(--panel-2);border-radius:3px;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;min-width:0}
.pyr button b{font-family:var(--f-mono);font-size:12px}
.pyr button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pyr button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pyr-detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pyr-detail .ro .v{font-family:var(--f-body);font-size:15px;font-weight:400;line-height:1.45}

/* p2p */
.p2p-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.p2p-wrap figure{margin:0;border:1px solid var(--line-2);border-radius:4px;padding:8px;background:var(--panel-2)}
.p2p-wrap figcaption{font-family:var(--f-mono);font-size:12.5px;text-align:center;color:var(--ink-2)}
.p2p-wrap figcaption b{font-size:20px;color:var(--ink);display:block;font-family:var(--f-display)}
.lnk{stroke:var(--ink-3);stroke-width:1;opacity:.55}
.lnk-hub{stroke:var(--accent);stroke-width:1.6}
.nd{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.5}
.hub{fill:var(--accent);stroke:var(--accent-strong)}
@media (max-width:480px){.p2p-wrap{grid-template-columns:1fr}}

/* packml */
.pm-rows{display:grid;gap:10px}
.pm-row{display:grid;gap:4px}
.pm-row .flabel{font-size:10.5px}
.pm-states{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pm-st{font-family:var(--f-mono);font-size:12px;padding:6px 8px;border-radius:3px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.pm-st.acting{border-style:dashed}
.pm-st.exec{border-color:var(--ok)}
.pm-st.cur{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:600}
.pm-st.cur.exec{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.pm-st.cur.held{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.pm-st.cur.bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.pm-arrow{color:var(--ink-3);font-size:12px}
.pm-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2)}
.pm-legend span{display:inline-flex;align-items:center;gap:6px}
.pm-legend i{display:inline-block;width:18px;height:12px;border:1.5px solid var(--line);border-radius:2px}
.pm-legend i.a{border-style:dashed}
.pm-legend i.e{border-color:var(--ok)}
.pm-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){.pm-cols{grid-template-columns:1fr}}
.pm-cmds{display:flex;flex-wrap:wrap;gap:6px}
.pm-tags{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;line-height:1.7;overflow-x:auto;white-space:nowrap}
.pm-tags b{color:var(--accent-strong);font-weight:600}
.pm-log{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);list-style:none;margin:0;padding:0;max-height:132px;overflow:auto}
.pm-log li{padding:2px 0;border-bottom:1px dotted var(--line-2)}

/* oee */
.wf{display:flex;height:34px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.wf div{min-width:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--panel);overflow:hidden;white-space:nowrap}
.wf .fp{background:var(--ok)} .wf .ql{background:var(--bad)} .wf .pl{background:var(--amber);color:var(--ink)} .wf .al{background:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:12px;background:var(--line-2);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.bar.total .t i{background:var(--ink)}
.bar output{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* linesim */
.ls-line{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.ls-m{flex:1 1 0;min-width:96px;border:1.5px solid var(--line);border-radius:4px;padding:8px;background:var(--panel-2);display:grid;gap:4px;align-content:start}
.ls-m.constraint{border-color:var(--accent)}
.ls-m .nm{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.05;text-transform:uppercase}
.ls-m .sp{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.ls-light{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.ls-light i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.st-run i{background:var(--ok)} .st-starved i{background:var(--amber)} .st-blocked i{background:var(--accent)} .st-down i{background:var(--bad)}
.ls-b{flex:0 0 46px;display:grid;align-content:center;justify-items:center;gap:3px;padding:0 4px}
.ls-b .tank{width:14px;height:56px;border:1.5px solid var(--ink-3);border-radius:2px;position:relative;overflow:hidden;background:var(--panel)}
.ls-b .tank i{position:absolute;left:0;right:0;bottom:0;height:var(--f);background:var(--kraft)}
.ls-b span{font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
@media (max-width:640px){
  .ls-line{flex-direction:column;overflow:visible}
  .ls-m{min-width:0;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .ls-m .sp{grid-row:2}
  .ls-m .ls-light{grid-column:2;grid-row:1/3}
  .ls-b{flex:none;grid-template-columns:auto minmax(0,1fr) auto;display:grid;align-items:center;justify-items:stretch;padding:6px 10px}
  .ls-b::before{content:"buffer";font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
  .ls-b .tank{width:auto;height:10px}
  .ls-b .tank i{top:0;right:auto;height:auto;width:var(--f)}
}
.ls-ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
.ls-res .bar{grid-template-columns:96px minmax(0,1fr) 52px}
.stack{display:flex;height:14px;border-radius:2px;overflow:hidden;background:var(--line-2)}
.stack i{display:block;height:100%}
.stack .s-run{background:var(--ok)} .stack .s-starved{background:var(--amber)} .stack .s-blocked{background:var(--accent)} .stack .s-down{background:var(--bad)}
.runs{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-family:var(--f-mono);font-size:13px}
.runs li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line-2);padding:3px 0}

/* spc */
.spc-pt{fill:var(--panel);stroke:var(--accent);stroke-width:1.6}
.spc-pt.viol{fill:var(--bad);stroke:var(--bad)}
.spc-line{fill:none;stroke:var(--accent);stroke-width:1.4}
.spc-cl{stroke:var(--ink);stroke-width:1.2}
.spc-lim{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:5 4}
.spc-z{stroke:var(--ink-3);stroke-width:.8;stroke-dasharray:2 4}
.spc-band{fill:var(--bad-soft);opacity:.55}
.zl{fill:var(--ink-3);font-size:10.5px}
.zl.lim{fill:var(--bad)}

/* reject */
.rj-strip{border:1px solid var(--line-2);border-radius:4px;padding:6px 8px 2px;background:var(--panel-2)}
.rj-strip h4{margin:0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.cv{fill:var(--line-2);stroke:var(--ink-3)}
.pkg{fill:var(--kraft-soft);stroke:var(--kraft-2);stroke-width:1.2}
.pkg.bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.pkg.hit{stroke:var(--ink);stroke-width:2.4}
.pusher{fill:var(--ink)}
.pusher-zone{fill:var(--accent);opacity:.12}
.rj-x{stroke:var(--bad);stroke-width:2}
.rj-lab{fill:var(--ink-2);font-size:11px}

/* pf */
.pf-curve{fill:none;stroke:var(--ink);stroke-width:2}
.pf-dot{stroke:var(--panel);stroke-width:2}
.pf-dot.sel{stroke:var(--ink);stroke-width:2}
.pf-insp{stroke:var(--accent);stroke-width:1.4}
.pf-det{fill:var(--ok)}
.pf-miss{fill:var(--bad)}
.pf-win{fill:var(--ok-soft);opacity:.7}
.tech-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.tech-list button{width:100%;display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:6px 8px;font-size:13.5px;cursor:pointer}
.tech-list button[aria-pressed="true"]{border-color:var(--ink);background:var(--panel);font-weight:700}
.tech-list i{width:10px;height:10px;border-radius:50%;flex:none}
.tech-list small{margin-left:auto;font-family:var(--f-mono);color:var(--ink-3);font-weight:400}

/* vision */
.vz-good{fill:var(--ok);opacity:.18;stroke:var(--ok);stroke-width:1.5}
.vz-bad{fill:var(--bad);opacity:.16;stroke:var(--bad);stroke-width:1.5}
.vz-fr{fill:var(--amber);opacity:.55}
.vz-es{fill:var(--bad);opacity:.55}
.vz-th{stroke:var(--ink);stroke-width:2}
.vz-lab{font-size:11px;fill:var(--ink-2)}

/* gs1 */
.gs1-tbl td:first-child{font-family:var(--f-mono)}
.okt{color:var(--ok);font-weight:700}
.badt{color:var(--bad);font-weight:700}
.dl{font-family:var(--f-mono);font-size:13.5px;overflow-wrap:anywhere;background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:8px 10px}
.wtbl{font-family:var(--f-mono);font-size:12.5px}
.wtbl td,.wtbl th{padding:4px 7px;text-align:center}
.wtbl td:first-child{font-weight:600}

/* epcis */
.ep-chips{display:flex;flex-wrap:wrap;gap:6px}
.ep-chips button{border:1px solid var(--line);border-radius:20px;padding:4px 12px;background:var(--panel-2);cursor:pointer;font-size:14px}
.ep-chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ep-code{font-family:var(--f-mono);font-size:12.5px;line-height:1.6;background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:10px 0;overflow-x:auto;margin:0}
.ep-code span{display:block;padding:0 12px;white-space:pre;transition:background .15s}
.ep-code span.on{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber)}

/* hmi */
.hmi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:560px){.hmi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hmi-t{border:0;border-radius:3px;padding:8px;text-align:left;cursor:pointer;display:grid;gap:2px;min-height:64px;font-size:12px;line-height:1.25}
.hmi-t .n{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.hmi-t .val{font-family:var(--f-mono);font-size:16px;font-weight:600}
.hmi-a .hmi-t{color:var(--hmi-on)}
.hmi-a .c0{background:var(--hmi-g)} .hmi-a .c1{background:var(--hmi-b)} .hmi-a .c2{background:var(--hmi-r)} .hmi-a .c3{background:var(--hmi-y);color:var(--hmi-on-y)} .hmi-a .c4{background:var(--hmi-p)}
.hmi-b .hmi-t{background:var(--panel-2);color:var(--ink);border:1px solid var(--line-2)}
.hmi-b .hmi-t .n{color:var(--ink-3)}
.hmi-b .rbar{height:5px;background:var(--line-2);position:relative;border-radius:2px;margin-top:3px}
.hmi-b .rbar i{position:absolute;top:-2px;width:3px;height:9px;background:var(--ink-2);border-radius:1px}
.hmi-b .rbar .nr{position:absolute;top:0;bottom:0;background:var(--line)}
.hmi-b .hmi-t.abn{border:2px solid var(--amber);background:var(--amber-soft)}
.hmi-b .hmi-t.abn .rbar i{background:var(--amber)}
.hmi-b .abn-ico{display:inline-block;width:10px;height:10px;background:var(--amber);transform:rotate(45deg);margin-right:6px}
.hmi-t.found{outline:3px solid var(--ink);outline-offset:1px}
.hmi-t.wrong{opacity:.4}
.hmi-t:disabled{cursor:default}

/* maturity */
.mat-q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.mat-q p{margin:0;font-size:15px}
.mat-q p b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:block}
@media (max-width:560px){.mat-q{grid-template-columns:1fr}}
.mat-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;align-items:end}
.mat-steps div{border-radius:3px 3px 0 0;background:var(--line-2);display:grid;align-content:end;padding:6px 4px;text-align:center;font-family:var(--f-mono);font-size:10px;line-height:1.2;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.mat-steps div.on{background:var(--accent);color:var(--on-accent)}
.mat-steps div.part{background:var(--accent-soft);color:var(--accent-strong)}

/* capstone */
.loss-tbl td:last-child,.loss-tbl th:last-child{text-align:right;font-family:var(--f-mono)}
.ini{display:grid;gap:8px}
.ini label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--panel-2);cursor:pointer}
.ini label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.ini input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.ini .ti{font-weight:700}
.ini .de{grid-column:2/3;font-size:14px;color:var(--ink-2)}
.ini .co{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.budget{display:grid;gap:4px}
.budget .t{height:10px;background:var(--line-2);border-radius:2px;overflow:hidden}
.budget .t i{display:block;height:100%;background:var(--accent)}
.budget.over .t i{background:var(--bad)}
.fb-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fb-list li{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:15px}
.fb-list li.good{border-color:var(--ok)}
.fb-list li.meh{border-color:var(--amber)}
.fb-list li.poor{border-color:var(--bad)}

/* quiz */
.quiz{display:grid;gap:16px;margin-bottom:22px}
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:16px;margin:0;min-width:0}
.q legend{float:left;width:100%;padding:0;margin-bottom:12px;font-weight:700;font-size:16.5px}
.q legend span{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.opts{clear:both;display:grid;gap:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line-2);border-radius:4px;padding:9px 12px;cursor:pointer;background:var(--panel-2)}
.opt:hover{border-color:var(--ink-3)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.q.graded .opt{cursor:default}
.opt.correct{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.opt.wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.why{margin:10px 0 0;font-size:14.5px;color:var(--ink-2)}
.result{border-radius:var(--r);padding:16px 18px;margin-bottom:20px;border:1px solid var(--line);background:var(--panel)}
.result.pass{border-color:var(--ok);background:var(--ok-soft)}
.result.fail{border-color:var(--amber);background:var(--warn-soft)}
.result h2{font-size:26px!important;margin-bottom:4px}

/* glossary */
.gl-search{max-width:420px;margin-bottom:18px}
.gl{display:grid;gap:0;margin:0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.gl div{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr);gap:4px 18px;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.gl div:last-child{border-bottom:0}
.gl dt{font-weight:700}
.gl dd{margin:0;color:var(--ink-2)}
@media (max-width:560px){.gl div{grid-template-columns:1fr}}

/* labs index */
.lab-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lab-grid a{display:grid;gap:4px;height:100%;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.lab-grid a:hover{border-color:var(--accent);color:var(--ink)}
.lab-grid .lt{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.lab-grid .ls{font-size:14px;color:var(--ink-2)}
.lab-grid .lk{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}

/* certificate */
.cert{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:34px 28px;text-align:center;box-shadow:var(--shadow);overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:2px solid var(--kraft);border-radius:4px;pointer-events:none}
.cert .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.cert .nm{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,6vw,48px);line-height:1.05;margin:12px 0 6px;overflow-wrap:anywhere}
.cert .ct{font-family:var(--f-display);font-weight:600;font-size:24px;margin:4px 0 14px}
.cert .det{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.cert .stns{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px 0 0}

/* tutor */
.tutor{display:none;margin:30px 0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:16px 18px}
.has-tutor .tutor{display:block}
.tutor h2{font-size:22px!important;margin-bottom:4px}
.tutor textarea{width:100%;min-height:68px;resize:vertical;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.tutor textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.tutor-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tutor-chips button{border:1px dashed var(--line);background:transparent;border-radius:20px;padding:3px 11px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.tutor-chips button:hover{border-color:var(--accent);color:var(--ink)}
.tutor-out{white-space:pre-wrap;margin-top:12px;font-size:15.5px;line-height:1.6;border-left:3px solid var(--accent);padding-left:14px}
.tutor-out:empty{display:none}
.tutor-note{font-size:13px;color:var(--ink-3);margin-top:8px}

@media (prefers-reduced-motion:reduce){

<script>
/* ================= COURSE CONTENT ================= */
const COURSE = [
/* ---------- STATION 1 ---------- */
{ code:`Foundations`, title:`What Industry 4.0 really is`,
  blurb:`Four industrial revolutions, cyber-physical systems, and why packaging lines are changing now.`,
  lessons:[
  { title:`Four industrial revolutions`, min:6,
    lab:{type:`timeline`, title:`Revolution timeline`},
    body:`
<p>"Industry 4.0" is shorthand for the fourth major shift in how goods are made. Each earlier shift came from a new way to power or control production. The sequence matters because each revolution rests on the one before it. You cannot connect a machine that was never automated, and you cannot automate a process nobody has measured.</p>
<!--LAB-->
<h3>What changed each time</h3>
<p>The first three revolutions changed the <em>physical</em> means of production: steam replaced muscle, electric motors made moving assembly lines possible, and electronics let machines follow programs. The fourth adds a layer of information on top of those machines. Machines, products, people and business systems exchange data over networks, and that data steers decisions in near real time.</p>
<p>The term <em>Industrie 4.0</em> came from a German government-backed initiative and was presented to the public at the Hannover Messe trade fair in 2011. A working group led by Henning Kagermann, Wolfgang Wahlster and Johannes Helbig published implementation recommendations in 2013. In 2016 the World Economic Forum popularised the broader phrase "Fourth Industrial Revolution".</p>
<aside class="note line"><b>On the line</b>A modern bottling line contains all four eras at once. The conveyors and gearboxes are 2.0 technology, the PLC and servo drives are 3.0, and the moment the filler streams its counters to a plant-wide data platform, you are doing 4.0.</aside>
<h3>Dates are conventions</h3>
<p>Historians argue about the boundaries, and change spread at different speeds in different industries and countries. Treat the dates as markers for the technology that defined each era, not as clean cut-overs.</p>`,
    keys:[`Industry 4.0 builds on automation (3.0); it does not replace it.`,`The defining addition is networked data connecting machines, products, people and business systems.`,`The term was introduced at Hannover Messe in 2011; the Industrie 4.0 working group published its recommendations in 2013.`] },
  { title:`Cyber-physical production`, min:7,
    lab:{type:`classify`, title:`Integration sorter`, data:{
      prompt:`Which kind of integration does each example show?`,
      cats:[`Vertical`,`Horizontal`,`End-to-end`],
      items:[
        {t:`The ERP sends a production order to the MES, which downloads the recipe to the filler PLC.`, a:`Vertical`, why:`Data moves between levels inside one plant: ERP, then MES, then PLC.`},
        {t:`A brand owner and its co-packer share live OEE and fill-weight data for a product made under contract.`, a:`Horizontal`, why:`Data crosses a company border along the value network.`},
        {t:`The 3D design of a new bottle is reused to generate the change-part drawings and the vision inspection model.`, a:`End-to-end`, why:`One digital thread carries the design from engineering into production.`},
        {t:`Reject counts from the checkweigher appear automatically on the shift report in the MES.`, a:`Vertical`, why:`Shop-floor data flows up to the operations level of the same plant.`},
        {t:`The film supplier receives seal-failure data from its customer's lines, linked to its own film lot numbers.`, a:`Horizontal`, why:`Quality data is shared with a supplier, across company boundaries.`},
        {t:`Field-service data on worn format parts flows back to the machine builder's engineers, who redesign the part.`, a:`End-to-end`, why:`Data from the use phase feeds back into design, connecting the life cycle.`}
      ]}},
    body:`
<p>At the centre of Industry 4.0 sits the <b>cyber-physical system</b> (CPS): a physical object with embedded computing and a network connection. It senses its own state, computes, acts on the physical world and communicates with other systems. A servo-driven carton erector that reports its torque, cycle count and fault history is a small CPS. A packaging line whose machines coordinate their speeds through shared data is a larger one.</p>
<h3>Three kinds of integration</h3>
<p>The 2013 Industrie 4.0 recommendations describe three integrations a connected factory needs:</p>
<ul>
<li><b>Vertical integration</b> links the levels inside one plant: sensors and PLCs, supervisory systems, MES and ERP. Orders flow down; counts, states and quality results flow up.</li>
<li><b>Horizontal integration</b> links companies along the value network: material and packaging suppliers, co-packers, logistics providers and retailers. Data crosses company borders.</li>
<li><b>End-to-end engineering integration</b> links the life cycle: product and package design, machine engineering, production, service and recycling share one digital thread.</li>
</ul>
<h3>Four design principles</h3>
<p>Hermann, Pentek and Otto (2016) reviewed the research literature and distilled four design principles:</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Principle</th><th>What it means</th><th>Packaging example</th></tr></thead>
<tbody>
<tr><td>Interconnection</td><td>Machines, devices, sensors and people communicate over networks.</td><td>Every machine on the line publishes its state and counters.</td></tr>
<tr><td>Information transparency</td><td>Data from the physical world builds a virtual picture people can understand.</td><td>A live line view shows which machine starved the filler, and why.</td></tr>
<tr><td>Technical assistance</td><td>Systems help people decide, and take over unsafe or exhausting tasks.</td><td>A cobot palletizes 20 kg cases; a tablet guides the changeover step by step.</td></tr>
<tr><td>Decentralized decisions</td><td>Components make simple decisions themselves and escalate exceptions.</td><td>A labeler slows itself when its accumulation table fills, without waiting for an operator.</td></tr>
</tbody></table></div>
<!--LAB-->
<aside class="note line"><b>On the line</b>A board supplier changes its corrugated recipe. The case erector's servo torque rises on that lot, the MES links the torque trend to the board lot number, and the supplier receives the data automatically. One cyber-physical system is feeding both vertical and horizontal integration.</aside>`,
    keys:[`A cyber-physical system senses, computes, acts and communicates.`,`Vertical integration connects levels inside a plant; horizontal connects companies; end-to-end connects the life cycle.`,`The four design principles: interconnection, information transparency, technical assistance, decentralized decisions.`] },
  { title:`Why packaging lines are changing now`, min:6,
    lab:{type:`series`, title:`Machines in series`},
    body:`
<p>Industry 4.0 technology has existed in pieces for years. Several pressures have made it urgent for packaging and manufacturing at the same time.</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Driver</th><th>What is happening</th><th>What it demands from the line</th></tr></thead>
<tbody>
<tr><td>More variants, smaller batches</td><td>Retailers and consumers want more SKUs, promotional packs, multipacks and regional versions.</td><td>Fast, repeatable changeovers, recipe management, digital printing.</td></tr>
<tr><td>Labour and skills</td><td>Plants struggle to hire and keep operators and maintenance technicians, and experienced staff are retiring.</td><td>Automation of heavy, repetitive work; captured know-how; guided work instructions.</td></tr>
<tr><td>Traceability rules</td><td>Pharmaceutical serialization laws (US DSCSA, EU Falsified Medicines Directive) and food traceability rules require unit- or lot-level records.</td><td>Serialization, aggregation and reliable event data.</td></tr>
<tr><td>Sustainability</td><td>Rules such as the EU Packaging and Packaging Waste Regulation (PPWR) and extended producer responsibility fees push for less material, recyclable designs and recycled content.</td><td>Material data per SKU, lightweighting trials, energy and waste monitoring.</td></tr>
<tr><td>E-commerce</td><td>Parcels need different packaging than shelf-ready retail cases.</td><td>Right-sized, on-demand packaging and a flexible end of line.</td></tr>
<tr><td>Resilience</td><td>Supply disruptions since 2020 exposed how little real-time visibility many plants had.</td><td>Live data on capacity, inventory and constraints.</td></tr>
</tbody></table></div>
<h3>Why packaging lines are a special case</h3>
<p>A packaging line is a chain of machines in series: depalletizer, filler, capper, labeler, case packer, palletizer. Products move at hundreds or thousands of units per minute, and every machine depends on its neighbours. A 20-second stop at one machine can ripple up and down the line. Without buffers between them, the line's availability is roughly the <em>product</em> of each machine's availability, so small losses multiply.</p>
<!--LAB-->
<p>This is why the rest of the course keeps returning to data. You cannot fix microstops that nobody records.</p>`,
    keys:[`Variant growth, labour shortages, traceability laws, sustainability rules, e-commerce and resilience all push the same way.`,`On a line of machines in series, small losses multiply.`,`Accurate, automatic data is the starting point for every improvement that follows.`] }
  ],
  quiz:[
    {q:`Where was the term "Industrie 4.0" first presented to the public?`, o:[`At the Hannover Messe trade fair in 2011`,`At the World Economic Forum in 2016`,`In the ISA-95 standard in 2000`,`At the launch of the Modicon 084 PLC in 1969`], a:0, why:`The term was introduced at Hannover Messe 2011. The WEF later popularised the broader "Fourth Industrial Revolution" in 2016.`},
    {q:`Which invention is commonly used to mark the start of the third industrial revolution?`, o:[`The moving assembly line`,`The programmable logic controller (PLC)`,`The steam engine`,`The MQTT protocol`], a:1, why:`The Modicon 084 PLC (1969) is the usual marker for electronic automation, the core of Industry 3.0.`},
    {q:`A brand owner shares real-time fill-weight data with its co-packer and its film supplier. Which integration is this?`, o:[`Vertical integration`,`End-to-end engineering integration`,`Horizontal integration`,`Decentralized decisions`], a:2, why:`Data crossing company borders along the value network is horizontal integration.`},
    {q:`Why do short stops matter so much on packaging lines?`, o:[`Because regulators require every stop to be reported`,`Because machines run in series at high speed, so one short stop can starve or block the others`,`Because short stops always damage the product`,`Because PLCs cannot restart a machine automatically`], a:1, why:`Machines in series depend on each other; without enough buffering, small losses at one machine multiply across the line.`}
  ]
},
/* ---------- STATION 2 ---------- */
{ code:`Architecture`, title:`How a smart factory is organized`,
  blurb:`ISA-95 levels, the unified namespace, RAMI 4.0, the Asset Administration Shell, and the PackML state model.`,
  lessons:[
  { title:`ISA-95 and the automation pyramid`, min:7,
    lab:{type:`pyramid`, title:`ISA-95 level explorer`},
    body:`
<p>Before connecting anything, you need a map of who does what. The most widely used map is <b>ISA-95</b>, published internationally as <b>IEC 62264</b>. It defines functional levels in a manufacturing enterprise and the information exchanged between business systems and the plant floor.</p>
<!--LAB-->
<h3>Different levels, different clocks</h3>
<p>Each level works on its own time scale. ERP plans in weeks and days. MES manages shifts, hours and minutes. Control systems react in seconds and milliseconds. This is why the ERP cannot simply talk to a PLC: they do not share a language, and they do not run at the same speed.</p>
<h3>The equipment hierarchy</h3>
<p>ISA-95 also defines a naming hierarchy for physical assets: <b>Enterprise, Site, Area, Work center, Work unit</b>. On a packaging line the work center is usually the line and the work units are its machines. The hierarchy comes back later in the course, because many companies use it to name their data:</p>
<pre class="code">acme / dallas / packaging / line2 / labeler / state</pre>
<aside class="note watch"><b>Watch out</b>The pyramid is a model of functions, not a wiring diagram. Sources place PLCs at Level 1 or Level 2 depending on the model they follow, a modern PLC can host Level 3 functions, and a cloud service can perform MES tasks. Use the levels to agree on responsibilities, not to dictate hardware.</aside>`,
    keys:[`ISA-95 (IEC 62264) separates business planning (L4), manufacturing operations (L3) and control (L2 to L0).`,`Each level runs on its own time scale, from weeks down to milliseconds.`,`The equipment hierarchy (enterprise, site, area, work center, work unit) gives everyone a shared naming scheme.`] },
  { title:`From pyramid to network`, min:8,
    lab:{type:`p2p`, title:`Point-to-point vs hub`},
    body:`
<p>In a classic pyramid, data climbs one level at a time and every connection is a custom integration. The MES polls the PLC through one driver, the historian uses another, the quality system a third, and the ERP gets a nightly file. Every new application adds point-to-point links, and every machine change risks breaking them.</p>
<h3>The unified namespace</h3>
<p>A <b>unified namespace</b> (UNS) flips the model. Every system publishes its current state to one shared, structured hub, usually an MQTT broker, under a topic tree that follows the ISA-95 equipment hierarchy. Every system that needs data subscribes to it. Producers and consumers no longer need to know about each other.</p>
<!--LAB-->
<p>The UNS is an architecture pattern, not a product or a standard. It works best when topic structure and payload definitions are agreed up front, and when the hub carries current state and events. Long-term history still lives in historians and data platforms that subscribe to the hub.</p>
<h3>RAMI 4.0: the reference cube</h3>
<p>Germany's Plattform Industrie 4.0 published the <b>Reference Architectural Model Industrie 4.0</b> (RAMI 4.0, DIN SPEC 91345, 2016) to describe any Industry 4.0 component along three axes:</p>
<ul>
<li><b>Layers</b>: Asset, Integration, Communication, Information, Functional, Business. They separate the physical thing from its data, its functions and its business purpose.</li>
<li><b>Life cycle and value stream</b> (from IEC 62890): the <em>type</em> (development and maintenance of the design) and the <em>instance</em> (production, use and service of one specific unit).</li>
<li><b>Hierarchy levels</b> (from IEC 62264 and IEC 61512): Product, Field device, Control device, Station, Work centers, Enterprise, Connected world. The product itself and the connected world beyond the company are the Industry 4.0 additions.</li>
</ul>
<h3>The Asset Administration Shell</h3>
<p>The <b>Asset Administration Shell</b> (AAS, standardized as IEC 63278) is the practical result: a standard digital representation of an asset, built from <em>submodels</em> such as the digital nameplate, technical data, documentation and time-series data. The Industrial Digital Twin Association (IDTA) maintains the submodel templates.</p>
<aside class="note line"><b>On the line</b>A case packer builder ships the machine with an AAS. The plant imports the spare-parts list, the electrical documentation and the machine's PackML interface into its maintenance system and MES, instead of retyping them from PDF manuals.</aside>`,
    keys:[`Point-to-point integrations grow roughly with the square of the number of systems; a hub grows linearly.`,`A unified namespace is a shared, event-driven hub organized by the equipment hierarchy.`,`RAMI 4.0 describes components by layer, life cycle (type vs instance) and hierarchy level.`,`The Asset Administration Shell gives every asset a standard digital representation.`] },
  { title:`PackML: one language for packaging machines`, min:8,
    lab:{type:`packml`, title:`PackML state machine`},
    body:`
<p>A typical packaging line combines machines from five or six different builders. Without a standard, each machine has its own state names, its own start and stop logic, and its own way of reporting counts and faults. Integrating them into one line controller and one OEE system becomes a custom project every time.</p>
<p><b>PackML</b> (Packaging Machine Language) solves this. It is defined in the technical report <b>ISA-TR88.00.02</b>, developed with OMAC, the Organization for Machine Automation and Control. PackML gives every machine three common elements:</p>
<ul>
<li>A <b>state model</b> with 17 defined states and the commands that move between them.</li>
<li><b>Unit modes</b>: Production, Maintenance and Manual are standard; builders can add their own.</li>
<li><b>PackTags</b>: standard data tags grouped as <b>Command</b>, <b>Status</b> and <b>Admin</b>, so every machine exposes its state, speed, counts and alarms the same way.</li>
</ul>
<h3>Three types of state</h3>
<p><b>Acting states</b> end in "-ing" (Starting, Holding, Stopping). The machine is doing something and moves on by itself when the action finishes, which PackML calls <em>state complete</em> (SC). <b>Wait states</b> (Idle, Held, Suspended, Complete, Stopped, Aborted) wait for a command. <b>Execute</b> is where the machine makes product.</p>
<!--LAB-->
<h3>Held or Suspended?</h3>
<p>This distinction drives correct OEE and causes frequent confusion:</p>
<ul>
<li><b>Held</b>: an <em>internal</em> condition stops the machine, and it usually needs an operator. The film reel needs splicing; the glue tank is empty.</li>
<li><b>Suspended</b>: the machine is healthy, but <em>external</em> conditions stop it. It is starved by the machine upstream or blocked by the one downstream, and it resumes on its own when the condition clears.</li>
</ul>
<aside class="note std"><b>Standard</b>Example PackTags: <code>PackTags.Command.CntrlCmd</code> (2 = Start), <code>PackTags.Status.StateCurrent</code> (6 = Execute), <code>PackTags.Status.CurMachSpeed</code>, <code>PackTags.Admin.ProdProcessedCount</code> and <code>PackTags.Admin.ProdDefectiveCount</code>. An OPC UA companion specification for PackML exposes the same model over OPC UA.</aside>`,
    keys:[`PackML (ISA-TR88.00.02) standardizes machine states, unit modes and data tags.`,`Acting states finish on their own; wait states need a command; Execute makes product.`,`Held means an internal problem that needs attention; Suspended means external starvation or blockage.`,`Standard states let one line controller and one OEE system work across machines from different builders.`] }
  ],
  quiz:[
    {q:`At which ISA-95 level does the MES (manufacturing execution system) sit?`, o:[`Level 1`,`Level 2`,`Level 3`,`Level 4`], a:2, why:`Level 3 is manufacturing operations management: scheduling, dispatching, recipes, quality, genealogy and OEE.`},
    {q:`Twelve systems are integrated point-to-point, every system with every other. How many interfaces is that?`, o:[`12`,`24`,`66`,`144`], a:2, why:`n(n-1)/2 = 12 x 11 / 2 = 66. Through a central hub it would be 12 connections.`},
    {q:`A labeler stops because the case packer downstream is full. The labeler itself is fine. Which PackML state is correct?`, o:[`Held`,`Suspended`,`Stopped`,`Aborted`], a:1, why:`Suspended is for external conditions (starved or blocked). Held is for internal conditions that need attention.`},
    {q:`In RAMI 4.0, what does the "life cycle and value stream" axis distinguish?`, o:[`Type (the design) and instance (one specific unit)`,`Hardware and software`,`Business and asset layers`,`Field devices and control devices`], a:0, why:`Following IEC 62890, the axis separates the type (development, design maintenance) from each produced and used instance.`}
  ]
},
/* ---------- STATION 3 ---------- */
{ code:`Connectivity`, title:`Sensors, protocols and the edge`,
  blurb:`What the line can sense, how machines talk (IO-Link, OPC UA, MQTT, industrial Ethernet), and where computing belongs.`,
  lessons:[
  { title:`Sensors on a packaging line`, min:7,
    lab:{type:`classify`, title:`Pick the sensor`, data:{
      prompt:`Choose the most suitable sensor for each task.`,
      cats:[`Photoelectric`,`Inductive`,`Capacitive`,`Load cell`,`Vision`,`Accelerometer`],
      items:[
        {t:`Detect a missing aluminium cap at 600 bottles per minute.`, a:`Inductive`, why:`Inductive sensors react to metal at short range and switch fast, which suits metal caps.`},
        {t:`Check the juice level through the wall of a PET bottle.`, a:`Capacitive`, why:`Capacitive sensors detect liquids and non-metals, including through thin plastic walls. At very high speeds, X-ray or vision are alternatives.`},
        {t:`Reject bags that are underweight.`, a:`Load cell`, why:`A checkweigher weighs every pack in motion with load cells.`},
        {t:`Read and verify the lot code and expiry date printed on a carton.`, a:`Vision`, why:`Text verification (OCR/OCV) needs a camera and image processing.`},
        {t:`Warn about bearing wear in the case erector's gearbox.`, a:`Accelerometer`, why:`Bearing defects change the vibration signature long before the bearing fails.`},
        {t:`Count cartons passing on a conveyor.`, a:`Photoelectric`, why:`A photo-eye whose beam is broken by each carton is the classic counter.`}
      ]}},
    body:`
<p>Data starts with sensors. A single packaging line can carry hundreds of them, most of them simple on/off devices the PLC uses for control. Industry 4.0 asks more of them: not only "is something there?", but also "how well is this sensor working, and what else can it tell us?"</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Sensor</th><th>Measures</th><th>Typical packaging use</th></tr></thead>
<tbody>
<tr><td>Photoelectric (through-beam, retro-reflective, diffuse)</td><td>Presence, edges, gaps</td><td>Counting packs, gap control before a labeler, carton presence</td></tr>
<tr><td>Contrast and luminescence sensors</td><td>Print marks</td><td>Registration of printed film on flow wrappers and form-fill-seal machines</td></tr>
<tr><td>Inductive proximity</td><td>Nearby metal</td><td>Metal cap presence, machine part positions, home switches</td></tr>
<tr><td>Capacitive proximity</td><td>Non-metals, levels</td><td>Product level through plastic walls, carton blank stacks</td></tr>
<tr><td>Encoders</td><td>Position and speed</td><td>Conveyor tracking, film feed length, servo feedback</td></tr>
<tr><td>Load cells</td><td>Weight</td><td>Checkweighers, net-weight filling, dosing</td></tr>
<tr><td>Machine vision</td><td>Images</td><td>Code reading, label and print inspection, seal inspection</td></tr>
<tr><td>Thermocouples and RTDs</td><td>Temperature</td><td>Heat-seal jaws, shrink tunnels, hot-melt glue</td></tr>
<tr><td>Accelerometers</td><td>Vibration</td><td>Bearing and gearbox health on drives and pumps</td></tr>
<tr><td>RFID readers</td><td>Tagged IDs</td><td>Change-part verification, totes, returnable crates</td></tr>
</tbody></table></div>
<h3>IO-Link: smart sensors on a simple cable</h3>
<p><b>IO-Link</b> (IEC 61131-9) is a point-to-point digital interface between a sensor or actuator and an IO-Link master. It uses the same unshielded three-wire cable as a classic sensor, up to 20 m long. Besides the switching signal it carries measured values, parameters and diagnostics. Each device type comes with an <b>IODD</b> file (IO Device Description) that tells the system how to interpret its data.</p>
<p>Two benefits matter most on a packaging line. The master can store device parameters, so when a technician replaces a failed sensor, the new one is configured automatically. And the sensor can warn before it fails, for example a photo-eye reporting that its signal margin is falling because the lens is dirty.</p>
<aside class="note line"><b>On the line</b>RFID-tagged change parts let a machine check that the right star wheel or forming set is installed for the selected recipe. Wrong-part errors after a changeover become impossible instead of merely unlikely.</aside>
<!--LAB-->`,
    keys:[`Most line sensors are simple on/off devices; Industry 4.0 also uses their diagnostics and measured values.`,`IO-Link carries process data, parameters and diagnostics over a standard 3-wire cable.`,`Automatic re-parameterization makes sensor replacement fast and error-free.`] },
  { title:`Industrial protocols`, min:8,
    lab:{type:`classify`, title:`Protocol matcher`, data:{
      prompt:`Which protocol family fits each job best?`,
      cats:[`Industrial Ethernet`,`OPC UA`,`MQTT / Sparkplug`,`Modbus`],
      items:[
        {t:`Synchronize 24 servo axes on a cartoner with a 1 ms cycle.`, a:`Industrial Ethernet`, why:`Motion control needs deterministic real-time networks such as EtherCAT or PROFINET IRT.`},
        {t:`The MES needs to browse a filler's recipe parameters and counters, with their units and meaning.`, a:`OPC UA`, why:`OPC UA information models make data self-describing; a PackML companion specification standardizes it.`},
        {t:`Stream state changes from 400 devices in three plants to a central data platform over unreliable links.`, a:`MQTT / Sparkplug`, why:`A broker with publish/subscribe, report-by-exception and birth/death messages handles many devices and flaky networks.`},
        {t:`Read the setpoint of a 20-year-old temperature controller on a shrink tunnel.`, a:`Modbus`, why:`Many legacy controllers only speak Modbus RTU or TCP. A gateway can translate it for newer systems.`},
        {t:`Publish every machine's PackML state to the unified namespace so the OEE app and the andon board can subscribe.`, a:`MQTT / Sparkplug`, why:`A unified namespace is usually built on an MQTT broker that many applications subscribe to.`},
        {t:`A robot cell and a case packer from different builders must expose secure, standardized data models to the line controller.`, a:`OPC UA`, why:`Companion specifications plus built-in certificates and encryption make OPC UA the fit for standardized, secure machine models.`}
      ]}},
    body:`
<p>Industrial communication has two different jobs. <b>Control networks</b> move small amounts of data between controllers, drives and I/O with hard timing guarantees. <b>Information networks</b> move richer data to people and applications that need context more than microseconds. Industry 4.0 needs both, and the protocols reflect that.</p>
<h3>Control: fieldbus and industrial Ethernet</h3>
<p>PROFINET, EtherNet/IP, EtherCAT and Modbus TCP connect PLCs with drives, remote I/O and safety devices. EtherCAT and PROFINET IRT can synchronize dozens of servo axes with cycle times well under a millisecond, which motion-heavy machines such as cartoners and flow wrappers rely on. Older serial protocols such as Modbus RTU still connect temperature controllers and other legacy devices.</p>
<p><b>Time-Sensitive Networking</b> (TSN), a set of IEEE 802.1 standards, adds deterministic timing to standard Ethernet so that control traffic and IT traffic can share the same infrastructure.</p>
<h3>Information: OPC UA</h3>
<p><b>OPC UA</b> (IEC 62541) is a platform-independent standard for exchanging machine data with its meaning attached. A machine exposes an <em>information model</em> of objects, variables, methods and types, so a client can browse it and understand that a value is the filler's current speed in bottles per minute, not just register 40017. Security is built in through application certificates, signing and encryption. OPC UA supports both client/server and publish/subscribe communication.</p>
<p><b>Companion specifications</b> are agreed information models for a type of equipment: PackML, machine tools (umati), robotics, weighing systems and many more. Two machines that implement the same companion specification expose their data the same way.</p>
<h3>Information: MQTT and Sparkplug B</h3>
<p><b>MQTT</b> is a lightweight publish/subscribe protocol. Devices publish messages to <em>topics</em> on a broker, and any application subscribes to the topics it needs. Three quality-of-service levels control delivery: QoS 0 (at most once), QoS 1 (at least once) and QoS 2 (exactly once). MQTT copes well with many devices, unreliable links and event-driven data, and is the usual backbone of a unified namespace.</p>
<p>MQTT leaves the topic structure and payload format open. <b>Sparkplug B</b> (Eclipse Foundation, published as ISO/IEC 20237) fills that gap with a topic namespace, a compact payload encoding, and birth and death certificates that tell subscribers whether a device is online. Devices report by exception, publishing only when a value changes.</p>
<pre class="code">spBv1.0/dallas-line2/DDATA/filler-edge/filler01</pre>
<aside class="note std"><b>Complementary, not competing</b>A common pattern is OPC UA at the machine, where the rich models live, and MQTT to distribute data plant-wide and to the cloud. OPC UA PubSub can itself run over MQTT.</aside>
<!--LAB-->`,
    keys:[`Control networks (EtherCAT, PROFINET, EtherNet/IP) deliver deterministic real-time data.`,`OPC UA adds meaning and security through information models and companion specifications.`,`MQTT moves events to many subscribers through a broker; Sparkplug B standardizes topics, payloads and device state.`] },
  { title:`Edge, cloud and where computing belongs`, min:6,
    lab:{type:`classify`, title:`Where should it run?`, data:{
      prompt:`Decide where each workload belongs.`,
      cats:[`Machine control`,`Edge`,`Cloud`],
      items:[
        {t:`Fire the reject pusher at exactly the right moment for a bad pack.`, a:`Machine control`, why:`Timing-critical actuation belongs in the PLC, synchronized to the conveyor.`},
        {t:`Stop a servo axis when a guard door opens.`, a:`Machine control`, why:`Safety functions belong in certified safety controllers in the machine, never in edge or cloud software.`},
        {t:`Run a defect-detection model on camera images at 600 packs per minute.`, a:`Edge`, why:`High-volume images and sub-second decisions call for inference next to the camera.`},
        {t:`Keep collecting line data during a four-hour internet outage.`, a:`Edge`, why:`Local buffering at the edge keeps data safe until the connection returns.`},
        {t:`Compare OEE and downtime reasons across 14 plants.`, a:`Cloud`, why:`Cross-site analysis needs central data from every plant.`},
        {t:`Retrain the seal-defect model with a month of labelled images from all lines.`, a:`Cloud`, why:`Training is heavy, occasional and benefits from elastic central computing. The trained model then runs at the edge.`}
      ]}},
    body:`
<p>Once data flows, you have to decide where to process it. There are three broad places:</p>
<ul>
<li><b>Machine control</b>: PLCs, drives and safety controllers inside the machine. Deterministic, and the only right place for safety functions and fast control loops.</li>
<li><b>Edge</b>: industrial PCs, gateways and servers on the plant network, close to the machines. Low latency, local autonomy, raw data stays on site.</li>
<li><b>Cloud</b>: central, elastic computing and storage. Good for comparing many lines and plants, heavy training jobs and long-term storage.</li>
</ul>
<h3>Five questions to decide</h3>
<div class="tbl-wrap"><table>
<thead><tr><th>Question</th><th>Pushes toward</th></tr></thead>
<tbody>
<tr><td>How fast must it react?</td><td>Milliseconds: machine control. Sub-second: edge. Minutes or more: the cloud is fine.</td></tr>
<tr><td>How much raw data is there?</td><td>High-volume streams (vision, vibration): process at the edge, send results.</td></tr>
<tr><td>Must it run when the internet is down?</td><td>Yes: edge or machine.</td></tr>
<tr><td>Do you need data from many sites together?</td><td>Yes: cloud.</td></tr>
<tr><td>Is it a safety function?</td><td>Always machine control, on certified safety hardware.</td></tr>
</tbody></table></div>
<p>A common pattern for AI is <b>train in the cloud, run at the edge</b>. Images from all lines feed model training centrally; the trained model is deployed to an edge device beside each camera, where it decides in milliseconds.</p>
<p>Wireless is extending what the edge can reach. Private 5G networks and Wi-Fi 6 connect mobile robots, handheld devices and retrofit sensors without new cabling, and 5G defines ultra-reliable low-latency communication (URLLC) for some control tasks.</p>
<!--LAB-->`,
    keys:[`Safety and fast control stay in the machine; high-volume and autonomous processing goes to the edge; cross-site analysis and training go to the cloud.`,`Train in the cloud, run at the edge.`,`Latency, data volume, autonomy, scope and safety decide the placement.`] }
  ],
  quiz:[
    {q:`What is the main advantage of IO-Link over a plain discrete sensor?`, o:[`It reaches several kilometres over fibre`,`It carries parameters and diagnostics, so a replacement device can be configured automatically`,`It removes the need for a PLC`,`It is wireless`], a:1, why:`IO-Link adds process data, parameters and diagnostics on a standard cable; the master can re-parameterize a replaced device.`},
    {q:`Which MQTT quality-of-service level guarantees "exactly once" delivery?`, o:[`QoS 0`,`QoS 1`,`QoS 2`,`QoS 3`], a:2, why:`QoS 0 is at most once, QoS 1 at least once, QoS 2 exactly once.`},
    {q:`What is an OPC UA companion specification?`, o:[`A security certificate for OPC UA servers`,`A standard information model for a type of equipment, so machines of that type expose data the same way`,`A wireless extension of OPC UA`,`A replacement for MQTT`], a:1, why:`Companion specifications (PackML, umati, robotics, weighing and more) standardize information models per domain.`},
    {q:`A vision system captures 12-megapixel images ten times a second. What is the best architecture?`, o:[`Send every raw image to the cloud for inspection`,`Run inspection at the edge and send results and selected images to the cloud`,`Run the model inside the safety PLC`,`Store images on the camera and review them weekly`], a:1, why:`High data volume and fast decisions favour edge inference; the cloud gets results and samples for analysis and retraining.`}
  ]
},
