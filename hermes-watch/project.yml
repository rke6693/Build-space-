# XcodeGen spec — `xcodegen generate` turns this into Hermes.xcodeproj.
#
# Kept as YAML rather than a checked-in .pbxproj on purpose: a generated project
# file is unreviewable in a diff, and this is the part of the app most likely to
# be edited by hand in Xcode and then lost.
#
#   brew install xcodegen && xcodegen generate && open Hermes.xcodeproj
#
# Set DEVELOPMENT_TEAM (below or in Xcode) before building to a device; the
# simulator needs nothing.

name: Hermes
options:
  bundleIdPrefix: com.hermes.relay
  deploymentTarget:
    watchOS: "11.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    # `targeted`, not `complete`: the AVFoundation and WatchConnectivity
    # callback surfaces this app builds on are not Sendable-annotated.
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM: ABCDE12345

targets:
  # --------------------------------------------------------------------------
  # watchOS app — independent: it reaches the relay over Wi-Fi/LTE with no
  # iPhone present, which is the whole point on an Ultra 2 with cellular.
  # --------------------------------------------------------------------------
  HermesWatch:
    type: application
    platform: watchOS
    sources:
      - path: HermesWatch
      - path: HermesKit
    info:
      path: HermesWatch/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        WKApplication: true
        # Independent: the watch reaches the relay on its own over Wi-Fi/LTE.
        WKRunsIndependentlyOfCompanionApp: true
        WKWatchOnly: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hermes.relay.capture
            CFBundleURLSchemes: [hermes]
        NSMicrophoneUsageDescription: >-
          Hermes listens when you press the button so it can turn what you say
          into a reminder, task or note.
        NSSpeechRecognitionUsageDescription: >-
          Speech is transcribed on your watch. Only the resulting text is sent,
          and only to the relay you paired with.
        NSHealthShareUsageDescription: ""
        HermesKeychainAccessGroup: $(AppIdentifierPrefix)com.hermes.relay.shared
        HermesAppGroup: group.com.hermes.relay
    entitlements:
      path: HermesWatch/HermesWatch.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hermes.relay.shared
        com.apple.security.application-groups:
          - group.com.hermes.relay
    dependencies:
      - target: HermesWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes.relay.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        WATCHOS_DEPLOYMENT_TARGET: "11.0"

  # --------------------------------------------------------------------------
  # Complications / Smart Stack
  # --------------------------------------------------------------------------
  HermesWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: HermesWatchWidgets
      - path: HermesKit
    info:
      path: HermesWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        HermesKeychainAccessGroup: $(AppIdentifierPrefix)com.hermes.relay.shared
        HermesAppGroup: group.com.hermes.relay
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HermesWatchWidgets/HermesWatchWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hermes.relay.shared
        com.apple.security.application-groups:
          - group.com.hermes.relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes.relay.watchkitapp.widgets
        WATCHOS_DEPLOYMENT_TARGET: "11.0"

  # --------------------------------------------------------------------------
  # iPhone app — pairing only. Everything after that happens on the watch.
  # --------------------------------------------------------------------------
  HermesPhone:
    type: application
    platform: iOS
    sources:
      - path: HermesPhone
      - path: HermesKit
    info:
      path: HermesPhone/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        HermesKeychainAccessGroup: $(AppIdentifierPrefix)com.hermes.relay.shared
        HermesAppGroup: group.com.hermes.relay
        # The relay is HTTPS-only; no ATS exceptions are needed or wanted.
    entitlements:
      path: HermesPhone/HermesPhone.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hermes.relay.shared
        com.apple.security.application-groups:
          - group.com.hermes.relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes.relay
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"

  # --------------------------------------------------------------------------
  # Tests — the cross-language signing contract with the relay.
  # --------------------------------------------------------------------------
  HermesKitTests:
    type: bundle.unit-test
    platform: iOS
    # A standalone logic-test bundle: it compiles the HermesKit sources itself
    # rather than hosting an app, so there is no duplicate-symbol ambiguity.
    sources:
      - path: HermesKitTests
      - path: HermesKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes.relay.tests
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"

schemes:
  Hermes (Watch):
    build:
      targets:
        HermesWatch: all
    run:
      config: Debug
  Hermes (Phone):
    build:
      targets:
        HermesPhone: all
        HermesKitTests: [test]
        # `xcodebuild test -scheme "Hermes (Phone)"` runs the signing contract.
    test:
      config: Debug
      targets:
        - HermesKitTests
